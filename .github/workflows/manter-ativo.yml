name: Manter o robô ativo

# O GitHub pausa tarefas agendadas de projetos sem mudanças há 60 dias.
# Duas vezes por mês este passo registra a data num arquivo, e o robô de lembretes continua ligado.
on:
  schedule:
    - cron: '23 14 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Registrar a data
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > robo/ultima-verificacao.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo/ultima-verificacao.txt
          git commit -m "Robô ativo: verificação automática" || exit 0
          git push
