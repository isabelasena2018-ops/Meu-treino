name: Regras do banco

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'mostrar ou publicar'
        default: 'mostrar'
  push:
    branches: [main]
    paths: ['firestore.rules']

jobs:
  regras:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        working-directory: robo
        run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Regras
        working-directory: robo
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          ACAO: ${{ github.event_name == 'push' && 'publicar' || inputs.acao }}
        run: node regras-banco.mjs
