name: Login por e-mail

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'mostrar ou ligar'
        default: 'mostrar'

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        working-directory: robo
        run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - name: Login por e-mail
        working-directory: robo
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          ACAO: ${{ inputs.acao }}
        run: node login-email.mjs
