 const head=(k,t)=>`<button class="back" data-a="go" data-v="treinos">← Treinos</button><span class="kicker">Avaliação · ${g.step} de ${TOT}${g.quick?' · versão rápida':''}</span><h2 class="disp h2">${t}</h2>${bar}${g.step>=2&&g.step<=5&&!g.quick?'<div style="text-align:right;margin:-6px 0 10px"><button class="small" style="font-weight:700;color:var(--a)" data-a="genSkip">Pular o resto e ver minha análise ⏩</button></div>':''}`;
 if(g.step===1)return head(1,'Sobre você 🙂')+`
  ${D.profile&&D.profile.saude&&(D.profile.planDays||[]).length?`<div class="card" style="border:1.5px solid var(--a)"><b style="color:var(--a)">Já tenho suas respostas da última vez 😉</b><p class="small mut" style="margin:4px 0 10px">Pode revisar etapa por etapa ou pular direto pra análise.</p><button class="btn sm" data-a="genSkip">⏩ Pular pra análise</button></div>`:''}
  <div class="info">💡 Leva uns 3 minutos e tudo é opcional: o treino sai mesmo assim. Mas quanto mais você contar, mais certeiro ele fica.</div>
  ${!(D.profile&&D.profile.saude&&(D.profile.planDays||[]).length)?`<button class="ckcard" data-a="genQuick" style="border-color:var(--a);background:var(--asoft)"><span class="em">⚡</span><span><b style="color:var(--a)">Tá com pressa? Versão rápida</b><span>Só 3 perguntas: o que você quer priorizar, onde treina e quantos dias. Dá pra completar o resto depois.</span></span></button>`:''}
  <div class="card">
  <label class="lbl" style="margin-top:0">Sexo <span class="mut" style="font-weight:500">(usado só pra estimar a % de gordura)</span></label>
  <div class="chips">${chip(g.sexo==='f','genSexo','data-v="f"','Feminino')}${chip(g.sexo==='m','genSexo','data-v="m"','Masculino')}${chip(g.sexo==='n','genSexo','data-v="n"','Prefiro não dizer')}</div>
  <div class="row2">${inp('idade','Idade','ex: 29','numeric')}${inp('altura','Altura (cm)','ex: 170','numeric')}${inp('peso','Peso (kg)','ex: 80')}${inp('cintura','Cintura (cm)','na altura do umbigo')}</div>
  </div><div class="card"><b>⚖️ Tem balança de bioimpedância?</b>
   <p class="small mut" style="margin:4px 0 0">Mande um print da tela de resultados do app da balança que eu leio os números sozinha. Também dá pra falar os números.</p>
   ${bioBoxHtml('gen')}
   <div class="row2">${inp('gordura','% de gordura','ex: 32')}${inp('musculo','Massa muscular (kg)','ex: 26')}${inp('visceral','Gordura visceral','ex: 7')}${inp('agua','Água corporal (%)','ex: 50')}</div>
  <p class="small mut" style="margin:12px 0 0">Tudo isso fica só no seu celular.</p></div>`+nav();
 if(g.step===2){const fl=healthFlags(g);return head(2,'Sua saúde 💛')+`<div class="card"><p class="small mut" style="margin:0 0 8px">Perguntas de segurança, como as que as academias fazem. Responda com sinceridade: elas só ficam no seu celular.</p>
  ${PARQ.map(([k,l])=>`<button class="toggle ${g.parq[k]?'on':''}" data-a="genParq" data-k="${k}"><span style="font-weight:500;font-size:14px">${l}</span><span class="tg"></span></button>`).join('')}
  ${fl.length?'<div class="info" style="margin-top:10px">💛 Pelo que você marcou, o ideal é <b>conversar com um médico antes de começar</b> e, se possível, treinar com acompanhamento de um profissional. Vou montar uma versão mais leve e segura.</div>':''}
  <label class="lbl">Alguma dor ou lesão que incomoda?</label>
  <div class="chips">${chip(g.lim.includes('joelho'),'genLim','data-v="joelho"','🦵 Joelho')}${chip(g.lim.includes('lombar'),'genLim','data-v="lombar"','🔙 Lombar')}${chip(g.lim.includes('ombro'),'genLim','data-v="ombro"','💪 Ombro')}${chip(!g.lim.length,'genLim','data-v="nada"','Nada')}</div>
  ${g.lim.length?'<p class="small mut" style="margin:8px 0 0">Vou deixar de fora os exercícios que mais sobrecarregam essa região. Se a dor não passa, vale passar com um médico ou fisioterapeuta.</p>':''}</div>`+nav();}
 if(g.step===3){const subs=g.foci.filter(k=>AREAS[k]&&AREAS[k].sub.length).map(k=>`<div style="margin-top:10px"><span class="small mut" style="font-weight:700">${AREAS[k].e} ${({gluteo:'No glúteo',pernas:'Nas pernas',costas:'Nas costas',braco:'Nos braços',ombro:'Nos ombros',peito:'No peito',barriga:'Na barriga'})[k]||'Em '+AREAS[k].l.toLowerCase()}, quer focar mais em:</span><div class="chips" style="margin-top:6px">${AREAS[k].sub.map(([v,l])=>chip((g.sub[k]||'todo')===v,'genSub',`data-k="${k}" data-v="${v}"`,l)).join('')}</div></div>`).join('');
  return head(3,'Seu objetivo 🎯')+`<div class="card">
  <label class="lbl" style="margin-top:0">Objetivo principal</label><div class="chips">${Object.entries(OBJ).map(([k,o])=>chip(g.obj===k,'genObj',`data-k="${k}"`,o.l)).join('')}</div>
  ${g.obj==='emagrecer'?`<label class="lbl">Sua meta <span class="mut" style="font-weight:500">(preencha uma ou nenhuma)</span></label><div class="row2">${inp('metaPeso','Peso meta (kg)','ex: 70')}${inp('metaGordura','% de gordura meta','ex: 25')}</div>`:''}
  <label class="lbl">O que você quer priorizar? <span class="mut" style="font-weight:500">(até 3)</span></label>
  <div class="chips">${Object.entries(AREAS).map(([k,a])=>chip(g.foci.includes(k),'genFocus',`data-f="${k}"`,a.e+' '+a.l)).join('')}</div>${subs}</div>`+nav(g.foci.length>0);}
 if(g.step===4)return head(4,'Onde você treina 📍')+`<div class="card">
  <div class="chips">${chip(g.local==='academia'&&!g.gymBasic,'genWhere','data-v="full"','🏋️ Academia completa')}${chip(g.local==='academia'&&g.gymBasic,'genWhere','data-v="basic"','🏢 Academia com poucos aparelhos')}${chip(g.local==='casa','genWhere','data-v="casa"','🏠 Em casa')}</div>
  ${g.local==='academia'&&g.gymBasic?`<label class="lbl">O que tem na sua academia?</label><div class="chips">${GYM_EQ.map(([k,l])=>chip(g.gymEq.includes(k),'genGymEq',`data-v="${k}"`,l)).join('')}</div><p class="small mut" style="margin:8px 0 0">Exercícios com o peso do corpo sempre entram.</p>`:''}
  ${g.local==='casa'?`<label class="lbl">O que você tem em casa?</label><div class="chips">${chip(g.homeEq.includes('halter'),'genEq','data-v="halter"','Halteres (ou galões com peso)')}${chip(g.homeEq.includes('elastico'),'genEq','data-v="elastico"','Elástico / mini band')}${chip(g.homeEq.includes('kettlebell'),'genEq','data-v="kettlebell"','Kettlebell')}${chip(!g.homeEq.length,'genEq','data-v="nada"','Nada, só o corpo')}</div>`:''}</div>`+nav();
 if(g.step===5)return head(5,'Sua rotina 🗓️')+`<div class="card">
  <label class="lbl" style="margin-top:0">Quantos dias por semana?</label><div class="chips">${[2,3,4,5,6].map(n=>chip(g.days.length===n,'genCount',`data-n="${n}"`,n+' dias')).join('')}</div>
  ${g.days.length?`<label class="lbl">Em quais dias? <span class="mut" style="font-weight:500">(toque pra trocar)</span></label><div class="chips">${DAYS.map(([k,l])=>chip(g.days.includes(k),'genDay',`data-k="${k}"`,l.slice(0,3))).join('')}</div>`:''}
  <label class="lbl">Quanto tempo por treino?</label><div class="chips">${[[30,'30 min'],[45,'45 min'],[60,'1 hora'],[75,'1h15 ou mais']].map(([v,l])=>chip(g.tempo===v,'genTempo',`data-v="${v}"`,l)).join('')}</div>
  <label class="lbl">Há quanto tempo você treina?</label><div class="chips">${chip(g.nivel==='iniciante','genLvl','data-v="iniciante"','🌱 Estou começando')}${chip(g.nivel==='intermediario','genLvl','data-v="intermediario"','💪 Já treino há um tempo')}</div></div>`+nav(g.days.length>=2,g.quick?'Montar meu treino ✨':'Ver minha análise →');
 /* passo 6: análise */
 const A=bodyAnalysis(g),G=goalPlan(g,A),fl=healthFlags(g);const nome=(D.profile&&D.profile.nome)||'';
 const rceTxt=A.rce?(A.rce<0.5?'✅ Adequada (abaixo de 0,5)':A.rce<0.6?'⚠️ Atenção (entre 0,5 e 0,6)':'⚠️ Acima do recomendado (0,6 ou mais)'):'';
 return head(6,'Sua análise 📊')+`
 ${A.bf||A.rce?`<div class="card"><b>Composição corporal</b>
  ${A.bf?`<div class="hrow"><span>% de gordura</span><b>${String(A.bf).replace('.',',')}%${A.cls?' · '+A.cls:''}</b></div><p class="small mut" style="margin:4px 0 0">${A.bfSrc}${A.bfSrc.includes('estimada')?'. É uma estimativa: uma bioimpedância ou avaliação física dá um número mais preciso.':''}</p>`:''}
  ${A.rce?`<div class="hrow"><span>Relação cintura/altura</span><b>${String(A.rce).replace('.',',')}</b></div><p class="small mut" style="margin:4px 0 0">${rceTxt}. Esse indicador mostra melhor que o IMC a gordura na região da barriga, que é a que mais pesa pra saúde.</p>`:''}
  ${gnum(g,'musculo')?`<div class="hrow"><span>Massa muscular</span><b>${String(gnum(g,'musculo')).replace('.',',')} kg</b></div>`:''}
  ${gnum(g,'visceral')?`<div class="hrow"><span>Gordura visceral</span><b>${String(gnum(g,'visceral')).replace('.',',')}${gnum(g,'visceral')<10?' · ✅ normal':gnum(g,'visceral')<15?' · ⚠️ alta':' · ⚠️ muito alta'}</b></div><p class="small mut" style="margin:4px 0 0">Na maioria das balanças, até 9 é considerado normal. É a gordura entre os órgãos, e ela responde bem a treino + alimentação.</p>`:''}</div>`:'<div class="info">Sem altura e cintura não consigo analisar a composição corporal. Dá pra voltar na etapa 1 e preencher, ou seguir assim mesmo.</div>'}
 <div class="card"><b>🎯 Sua meta</b><p style="margin:6px 0 0;font-size:14.5px;line-height:1.55">${G.txt}</p>
  ${G.metaPeso&&!gnum(g,'metaPeso')&&G.metaBf?`<p class="small mut" style="margin:6px 0 0">Pra chegar em ${G.metaBf}% de gordura mantendo os músculos, isso dá mais ou menos ${String(G.metaPeso).replace('.',',')} kg.</p>`:''}</div>
 ${fl.length?'<div class="info">💛 Pelas suas respostas de saúde, vou montar uma versão <b>mais leve</b>. Antes de começar, converse com um médico e, se puder, tenha acompanhamento de um profissional de educação física.</div>':''}
 ${A.idade&&A.idade<16?'<div class="info">Pra quem tem menos de 16 anos, o ideal é treinar com a orientação de um professor. Vou montar uma versão leve.</div>':''}
 <div class="card"><b>💪 Como chegar lá</b><ol class="steps" style="margin-top:8px">
  <li><b>Constância vale mais que perfeição.</b> ${g.days.length} treinos por semana, toda semana, ganham de 6 numa semana e 0 na outra.</li>
  <li><b>A alimentação faz a maior parte</b> do resultado no peso. Se puder, passe com um nutricionista.</li>
  <li><b>Refaça as medidas a cada 4 semanas</b> no Progresso. A balança oscila; cintura e fotos mostram a evolução de verdade.</li>
  <li><b>Progrida aos poucos:</b> quando bater o topo das repetições, aumente a carga.</li></ol>
  <p style="margin:8px 0 0;font-weight:700;color:var(--a)">Bora${nome?', '+esc(nome):''}? A primeira semana é a mais difícil. Depois vira rotina 🔥</p></div>
 <div class="btnrow"><button class="btn2" data-a="genStep" data-d="-1">← Voltar</button><button class="btn alt" data-a="genRun">✨ Gerar meu treino</button></div>`;}

function genPreview(){const g=UI.gen;const ini=g.nivel==='iniciante';
 const vol=weekVolume(g.result);const prio=new Set(g.foci.flatMap(f=>AREA2VOL[f]||[]));const eq=g.foci.includes('corpo');
 const volRows=Object.keys(VOLL).filter(k=>vol[k]>0||prio.has(k)).map(k=>{const isP=prio.has(k)||eq;const [lo,hi]=isP?(ini?[8,16]:[12,26]):[4,16];
  const st=vol[k]<lo?'<span style="color:var(--a2);font-weight:700">↑ dá pra subir</span>':vol[k]>hi?'<span style="color:var(--a2);font-weight:700">↓ acima do ideal</span>':'<span style="color:var(--a);font-weight:700">✓ no ponto</span>';
  return `<div class="hrow" style="padding:8px 2px"><span style="font-size:14px">${VOLL[k]}${isP?' <span class="tag" style="font-size:10.5px">prioridade</span>':''}</span><span style="display:flex;gap:8px;align-items:center;font-size:13px"><b>${vol[k]} séries</b>${st}</span></div>`;}).join('');
 const notes=[];
 if(g.local==='academia'&&g.gymBasic)notes.push('🏢 Só entraram exercícios com o que tem na sua academia, mais os de peso do corpo.');
 if(healthFlags(g).length)notes.push('💛 Versão mais leve por causa das respostas de saúde. Converse com um médico antes de começar.');
 if(g.local==='casa')notes.push('🏠 Só entraram exercícios que dá pra fazer em casa com '+(g.homeEq.length?g.homeEq.map(e=>({halter:'halteres',elastico:'elástico',kettlebell:'kettlebell'})[e]).join(', '):'o peso do corpo')+'.');
 if(g.lim.includes('joelho'))notes.push('🦵 Deixei de fora agachamentos, afundos, leg press e extensora, que exigem mais do joelho. Fortalecer o quadríceps costuma fazer parte da melhora, mas precisa ser ajustado pro seu caso: vale passar com um fisioterapeuta.');
 if(g.lim.includes('lombar'))notes.push('🔙 Evitei exercícios que carregam a coluna (agachamento livre, stiff com barra, remada curvada…).');
 if(g.lim.includes('ombro'))notes.push('💪 Evitei desenvolvimentos, mergulho e exercícios com o braço muito acima da cabeça.');
 const tips=g.foci.filter(f=>AREAS[f]&&AREAS[f].t).slice(0,3).map(f=>`<p style="margin:0 0 8px"><b>${AREAS[f].e} ${AREAS[f].l}:</b> ${AREAS[f].t}</p>`).join('');
 return `<button class="back" data-a="genBack">← Ajustar respostas</button>
 <span class="kicker">Sua semana · ${g.days.length} dias · ~${g.tempo>=75?'75+':g.tempo} min</span><h2 class="disp h2">Seu treino está pronto 🎉</h2>
 <div class="aviso"><b>🤝 Esse treino é uma sugestão pra você começar.</b> Antes de seguir, mostre pro seu professor ou personal: ele conhece seu corpo de perto e pode ajustar exercícios, cargas e volume. O app não substitui profissional de educação física, nutricionista ou médico.</div>
 ${notes.length?`<div class="info">${notes.join('<br>')}</div>`:''}
 ${g.result.map(w=>`<div class="card"><span class="kicker" style="color:var(--a)">${DAYM[w.day]}</span><h3 style="margin:3px 0 6px;font-size:17px">${esc(w.name)}</h3>
  ${w.items.map(it=>`<div style="padding:9px 2px;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><button style="text-align:left;font-size:14.5px;font-weight:700;flex:1" data-a="info" data-id="${it.exId}">${EX[it.exId].tier===1?'⭐ ':''}${esc(EX[it.exId].n)} <span class="mut" style="font-weight:500">ⓘ</span></button><span class="sch" style="white-space:nowrap">${esc(it.sets)}</span></div>
   <div class="small mut" style="margin-top:3px">🎯 ${EX[it.exId].foco.slice(0,2).map(r=>REG[r]||r).join(' + ')} · ${esc(it.why)}</div></div>`).join('')}</div>`).join('')}
 <div class="card"><b>📊 Volume semanal</b><p class="small mut" style="margin:4px 0 6px">Séries por músculo na semana. Pra prioridade, o ideal é ${ini?'8 a 16':'12 a 26'} (contando pela metade os exercícios que ajudam indiretamente). Pra manutenção, de 4 a 16.</p>${volRows}</div>
 ${tips?`<div class="info">${tips}⏱️ ${OBJ[g.obj].rest} Progrida aos poucos: quando bater o topo das repetições em todas as séries, suba a carga.</div>`:''}
 <button class="btn2" style="margin-bottom:10px" data-a="genAgain">🔄 Gerar outra variação</button>
 ${D.workouts.length?`<button class="btn alt" data-a="genUse" data-m="replace">Usar esses treinos (substituir os atuais)</button><button class="btn2" style="margin-top:10px" data-a="genUse" data-m="add">Adicionar sem apagar os atuais</button>`:`<button class="btn alt" data-a="genUse" data-m="replace">Usar esses treinos 💪</button>`}
 <p class="small mut" style="text-align:center">Dá pra editar qualquer treino depois e trocar exercícios com o botão 🔄. Este é um apoio: um profissional de educação física pode ajustar o treino pra você e corrigir a execução.</p>`;}
function measHtml(){
 const ms=[...(D.measures||[])].sort((a,b)=>a.date.localeCompare(b.date));
 const rows=MEAS2().filter(([k])=>ms.some(m=>m[k]!=null)).map(([k,l,u])=>{const f=ms.find(m=>m[k]!=null),la=[...ms].reverse().find(m=>m[k]!=null);const d=la[k]-f[k];
  return `<div class="hrow"><span>${l}</span><span style="display:flex;gap:8px;align-items:center">${f!==la&&d?`<span class="small" style="font-weight:700;color:${d<0?'var(--a)':'var(--a2)'}">${d<0?'▼':'▲'} ${Math.abs(d).toFixed(1)}</span>`:''}<b>${String(la[k]).replace('.',',')} ${u}</b></span></div>`;}).join('');
 return `<h3 class="h3">📏 Medidas</h3>
 ${ms.length?`<div class="card" style="padding:4px 14px">${rows}<p class="small mut" style="margin:8px 0">Última medição: ${fmt(ms[ms.length-1].date)}${ms.length>1?' · comparando com '+fmt(ms[0].date):''}</p></div>`:''}
 <details class="card"><summary><span>${ms.length?'Registrar novas medidas':'Registrar medidas (opcional)'}</span><span class="chev">▾</span></summary>
  ${bioBoxHtml('mea')}
  <div class="row2">${MEAS2().map(([k,l,u])=>`<div><label class="lbl">${l} (${u})</label><input class="inp" inputmode="decimal" data-i="mea.${k}" value="${esc(UI.mea[k]||'')}"></div>`).join('')}</div>
  <button class="btn sm" style="margin-top:12px" data-a="saveMeas">Salvar medidas</button>
  <p class="small mut" style="margin:10px 0 0">Meça a cada 2 a 4 semanas, no mesmo horário. Às vezes a balança para, mas a cintura diminui 😉</p></details>`;}

function vLib(){
 return `${segTE('exercicios')}<span class="kicker">Biblioteca · ${Object.keys(EX).length} exercícios</span><h2 class="disp h2">Exercícios</h2>
 <input class="inp" data-i="lib.q" placeholder="🔎 Buscar exercício…" value="${esc(UI.libQuery)}" style="margin-bottom:10px">
 <div class="chips" style="margin-bottom:12px"><button class="chip ${UI.libGroup==='todos'?'on':''}" data-a="lg" data-g="todos">Todos</button>${Object.entries(GROUPS).map(([k,l])=>`<button class="chip ${UI.libGroup===k?'on':''}" data-a="lg" data-g="${k}">${l}</button>`).join('')}</div>
 <div id="liblist">${libList()}</div>`;
}
function libList(){
 const q=UI.libQuery.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const items=Object.entries(EX).filter(([id,x])=>(UI.libGroup==='todos'||x.g===UI.libGroup)&&(!q||x.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q)));
 if(!items.length)return '<div class="empty">Nenhum exercício encontrado.</div>';
 return items.map(([id,x])=>`<button class="li" data-a="info" data-id="${id}"><span><b>${esc(x.n)}</b><span>${x.s.split('.')[0]}</span></span><span class="tag">${GROUPS[x.g]}</span></button>`).join('');
}
function infoHtml(id){const x=EX[id];
 return `<span class="kicker">${GROUPS[x.g]} · ${EQL[x.eq]}${x.kf?'':' · exige do joelho'}</span><h2 class="disp" style="font-size:24px;margin:2px 40px 8px 0;font-weight:600">${esc(x.n)}</h2>
 <div class="chips" style="margin-bottom:10px"><span class="tag">${TIERL[x.tier]}</span>${x.foco.map(r=>`<span class="tag" style="background:var(--a2soft);color:var(--a2)">🎯 ${REG[r]||GROUPS[r]||r}</span>`).join('')}</div>
 ${NOTE4[id]?`<div class="info">${NOTE4[id]}</div>`:''}
 <div class="sec"><h4>👣 Como fazer</h4><ol>${x.p.map(s=>`<li>${s}</li>`).join('')}</ol></div>
 <div class="sec ok"><h4>✅ O que você deve sentir</h4><p>${x.s}</p></div>

/* ---------- Progresso ---------- */
function chart(pts,goal){
 if(pts.length<2)return '';
 const W=320,H=180,L=34,R=12,T=16,B=26;
 const vals=pts.map(p=>p.v).concat(goal!=null?[goal]:[]);
 let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1;}const pv=(mx-mn)*.15;mn-=pv;mx+=pv;
 const n=pts.length;const sx=i=>L+i*(W-L-R)/(n-1);const sy=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
 const line=pts.map((p,i)=>sx(i).toFixed(1)+','+sy(p.v).toFixed(1)).join(' ');
 let lab='';pts.forEach((p,i)=>{if(n<=6||i===0||i===n-1||i===Math.floor(n/2))lab+=`<text x="${sx(i)}" y="${H-8}" font-size="10" style="fill:var(--mut)" text-anchor="middle">${p.l}</text>`;});
 const g=goal!=null?`<line x1="${L}" y1="${sy(goal)}" x2="${W-R}" y2="${sy(goal)}" stroke="#E8633A" stroke-dasharray="4 4"/><text x="${W-R}" y="${sy(goal)-5}" font-size="10" fill="#E8633A" text-anchor="end">meta ${goal}</text>`:'';
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
  <text x="${L-6}" y="${T+4}" font-size="10" style="fill:var(--mut)" text-anchor="end">${mx.toFixed(0)}</text><text x="${L-6}" y="${H-B}" font-size="10" style="fill:var(--mut)" text-anchor="end">${mn.toFixed(0)}</text>
  <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" style="stroke:var(--line)"/>${g}
  <polyline points="${line}" fill="none" style="stroke:var(--a)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map((p,i)=>`<circle cx="${sx(i)}" cy="${sy(p.v)}" r="4" style="fill:var(--a)"/>`).join('')}${lab}</svg>`;
}
function vProg(){
 const p=D.profile;const s=[...D.weights].sort((a,b)=>a.date.localeCompare(b.date));
 const start=p.pesoInicial||(s[0]&&s[0].weight)||null;const cur=s.length?s[s.length-1].weight:start;const goal=p.meta||null;
 let pct=0;if(start&&goal&&cur&&start!==goal)pct=Math.min(100,Math.max(0,(start-cur)/(start-goal)*100));
 const diff=start&&cur?(start-cur):0;
 const exWith=Object.keys(D.history).filter(k=>EX[k]&&D.history[k].length);
 if(UI.progEx&&!exWith.includes(UI.progEx))UI.progEx='';
 const sel=UI.progEx||exWith[0]||'';
 const eh=sel?[...D.history[sel]].sort((a,b)=>a.date.localeCompare(b.date)):[];
 const best=eh.length?Math.max(...eh.map(e=>e.weight)):null;
 const rev=[...s].reverse().slice(0,8);
 return `<span class="kicker">Evolução</span><h2 class="disp h2">Progresso</h2>
 <button class="ckcard" data-a="weekShare" style="border-color:var(--a);background:var(--asoft)"><span class="em">🗓️</span><span><b style="color:var(--a)">Resumo da semana</b><span>Uma imagem com tudo o que você fez na semana. Você escolhe o que aparece.</span></span></button>
 <button class="ckcard" data-a="evoShare" style="border-color:var(--a2)"><span class="em">📈</span><span><b>Relatório de evolução</b><span>O quanto você evoluiu: peso, medidas, cargas, corrida e constância. Fica mais completo quanto mais você registra.</span></span></button>
 <div class="card dark">
  <div style="display:flex;justify-content:space-between;align-items:flex-end">
   <div><div style="font-size:12.5px;opacity:.8;font-weight:600">Peso atual</div><div class="disp" style="font-size:42px;font-weight:600;line-height:1">${nf(cur)}<span style="font-size:17px"> kg</span></div></div>
   <div style="text-align:right"><div style="font-size:12.5px;opacity:.8;font-weight:600">${diff>=0?'Já perdeu':'Ganhou'}</div><div class="disp" style="font-size:28px;font-weight:600;color:var(--a2);line-height:1">${nf(Math.abs(diff))} kg</div></div>
  </div>
  ${goal&&start?`<div style="margin-top:16px"><div class="bar"><div class="barfill" style="width:${pct}%"></div></div><div style="display:flex;justify-content:space-between;font-size:11.5px;opacity:.8;margin-top:6px;font-weight:600"><span>${nf(start)} kg</span><span>${Math.round(pct)}%</span><span>meta ${nf(goal)} kg</span></div></div>`:`<p class="small" style="opacity:.8;margin:12px 0 0">Coloque peso inicial e meta no seu perfil pra ver a barra de progresso.</p>`}
 </div>
 <div style="display:flex;gap:9px;margin-bottom:12px"><input class="inp" id="wnew" inputmode="decimal" placeholder="Pesei hoje… (kg)" style="background:var(--card)"><button class="btn" style="width:auto;padding:0 20px" data-a="saveWeight">Salvar</button></div>
 ${s.length>=2?`<div class="card" style="padding:12px 6px 4px">${chart(s.map(e=>({l:fmt(e.date),v:e.weight})),goal)}</div>`:'<div class="card empty">Registre seu peso alguns dias pra ver o gráfico 📉</div>'}
 ${rev.length?'<div class="card" style="padding:4px 14px">'+rev.map((e,i)=>{const pr=rev[i+1];const d=pr?e.weight-pr.weight:null;return `<div class="hrow"><span class="mut">${fmt(e.date)}</span><span style="display:flex;gap:8px;align-items:center">${d?`<span class="small" style="font-weight:700;color:${d<0?'var(--a)':'var(--a2)'}">${d<0?'▼':'▲'} ${nf(Math.abs(d))}</span>`:''}<b>${nf(e.weight)} kg</b><button class="ib del" data-a="delWeight" data-d="${e.date}">×</button></span></div>`;}).join('')+'</div>':''}
 <p class="small mut" style="text-align:center">Pese-se no mesmo horário (de manhã, em jejum), 1-2x por semana. Olhe a tendência, não o dia a dia 🌿</p>
 ${measHtml()}
 <h3 class="h3">Evolução de carga</h3>
 ${exWith.length?`<select class="inp" data-c="prog.ex" style="background:var(--card);margin-bottom:10px">${exWith.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${esc(EX[k].n)}</option>`).join('')}</select>
  <div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="mut small">Melhor carga</span><b>${best} kg</b></div>
  ${eh.length>=2?chart(eh.map(e=>({l:fmt(e.date),v:e.weight}))):'<p class="small mut" style="margin:0">Registre esse exercício em mais treinos pra ver o gráfico.</p>'}</div>`:'<div class="card empty">Quando você salvar cargas nos treinos, a evolução aparece aqui 💪</div>'}`;
}

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const NUMW={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,quinze:15,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,noventa:90};
const KW=[['corrida',/\b(corri|corrida|correr|correndo|cooper)/],['caminhada',/\b(caminh|andei|andando|anda de)/],['bike',/\b(bike|bicicleta|pedal|spinning|ciclismo)/],['natacao',/\b(nadei|natacao|nadar|piscina)/],['yoga',/\b(yoga|ioga)/],['pilates',/\bpilates/],['danca',/\b(danc|zumba|ballet|bale)/],['funcional',/\b(funcional|crossfit|cross|hiit|aerobico)/],['luta',/\b(luta|muay|boxe|jiu|karate|judo)/],['alongamento',/\b(along|mobilidade)/],['esporte',/\b(futebol|volei|basquete|tenis|beach|padel|handebol)/],['musculacao',/\b(academia|musculacao|treinei|malhei|treino d|treino de|gluteo|perna|costas|superiores|braco|peito|ombro)/]];
const PER=[['manhã',/\b(manha|cedo|acordei)/],['almoço',/\balmoc/],['tarde',/\btarde\b/],['noite',/\bnoite\b/]];
function prep(s){let t=norm(s).replace(/pre[- ]?treino/g,' pretreino ');
 t=t.replace(/uma hora e meia/g,'90 min').replace(/meia hora/g,'30 min').replace(/uma hora/g,'60 min');
 t=t.replace(/\b(um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|quinze|vinte|trinta|quarenta|cinquenta|sessenta|noventa)\b/g,m=>NUMW[m]);
 t=t.replace(/\b(\d+) e (\d)\b/g,(m,a,b)=>+a>=20?String(+a+ +b):m);
 t=t.replace(/meio litro/g,'500 ml').replace(/(\d+) litros? e meio/g,(m,a)=>(+a*1000+500)+' ml').replace(/meia (garraf|squeeze)/g,'0.5 $1').replace(/mililitros?/g,'ml');
 return t;}
function detAct(c){for(const [k,re] of KW)if(re.test(c))return k;return null;}
function detPer(c){for(const [k,re] of PER)if(re.test(c))return k;return '';}
function detMin(c){let m=c.match(/(\d+)\s*h\s*(\d+)/);if(m)return +m[1]*60+ +m[2];m=c.match(/(\d+)\s*(min|minutos?)\b/);if(m)return +m[1];m=c.match(/(\d+)\s*(h|horas?)\b/);if(m)return +m[1]*60;return null;}
function recMl(re,def){const r=recips().find(x=>re.test(norm(x.n)));return r&&r.ml?r.ml:def;}
function detWater(t){let total=0,found=false;const re=/(\d+(?:[.,]\d+)?)\s*(ml|litros?|l|garrafas?|garrafinhas?|squeezes?|copos?)\b/g;let m;
 while((m=re.exec(t))){const n=parseFloat(m[1].replace(',','.'));const u=m[2];const after=t.slice(re.lastIndex,re.lastIndex+18);
  if(/^copo/.test(u)&&/\b(suco|leite|cafe|refri|cerveja|vinho|cha|whey|vitamina)/.test(after))continue;
  if(u==='ml'&&!(n>=30&&n<=5000))continue;
  total+=u==='ml'?n:/^l/.test(u)?n*1000:/garraf/.test(u)?n*recMl(/garraf/,500):/squeeze/.test(u)?n*recMl(/squeeze/,600):n*recMl(/copo/,250);found=true;}
 return found?Math.round(total):null;}
function parseMeals(s){
 const out={};const re=/(caf[eé] da manh[aã]|caf[eé]|almo[cç]o|almocei|jantar|jantei|janta|lanches?|lanchei)/gi;const mk=[];let m;
 while((m=re.exec(s))){const w=norm(m[0]);const pre=norm(s.slice(Math.max(0,m.index-12),m.index));
  const header=/(almocei|jantei|lanchei)/.test(w)||m.index<3||/[.;!?\n,]\s*$/.test(pre)||/\b(no|na|de|do|pro|pra|o|meu|minha|ao)\s*$/.test(pre);
  if(header)mk.push({i:m.index,end:re.lastIndex,w});}
 mk.forEach((x,j)=>{
  const before=norm(s.slice(Math.max(0,x.i-30),x.i));
  if(x.w.startsWith('almoc')&&/(trein|fui|corr|caminh|academia|horario|hora do|na hora|malh)/.test(before))return;
  let seg=s.slice(x.end,j+1<mk.length?mk[j+1].i:s.length).split(/[.;!?\n]/)[0];
  const parts=seg.split(',');const kept=[];
  for(const p of parts){const np=prep(p);if(kept.length&&(detAct(np)||/agua|creatina|whey|vacuo|pretreino|copo|trein/.test(np)))break;kept.push(p);}
  seg=kept.join(',').replace(/^[\s,:\-]*(eu\s+)?(comi|tomei|foi|teve|era|fiz)?\s*/i,'').replace(/[\s,]*(e|eu|tomei|comi|bebi|no|na|de)?\s*$/i,'').trim();
  if(seg.length<3)return;
  const k=x.w.startsWith('caf')?'cafe':x.w.startsWith('almoc')?'almoco':x.w.startsWith('jant')?'jantar':'lanches';
  out[k]=out[k]?out[k]+'; '+seg:seg;});
 return out;}
function parseDay(txt){
 const t=prep(txt);const r={acts:[],supps:{},agua:null,meals:parseMeals(txt),ontrack:null,none:false,notYet:false,add:/\b(mais|outra|outro|de novo)\b/.test(t)};
 const cl=t.split(/[,.;!?\n]|\be depois\b|\bdepois\b|\be tambem\b|\bmas\b|\bporem\b|\bso que\b/).map(s=>s.trim()).filter(Boolean);
 let last=null;
 for(const c of cl){
  const neg=/\b(nao|esqueci|sem)\b/.test(c);
  if(neg&&/\b(trein|fui|malhei|fiz|consegui|deu|rolou|academia)/.test(c)&&!/\b(nao|esqueci) (tomei|bebi)/.test(c)){r.none=true;if(/\bainda\b/.test(c))r.notYet=true;continue;}
  if(/\b(descansei|dia de descanso|folga)\b/.test(c)){r.none=true;continue;}
  c.split(/\b(?:mas|porem|so que)\b/).forEach(part=>{const ng=/\b(nao|esqueci|sem|faltou)\b/.test(part);
   [['creatina',/creatina/],['whey',/whey|proteina|shake/],['pre',/pretreino/],['vacuo',/vacuo/]].forEach(([k,re])=>{if(re.test(part))r.supps[k]=!ng;});});
  const a=detAct(c);const mi=detMin(c),pe=detPer(c);
  if(a&&!/pretreino|comi|almocei|jantei/.test(c.replace(/pretreino/,'')+'')){
   const prev=r.acts.find(x=>x.type===a);
   if(prev){if(mi&&!prev.minutes)prev.minutes=mi;if(pe&&!prev.period)prev.period=pe;last=prev;}
   else{last={type:a,minutes:mi,period:pe};if(a==='musculacao'){const h=(c.match(/\b(costas|gluteo|perna|pernas|quadriceps|posterior|peito|ombro|ombros|braco|bracos|biceps|triceps|superiores|inferiores|abdomen|barriga)\b/)||[])[1];if(h)last.hint=h;}r.acts.push(last);}
  }else if(last&&(mi||pe)&&!/copo|agua|litro/.test(c)){if(mi&&!last.minutes)last.minutes=mi;if(pe&&!last.period)last.period=pe;}
 }
 if(r.acts.length)r.none=false;
 r.agua=detWater(t);
 if(/comi (bem|direitinho|certinho)|alimentacao (boa|ok)|segui a dieta/.test(t))r.ontrack=true;
 if(/comi mal|exagerei|besteira|fugi da dieta|jaquei|comi muito doce/.test(t))r.ontrack=false;
 return r;}

function ckTodayWorkout(){const t=today();return D.workouts.find(w=>w.day===todayDay()&&!D.activities.some(a=>a.date===t&&a.workoutId===w.id))||null;}
function ckSaveAct(a){const t=today();
 if(a.type==='musculacao'&&!a.workoutId){
  const HINT={costas:/costas|pull/,gluteo:/glut/,perna:/quadr|infer|perna|poster/,pernas:/quadr|infer|perna|poster/,quadriceps:/quadr|infer|perna/,posterior:/poster/,peito:/peito|superior|push/,ombro:/ombro|superior|peito/,ombros:/ombro|superior|peito/,braco:/bra[cç]|b[ií]ceps|tr[ií]ceps|superior/,bracos:/bra[cç]|b[ií]ceps|tr[ií]ceps|superior/,biceps:/b[ií]ceps|costas|bra/,triceps:/tr[ií]ceps|peito|bra/,superiores:/superior/,inferiores:/infer|perna|glut|quadr/,abdomen:/abd/,barriga:/abd/};
  let w=null;if(a.hint){const re=HINT[a.hint];w=D.workouts.find(x=>re&&re.test(norm(x.name)))||null;if(!w)a.name='Treino de '+a.hint;}else w=ckTodayWorkout();
  if(w){a.workoutId=w.id;a.name=w.name;}}
 const ex=a.workoutId&&D.activities.find(x=>x.date===t&&x.workoutId===a.workoutId);
 let rec;if(ex){Object.assign(ex,{minutes:a.minutes||ex.minutes,period:a.period||ex.period});rec=ex;}
 else{rec={id:uid(),ts:Date.now(),date:t,type:a.type||'outro',name:a.name||'',workoutId:a.workoutId||'',minutes:a.minutes||null,period:a.period||'',intensity:'moderada'};D.activities.push(rec);}
 persist();return rec;}
function ckNeedFix(rec){if(!rec)return;CK.fix=CK.fix||[];if(!CK.fix.includes(rec.id)&&(!rec.minutes||(!rec.workoutId&&!rec.titled)))CK.fix.push(rec.id);}
const actRec=id=>D.activities.find(a=>a.id===id);
const actNm=a=>{const t=ACTM[a.type]||ACTM.outro;return (a.name||t[1]).toLowerCase();};
const FEM=['caminhada','corrida','bike','natacao','yoga','danca','luta','musculacao'];
const actFem=a=>a.name?/a$/.test(actNm(a).split(' ')[0]):FEM.includes(a.type);
const TITLE_EX={caminhada:'Caminhada no parque',corrida:'Corrida na orla',bike:'Pedal com a galera',yoga:'Yoga da manhã',natacao:'Natação no clube',danca:'Aula de dança',funcional:'Funcional na praça',luta:'Treino de muay thai',alongamento:'Alongamento antes de dormir',esporte:'Vôlei com os amigos',musculacao:'Treino de perna',pilates:'Pilates no estúdio'};
function actLine(a){const t=ACTM[a.type]||ACTM.outro;return `${t[2]} ${a.name||t[1]}${a.minutes?' · '+a.minutes+' min':''}${a.km?' · '+String(a.km).replace('.',',')+' km':''}${a.period?' · '+a.period:''}`;}
const ckOnSupps=()=>SUPPS.filter(s=>D.profile.supps&&D.profile.supps[s.k]);
const hourNow=()=>new Date().getHours();
const MEALQ={cafe:['☕','café da manhã'],almoco:['🍽️','almoço'],lanches:['🍎','lanche'],jantar:['🌙','jantar']};

 q:()=>{const c=dayCheck(today());const cur=c.meals&&c.meals[k];return cur?`No ${MEALQ[k][1]} você já anotou: "${cur}". Quer acrescentar algo?`:`${MEALQ[k][0]} E no ${MEALQ[k][1]}, o que você comeu?`;},

 ans:(v,txt)=>{if(!txt)return;const c=dayCheck(today());c.meals=c.meals||{};c.meals[k]=c.meals[k]?c.meals[k]+'; '+txt:txt;persist();}};}

/* ================== CORRIDA ================== */
/* etapas: w=aquecer c=desaquecer r=correr k=caminhar e=leve s=acelerar t=ritmo moderado/forte */
const WARM=['w',300],COOL=['c',300];
const ivl=(run,walk,reps)=>{const o=[];for(let i=0;i<reps;i++){o.push(['r',run*60]);if(i<reps-1||walk)o.push(['k',walk*60]);}if(o.length&&o[o.length-1][0]==='k')o.pop();return o;};
const cont=min=>[['r',min*60]];
const strides=(easyMin,n)=>{const o=[['e',easyMin*60]];for(let i=0;i<n;i++){o.push(['s',20]);o.push(['e',70]);}return o;};
const tempo=(reps,fast,easy)=>{const o=[['e',600]];for(let i=0;i<reps;i++){o.push(['t',fast*60]);o.push(['e',easy*60]);}return o;};
const BASE=[ /* [nome A, etapas A, nome B, etapas B] — começa bem leve */
 ['8 × (1 min correndo + 2 min andando)',ivl(1,2,8),'10 × (1 min correndo + 2 min andando)',ivl(1,2,10)],
 ['10 × (1 min correndo + 1 min andando)',ivl(1,1,10),'12 × (1 min correndo + 1 min andando)',ivl(1,1,12)],
 ['10 × (1 min correndo + 30 s andando)',ivl(1,0.5,10),'8 × (1min30 correndo + 1 min andando)',ivl(1.5,1,8)],
 ['8 × (1min30 correndo + 1 min andando)',ivl(1.5,1,8),'6 × (2 min correndo + 1 min andando)',ivl(2,1,6)],
 ['7 × (2 min correndo + 1 min andando)',ivl(2,1,7),'5 × (3 min correndo + 1min30 andando)',ivl(3,1.5,5)],
 ['5 × (3 min correndo + 1min30 andando)',ivl(3,1.5,5),'4 × (4 min correndo + 2 min andando)',ivl(4,2,4)],
 ['4 × (5 min correndo + 1min30 andando)',ivl(5,1.5,4),'3 × (6 min correndo + 2 min andando)',ivl(6,2,3)],
 ['3 × (7 min correndo + 1min30 andando)',ivl(7,1.5,3),'2 × (10 min correndo + 2 min andando)',ivl(10,2,2)],
 ['2 × (10 min correndo + 1 min andando)',ivl(10,1,2),'2 × (12 min correndo + 1 min andando)',ivl(12,1,2)],
 ['18 min sem parar',cont(18),'2 × (14 min correndo + 1 min andando)',ivl(14,1,2)],
 ['22 min sem parar',cont(22),'25 min sem parar',cont(25)],
 ['25 min sem parar',cont(25),'🏅 30 min sem parar',cont(30)],
 ['20 min leve + 4 acelerações (semana mais leve)',strides(20,4),'25 min leve (semana mais leve)',cont(25)],
 ['25 min leve + 5 acelerações',strides(25,5),'35 min leve',cont(35)],
 ['28 min leve + 6 acelerações',strides(28,6),'40 min leve',cont(40)]];
function runLevel(n){
 if(n<=BASE.length){const b=BASE[n-1];return {n,phase:n<=12?'Base: chegar nos 30 min sem parar':'Construindo distância',recovery:n===13,A:{name:b[0],steps:b[1]},B:{name:b[2],steps:b[3]}};}
 /* depois da base: corrida longa cresce ~10% por semana, com uma semana mais leve a cada 4 */
 let long=40,k=BASE.length;const seq=[];
 while(k<n){k++;const cyc=(k-BASE.length)%4;if(cyc===0){seq.push({long:Math.round(long*0.8),rec:true});}else{long=Math.min(120,Math.round(long*1.1));seq.push({long,rec:false});}}
 const cur=seq[seq.length-1];const easy=Math.min(45,28+Math.floor((n-BASE.length)/2)*2);
 const A=cur.rec?{name:easy+' min leve (semana mais leve)',steps:cont(easy)}:(n%2?{name:'Ritmo: 10 min leve + 3 × (5 min forte + 2 min leve)',steps:tempo(3,5,2)}:{name:easy+' min leve + 6 acelerações',steps:strides(easy,6)});
 const B={name:(cur.long>=60?'🏅 ':'')+cur.long+' min leve (corrida longa)'+(cur.rec?' · semana mais leve':''),steps:cont(cur.long)};
 return {n,phase:'Indo cada vez mais longe',recovery:cur.rec,A,B};}
const RUN_START={nunca:1,pausas:3,base:12};
function runPlan(){const p=D.run||null;if(p&&!p.v2){p.lvl=p.lvl===1?1:p.lvl===2?5:p.lvl+3;p.v2=true;p.done={};try{localStorage.setItem(LS,JSON.stringify(D));}catch(e){}}return p;}
function runKeys(){const p=runPlan();const d=(p&&p.days)||2;return d>=4?['A','B','C','D']:d===3?['A','B','C']:['A','B'];}
function runSession(key){const L=runLevel(D.run.lvl);if(key==='A'||key==='B')return L[key];
 const easy=L.n<7?L.A:{name:'Corrida leve',steps:cont(Math.max(15,Math.round(stepsMin(L.B.steps)*0.6)))};return {name:easy.name+' (leve extra)',steps:easy.steps};}
const stepsMin=st=>Math.round(st.reduce((a,s)=>a+s[1],0)/60);
function fullSteps(st){return [WARM].concat(st,[COOL]);}
function nextRunKey(){const p=runPlan();if(!p)return null;return runKeys().find(k=>!p.done[k])||runKeys()[0];}
const fmtDur=sec=>{sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}h${String(m).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;};
const fmtPace=(sec,km)=>{if(!km||km<0.2)return '—';const p=sec/km;return `${Math.floor(p/60)}:${String(Math.round(p%60)).padStart(2,'0')}/km`;};
const kmStr=km=>(Math.round(km*100)/100).toFixed(2).replace('.',',');
const STEP_L={w:'Caminhada pra aquecer',c:'Caminhada pra desaquecer',r:'Correndo',k:'Caminhando',e:'Corrida leve',s:'Acelera!',t:'Ritmo forte'};
const STEP_C={w:'var(--a)',c:'var(--a)',r:'var(--a2)',k:'var(--a)',e:'var(--a2)',s:'#c0453a',t:'#c0453a'};
function stepSay(k,sec,last){const m=Math.floor(sec/60),r=Math.round(sec%60);const d=m===0?sec+' segundos':r===30?(m===1?'1 minuto e meio':m+' minutos e meio'):r===0?(m===1?'1 minuto':m+' minutos'):(m===1?'1 minuto':m+' minutos')+' e '+r+' segundos';
 return {w:'Vamos começar! Caminhe '+d+' pra aquecer, num ritmo firme.',c:'Muito bem! Agora caminhe '+d+' pra desaquecer.',r:(last?'Último tiro! ':'')+'Corra por '+d+', no ritmo de conversa.',k:'Caminhe '+d+' e recupere o fôlego.',e:'Corrida leve por '+d+'.',s:'Acelere por 20 segundos, sem dar tudo!',t:'Ritmo moderado a forte por '+d+'. Você consegue falar só algumas palavras.'}[k];}

/* ---------- corrida guiada ---------- */
let RUN=null;
function beep(f,ms){try{const a=RUN&&RUN.ac;if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=0.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+ms/1000);}catch(e){}}
function runSay(t){if(!RUN||RUN.mute)return;speakAll([t]);}
async function keepAwake(){try{if('wakeLock' in navigator&&RUN&&!RUN.paused){RUN.wl=await navigator.wakeLock.request('screen');}}catch(e){}}
function haversine(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function runStart(key,mode){
 const ses=key==='livre'?{name:'Corrida livre',steps:[['r',3600*3]]}:runSession(key);
 const steps=key==='livre'?ses.steps:fullSteps(ses.steps);
 RUN={key,mode,name:ses.name,steps,idx:0,t0:Date.now(),pausedMs:0,paused:false,pauseT:0,said:{},km:0,last:null,kmSaid:0,mute:D.tts===false,pts:[],elev:0,altS:null,altB:null,splits:[],splitT:0};
 try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){RUN.ac=new AC();RUN.ac.resume&&RUN.ac.resume();}}catch(e){}
 hush();keepAwake();
 runWatch();
 runSay(key==='livre'?'Corrida livre! Vou marcando seu tempo.':'Bora! Treino '+key+' do nível '+D.run.lvl+'.');
 go('correndo');RUN.tick=setInterval(runTick,250);runTick();}
function runWatch(){if(!RUN||RUN.mode!=='rua'||!navigator.geolocation)return;
 try{RUN.watch=navigator.geolocation.watchPosition(p=>{if(!RUN||RUN.paused)return;const c=p.coords;if(c.accuracy>35)return;const pt={lat:c.latitude,lon:c.longitude,t:p.timestamp};
   if(RUN.last){const d=haversine(RUN.last,pt);const dt=(pt.t-RUN.last.t)/1000;if(dt>0&&d/dt*1000<7&&d>0.003){RUN.km+=d;RUN.last=pt;runTrack(c);}else if(dt>20)RUN.last=pt;}else{RUN.last=pt;runTrack(c);}
   const k=Math.floor(RUN.km);if(k>RUN.kmSaid){RUN.kmSaid=k;const el=runElapsed();RUN.splits.push(Math.round(el-RUN.splitT));RUN.splitT=el;runSay(k+(k===1?' quilômetro':' quilômetros')+'. Ritmo de '+fmtPace(el,RUN.km).replace('/km',' por quilômetro').replace(':',' e ')+'.');}
  },()=>{RUN.gpsErr=true;},{enableHighAccuracy:true,maximumAge:2000,timeout:15000});}catch(e){RUN.gpsErr=true;}}
function runTrack(c){/* guarda o percurso e a subida acumulada (altitude suavizada, ignora oscilação menor que 4 m) */
 if(RUN.pts.length<4000)RUN.pts.push([Math.round(c.latitude*1e5)/1e5,Math.round(c.longitude*1e5)/1e5]);
 if(c.altitude!=null&&(c.altitudeAccuracy==null||c.altitudeAccuracy<25)){const a=c.altitude;RUN.altS=RUN.altS==null?a:RUN.altS*0.75+a*0.25;
  if(RUN.altB==null)RUN.altB=RUN.altS;else if(RUN.altS-RUN.altB>=4){RUN.elev+=RUN.altS-RUN.altB;RUN.altB=RUN.altS;}else if(RUN.altB-RUN.altS>=4)RUN.altB=RUN.altS;}}
/* a corrida fica salva enquanto acontece: se a tela bloquear e o celular fechar o app, ela continua de onde parou */
const RUN_KEY='meutreino:run';
function runPersist(){if(!RUN)return;try{const o={};for(const k in RUN){if(!['ac','wl','tick','watch'].includes(k))o[k]=RUN[k];}localStorage.setItem(RUN_KEY,JSON.stringify(o));}catch(e){}}
function runRestore(){try{const o=JSON.parse(localStorage.getItem(RUN_KEY)||'null');if(!o||!o.t0||!D.profile)return;
 if(Date.now()-o.t0>6*3600e3){localStorage.removeItem(RUN_KEY);return;}
 RUN=Object.assign(o,{restored:true,tick:null,watch:null,ac:null,wl:null});UI.view='correndo';keepAwake();runWatch();RUN.tick=setInterval(runTick,250);}catch(e){}}
function thinPts(pts,max){if(!pts||pts.length<=max)return pts||[];const st=pts.length/max;const o=[];for(let i=0;i<max;i++)o.push(pts[Math.floor(i*st)]);o.push(pts[pts.length-1]);return o;}
function routeSVG(pts,h){if(!pts||pts.length<2)return '';const la=pts.map(p=>p[0]),lo=pts.map(p=>p[1]);const k=Math.cos((Math.min(...la)+Math.max(...la))/2*Math.PI/180);
 const W=320,H=h||170,pd=14;const minX=Math.min(...lo)*k,maxX=Math.max(...lo)*k,minY=Math.min(...la),maxY=Math.max(...la);const sc=Math.min((W-2*pd)/Math.max(maxX-minX,1e-6),(H-2*pd)/Math.max(maxY-minY,1e-6));
 const ox=(W-(maxX-minX)*sc)/2,oy=(H-(maxY-minY)*sc)/2;const P=p=>[(ox+(p[1]*k-minX)*sc).toFixed(1),(oy+(maxY-p[0])*sc).toFixed(1)];const a=P(pts[0]),b=P(pts[pts.length-1]);
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Percurso da corrida"><polyline points="${pts.map(p=>P(p).join(',')).join(' ')}" fill="none" stroke="#E8633A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${a[0]}" cy="${a[1]}" r="5" fill="#0F4C45" stroke="#fff" stroke-width="2"/><circle cx="${b[0]}" cy="${b[1]}" r="5" fill="#E8633A" stroke="#fff" stroke-width="2"/></svg>`;}
function splitsHtml(sp){if(!sp||!sp.length)return '';const best=Math.min(...sp);return `<div class="card"><b style="font-size:14px">Parciais por km</b>${sp.map((x,i)=>`<div style="display:flex;align-items:center;gap:10px;margin-top:8px"><span class="small mut" style="width:38px">km ${i+1}</span><div style="flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden"><div style="height:100%;width:${Math.round(best/x*100)}%;background:${x===best?'var(--a2)':'var(--a)'};border-radius:8px"></div></div><b style="font-size:13px;width:44px;text-align:right">${fmtDur(x)}</b></div>`).join('')}</div>`;}
function runElapsed(){if(!RUN)return 0;const now=RUN.paused?RUN.pauseT:Date.now();return (now-RUN.t0-RUN.pausedMs)/1000;}
function runPos(el){let acc=0;for(let i=0;i<RUN.steps.length;i++){const d=RUN.steps[i][1];if(el<acc+d)return {i,left:acc+d-el,into:el-acc,dur:d};acc+=d;}return {i:RUN.steps.length,left:0,into:0,dur:0};}
function runTick(){if(!RUN)return;const el=runElapsed();const P=runPos(el);if(!RUN.ps||Date.now()-RUN.ps>4000){RUN.ps=Date.now();runPersist();}
 if(P.i>=RUN.steps.length){runFinish(true);return;}
 const [k,dur]=RUN.steps[P.i];
 if(!RUN.said['s'+P.i]){RUN.said['s'+P.i]=1;const lastRun=k==='r'&&!RUN.steps.slice(P.i+1).some(s=>s[0]==='r');if(P.i>0){beep(880,180);}runSay(stepSay(k,dur,lastRun&&RUN.steps.filter(s=>s[0]==='r').length>1));}
 if(dur>=240&&'ret'.includes(k)&&!RUN.said['h'+P.i]&&P.into>=dur/2){RUN.said['h'+P.i]=1;runSay('Metade! Tá indo muito bem.');}
 if(dur>=900&&(k==='r'||k==='e')){const q=Math.floor(P.into/300);if(q>0&&P.left>60&&!RUN.said['q'+P.i+'_'+q]){RUN.said['q'+P.i+'_'+q]=1;runSay('Faltam '+Math.round(P.left/60)+' minutos. Continua no ritmo de conversa.');}}
 const sl=Math.ceil(P.left);if(sl<=3&&sl>=1&&!RUN.said['c'+P.i+'_'+sl]){RUN.said['c'+P.i+'_'+sl]=1;beep(sl===1?660:520,120);}
 const nx=RUN.steps[P.i+1];const tot=RUN.steps.reduce((a,s)=>a+s[1],0);
 const g=id=>document.getElementById(id);
 if(g('run-label')){g('run-label').textContent=STEP_L[k];g('run-label').style.color=STEP_C[k];g('run-left').textContent=fmtDur(P.left);
  g('run-next').textContent=nx?'Depois: '+STEP_L[nx[0]].toLowerCase()+' · '+fmtDur(nx[1]):'Última etapa! 🎉';
  g('run-total').textContent=RUN.key==='livre'?fmtDur(el):fmtDur(el)+' de '+fmtDur(tot);g('run-bar').style.width=(RUN.key==='livre'?0:Math.min(100,el/tot*100))+'%';
  g('run-stepbar').style.width=Math.min(100,P.into/dur*100)+'%';g('run-stepbar').style.background=STEP_C[k];
  if(g('run-km'))g('run-km').textContent=RUN.mode==='rua'?(RUN.gpsErr&&!RUN.km?'GPS indisponível':kmStr(RUN.km)+' km · '+fmtPace(el,RUN.km)):'Esteira';
  g('run-pause').textContent=RUN.paused?'▶ Continuar':'⏸ Pausar';}}
function runStopAll(){try{localStorage.removeItem(RUN_KEY);}catch(e){}if(!RUN)return;clearInterval(RUN.tick);if(RUN.watch!=null)try{navigator.geolocation.clearWatch(RUN.watch);}catch(e){}try{RUN.wl&&RUN.wl.release();}catch(e){}try{RUN.ac&&RUN.ac.close();}catch(e){}}
function runFinish(completed){if(!RUN)return;const el=runElapsed();runStopAll();
 if(completed)runSay('Treino concluído! Arrasou! 🎉');else hush();
 UI.runEnd={key:RUN.key,name:RUN.name,mode:RUN.mode,sec:Math.round(el),km:RUN.mode==='rua'?Math.round(RUN.km*100)/100:null,pts:RUN.mode==='rua'?thinPts(RUN.pts,400):null,elev:RUN.mode==='rua'&&RUN.altB!=null?Math.round(RUN.elev):null,splits:RUN.mode==='rua'?RUN.splits:null,completed,feel:'',pain:'nenhuma',painWhere:'',note:'',kmInput:''};
 RUN=null;go('corrida_fim');}
document.addEventListener('visibilitychange',()=>{if(!RUN)return;if(document.visibilityState==='visible'){keepAwake();runTick();if(UI.view==='correndo')toast('Sua corrida continua ✓');}else runPersist();});

/* ---------- progressão ---------- */
function runApply(r){const p=runPlan();const msgs=[];if(!p||!['A','B','C','D'].includes(r.ses))return msgs;
 if(r.pain==='forte'){if(p.lvl>1)p.lvl--;p.done={};msgs.push('Com dor forte, voltei um nível e zerei a semana. Descanse 2 a 3 dias. Se a dor continuar ou piorar, procure um fisioterapeuta ou médico 💛');return msgs;}
 if(!r.completed){msgs.push('Tudo bem não completar! Esse treino continua te esperando na próxima.');return msgs;}
 if(r.feel==='dificil'){const prev=(D.runs||[]).filter(x=>x.id!==r.id&&['A','B','C','D'].includes(x.ses)).slice(-1)[0];
  if(prev&&prev.feel==='dificil'&&p.lvl>1){p.lvl--;p.done={};msgs.push('Duas corridas difíceis seguidas: desci um nível pra você ganhar base com conforto. Isso não é voltar atrás, é construir com segurança 💛');return msgs;}
  msgs.push('Foi puxado? Normal! Vou repetir esse treino na próxima, pra seu corpo se adaptar. Avançar devagar é o que evita lesão.');return msgs;}
 p.done[r.ses]=true;
 if(r.pain==='leve')msgs.push('Dor leve: fique de olho. Se aparecer de novo na próxima corrida, descanse um dia a mais.');
 if(runKeys().every(k=>p.done[k])){p.lvl++;p.done={};const L=runLevel(p.lvl);msgs.push('🎉 Subiu pro nível '+p.lvl+'! '+(L.recovery?'Essa semana é mais leve, pro corpo absorver a evolução.':'Próximo desafio: '+L.B.name.replace('🏅 ','')+'.'));}
 else msgs.push('Treino '+r.ses+' concluído ✓ Falta '+runKeys().filter(k=>!p.done[k]).join(' e ')+' pra subir de nível.');
 return msgs;}
function runSave(e){
 const km=e.km!=null&&e.km>0?e.km:num(e.kmInput);
 const r={id:uid(),ts:Date.now(),date:today(),ses:e.key,lvl:runPlan()?runPlan().lvl:null,name:e.name,sec:e.sec,km:km||null,mode:e.mode,feel:e.feel||'ok',pain:e.pain||'nenhuma',painWhere:e.painWhere||'',note:(e.note||'').trim(),completed:!!e.completed};
 if(e.pts&&e.pts.length>1)r.pts=e.pts;if(e.elev!=null)r.elev=e.elev;if(e.splits&&e.splits.length)r.splits=e.splits;
 D.runs=D.runs||[];D.runs.push(r);UI.lastRunId=r.id;
 D.activities.push({id:uid(),ts:Date.now(),date:r.date,type:'corrida',name:e.key==='livre'?'Corrida livre':'Corrida · nível '+r.lvl+' '+e.key,minutes:Math.round(r.sec/60),km:r.km,period:periodNow(),intensity:r.feel==='dificil'?'intensa':r.feel==='facil'?'leve':'moderada',runId:r.id,titled:true});
 const msgs=runApply(r);persist();return msgs;}

/* ---------- estatísticas ---------- */
function runStats(){const R=(D.runs||[]).filter(r=>r.sec>0);const withKm=R.filter(r=>r.km>0);
 const best=withKm.filter(r=>r.km>=2).map(r=>r.sec/r.km).sort((a,b)=>a-b)[0]||null;
 const longest=withKm.map(r=>r.km).sort((a,b)=>b-a)[0]||0;const longestMin=R.map(r=>r.sec).sort((a,b)=>b-a)[0]||0;
 const r5=withKm.filter(r=>r.km>=5).map(r=>r.sec/r.km*5).sort((a,b)=>a-b)[0]||null;
 const totKm=withKm.reduce((a,r)=>a+r.km,0);return {n:R.length,totKm,best,longest,longestMin,r5};}
function weekStart(d){const x=new Date(d+'T12:00:00');const dw=(x.getDay()+6)%7;x.setDate(x.getDate()-dw);return keyOf(x);}
function runWeekly(n){const out=[];const t=new Date();const dw=(t.getDay()+6)%7;for(let i=n-1;i>=0;i--){const s=new Date(t.getFullYear(),t.getMonth(),t.getDate()-dw-7*i);out.push({wk:keyOf(s),km:0,min:0});}
 (D.runs||[]).forEach(r=>{const w=weekStart(r.date);const o=out.find(x=>x.wk===w);if(o){o.km+=r.km||0;o.min+=r.sec/60;}});return out;}
function barsSVG(data,key,unit){const W=320,H=150,L=8,B=24,max=Math.max(1,...data.map(d=>d[key]));const bw=(W-L*2)/data.length;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${data.map((d,i)=>{const h=(H-B-18)*d[key]/max;const x=L+i*bw+4;return `<rect x="${x}" y="${H-B-h}" width="${bw-8}" height="${Math.max(h,1)}" rx="5" style="fill:${i===data.length-1?'#E8633A':'var(--a)'}" opacity="${d[key]?1:.18}"/>${d[key]?`<text x="${x+(bw-8)/2}" y="${H-B-h-5}" font-size="10" style="fill:var(--sub)" text-anchor="middle">${key==='km'?String(Math.round(d[key]*10)/10).replace('.',','):Math.round(d[key])}</text>`:''}<text x="${x+(bw-8)/2}" y="${H-8}" font-size="9.5" style="fill:var(--mut)" text-anchor="middle">${fmt(d.wk)}</text>`;}).join('')}</svg>`;}

/* ===== Backup na nuvem: criptografado no próprio celular com a senha da pessoa ===== */
const CLOUD_ITER=310000,CLOUD_KEY='meutreino:cloudkey';
const APP_URL='https://isabelasena2018-ops.github.io/Meu-treino/';
function b64e(u8){u8=u8 instanceof Uint8Array?u8:new Uint8Array(u8);let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function b64d(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function randId(n){const a='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=crypto.getRandomValues(new Uint8Array(n));return Array.from(r,x=>a[x%a.length]).join('');}
async function cloudDerive(pass,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);}
async function gzip(u8){if(!window.CompressionStream)return null;try{const st=new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip'));return new Uint8Array(await new Response(st).arrayBuffer());}catch(e){return null;}}
async function gunzip(u8){const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));return new Uint8Array(await new Response(st).arrayBuffer());}
function cloudKeyRaw(){try{return localStorage.getItem(CLOUD_KEY);}catch(e){return null;}}
async function cloudSetup(pass){/* cria a chave a partir da senha e guarda só neste celular */
 const salt=crypto.getRandomValues(new Uint8Array(16));const key=await cloudDerive(pass,salt,CLOUD_ITER);
 const raw=await crypto.subtle.exportKey('raw',key);try{localStorage.setItem(CLOUD_KEY,b64e(raw));}catch(e){}
 D.cloud={id:(D.cloud&&D.cloud.id)||randId(24),salt:b64e(salt),iter:CLOUD_ITER,last:null};persist();}
async function cloudUpload(){if(!D.cloud||!D.profile)return false;const kr=cloudKeyRaw();if(!kr)return false;
 const key=await crypto.subtle.importKey('raw',b64d(kr),{name:'AES-GCM'},false,['encrypt']);
 const pack=async strip=>{const o=JSON.parse(JSON.stringify(D));delete o.cloud;if(strip)(o.runs||[]).forEach(r=>{delete r.pts;});
  const raw=new TextEncoder().encode(JSON.stringify(o));const z=await gzip(raw);const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,z||raw);return {data:b64e(ct),iv:b64e(iv),gz:!!z};};
 let P=await pack(false);if(P.data.length>950000)P=await pack(true);if(P.data.length>950000)throw new Error('grande');
 const {db,uid,f}=await fb();const at=Date.now();const name=String(D.profile.nome||'').slice(0,60);
 await f.setDoc(f.doc(db,'backups',D.cloud.id),{owner:uid,name,at,size:P.data.length,salt:D.cloud.salt,iter:D.cloud.iter,iv:P.iv,gz:P.gz,data:P.data,v:1});
 try{await f.setDoc(f.doc(db,'backupIndex',D.cloud.id),{owner:uid,name,at,size:P.data.length});}catch(e){}
 D.cloud.last=at;D.lastBackup=at;persist();return true;}
async function cloudRestore(id,pass){const {db,f}=await fb();const s=await f.getDoc(f.doc(db,'backups',id));
 if(!s.exists())throw new Error('naoachei');const b=s.data();
 let plain;try{const key=await cloudDerive(pass,b64d(b.salt),b.iter||CLOUD_ITER);plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(b.iv)},key,b64d(b.data)));}catch(e){throw new Error('senha');}
 if(b.gz)plain=await gunzip(plain);const o=JSON.parse(new TextDecoder().decode(plain));if(!o||!o.profile)throw new Error('vazio');
 D=Object.assign(fresh(),o);delete D.cloud;await cloudSetup(pass);persist();try{await cloudUpload();}catch(e){}
 return b;}
function cloudAuto(){if(!D.cloud||!cloudKeyRaw())return;if(D.cloud.last&&Date.now()-D.cloud.last<7*864e5)return;setTimeout(()=>cloudUpload().then(()=>{if(UI.view==='perfil')render();}).catch(()=>{}),6000);}

 setDone:t=>{const id=t.dataset.id;const w=D.workouts.find(x=>x.id===UI.sessionId);const it=w&&w.items.find(i=>i.exId===id);if(!it)return;
  let kg=num(document.getElementById('w-'+id).value);const r=parseInt(document.getElementById('r-'+id).value,10);
  if(kg==null){if(EX[id].eq==='corpo')kg=0;else{toast('Coloca o peso (kg) 😉');document.getElementById('w-'+id).focus();return;}}
  if(isNaN(r)){toast(/\d\s*(s|seg)\b/.test(it.sets)?'Quantos segundos você fez?':'Quantas repetições você fez?');document.getElementById('r-'+id).focus();return;}
  const t0=today();const arr=D.history[id]||[];let e=arr.find(x=>x.date===t0);if(!e){e={date:t0,weight:kg,reps:r,sets:[]};arr.push(e);}if(!e.sets)e.sets=[];
  e.sets.push({w:kg,r});e.weight=Math.max(...e.sets.map(z=>z.w));e.reps=Math.max(...e.sets.filter(z=>z.w===e.weight).map(z=>z.r||0));D.history[id]=arr;persist();
  const n=nSets(it.sets);const done=e.sets.length;const ns=done<n?nextSetSug(id,it,kg,r):null;
  UI.nextW=UI.nextW||{};UI.nextMsg=UI.nextMsg||{};if(ns){UI.nextW[id]=ns.w;UI.nextMsg[id]=ns.msg;}else{delete UI.nextW[id];delete UI.nextMsg[id];}
  const y=window.scrollY;render();window.scrollTo(0,y);
  if(done<n)restStart(restFor(id)[0],'série '+done+' de '+n+' feita'+(ns&&ns.w!==kg?' · próxima: '+nf(ns.w)+' kg':''));
  else{restStop();toast('Exercício concluído! 🎉');const ix=w.items.findIndex(i=>i.exId===id);const nx=w.items.slice(ix+1).find(j=>EX[j.exId]);if(nx)setTimeout(()=>{const el=document.getElementById('ex-'+nx.exId);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},400);}},
 setUndo:t=>{const id=t.dataset.id;const e=(D.history[id]||[]).find(x=>x.date===today());if(!e||!e.sets||!e.sets.length)return;e.sets.pop();
  if(UI.nextW)delete UI.nextW[id];if(UI.nextMsg)delete UI.nextMsg[id];
  if(!e.sets.length)D.history[id]=D.history[id].filter(x=>x!==e);else{e.weight=Math.max(...e.sets.map(z=>z.w));e.reps=Math.max(...e.sets.filter(z=>z.w===e.weight).map(z=>z.r||0));}
  if(D.history[id]&&!D.history[id].length)delete D.history[id];persist();restStop();const y=window.scrollY;render();window.scrollTo(0,y);toast('Última série desfeita');},

 ckTog:t=>{CK.multi[t.dataset.k]=!CK.multi[t.dataset.k];ckPaint();},
 ckNone:()=>{Object.keys(CK.multi).forEach(k=>CK.multi[k]=false);ckAnswer('done','Nenhum',null);},
 ckDone:()=>{const on=ckOnSupps().filter(s=>CK.multi[s.k]).map(s=>s.l);ckAnswer('done',on.length?on.join(', ')+' ✓':'Nenhum',null);},
 ckSend:()=>ckSendText(),
 ckTts:t=>{D.tts=!ttsOn();persist();t.textContent=ttsOn()?'🔊 Voz ligada':'🔇 Voz desligada';
  if(ttsOn()){const last=[...CK.msgs].reverse().find(m=>m.r==='bot');if(last)speakAll([last.say!=null?last.say:last.t]);}else hush();},
 ckMic:t=>ckMic(t),
 reset:()=>{if(!confirm('Apagar TODOS os seus dados deste celular? Isso não tem volta.'))return;D=fresh();persist();PROF=null;UI.view='hoje';render();}
};

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t,e);}});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.i;if(!k)return;const v=el.value;
 if(k.startsWith('onb.'))ONB[k.slice(4)]=v;
 else if(k.startsWith('meal.')){const c=dayCheck(today());c.meals=c.meals||{};c.meals[k.slice(5)]=v;persist();}
 else if(k==='edit.name')UI.edit.name=v;
 else if(k.startsWith('edit.sets.'))UI.edit.items[+k.slice(10)].sets=v;
 else if(k==='lib.q'){UI.libQuery=v;const l=document.getElementById('liblist');if(l)l.innerHTML=libList();}
 else if(k.startsWith('act.d.')){UI.actForm.d=UI.actForm.d||{};UI.actForm.d[k.slice(6)]=v;}
 else if(k.startsWith('act.'))UI.actForm[k.slice(4)]=v;
 else if(k.startsWith('prof.'))PROF[k.slice(5)]=v;
 else if(k.startsWith('gen.m.'))UI.gen.m[k.slice(6)]=v;
 else if(k.startsWith('mea.'))UI.mea[k.slice(4)]=v;
 else if(k==='soc.code')UI.soc.code=v;
 else if(k==='bio.txt'){if(UI.bio)UI.bio.txt=v;}
 else if(k.startsWith('re.')){UI.runEnd[k.slice(3)]=v;}
 else if(k.startsWith('rec.n.'))UI.recEdit[+k.slice(6)].n=v;
 else if(k.startsWith('rec.ml.'))UI.recEdit[+k.slice(7)].ml=v;
 else if(k==='soc.gname')UI.soc.gname=v;
 else if(k==='swap.q'){UI.swap.q=v;const r=document.getElementById('swap-res');if(r){const inS=((D.workouts.find(w=>w.id===UI.sessionId)||{}).items||(UI.edit?UI.edit.items:[])).map(i=>i.exId);r.innerHTML=exSearchHtml(v,'swapDo',UI.swap.ctx==='builder'?(UI.edit?UI.edit.items.map(i=>i.exId):[]):inS);}}
 else if(k==='addex.q'){UI.addEx=UI.addEx||{};UI.addEx.q=v;const r=document.getElementById('add-res');const w=D.workouts.find(x=>x.id===UI.sessionId)||{items:[]};if(r)r.innerHTML=exSearchHtml(v,'addExDo',w.items.map(i=>i.exId));}
});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset.c;if(!k)return;
 if(k==='edit.day')UI.edit.day=el.value;
 else if(k==='prog.ex'){UI.progEx=el.value;render();}
 else if(k==='bioFile'){const file=el.files&&el.files[0];const tg=el.dataset.t;if(!file)return;UI.bio={t:tg,loading:true};render();
  ocrImage(file).then(txt=>{const f=parseBio(txt);UI.bio={t:tg,found:f};bioApply(tg,f);render();}).catch(()=>{UI.bio={t:tg,err:'Não consegui ler a foto agora. Confere a internet ou use "Digitar os números".'};render();});}
 else if(k==='sharePhoto'){const file=el.files&&el.files[0];if(!file||!SHARE)return;const img=new Image();img.onload=()=>{SHARE.photo=img;SHARE.style='foto';shareRender();};img.src=URL.createObjectURL(file);}
 else if(k==='shareTitle'){if(SHARE){SHARE.d.title=el.value.trim()||SHARE.d.title;shareRender();}}
 else if(k==='pushTime'){const P=pushState();if(/^\d{2}:\d{2}$/.test(el.value)){P.times[el.dataset.k]=el.value;persist();syncPush(true).catch(()=>{});toast('Lembrete às '+el.value+' ✓');}}
 else if(k==='voice'){D.voiceName=el.value;persist();speakAll(['Oi! Essa é a minha voz.'],true);}
 else if(k==='act.date')UI.actForm.date=el.value||today();
 else if(k==='import'){const file=el.files&&el.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.profile||!Array.isArray(o.workouts))throw 0;if(!confirm('Substituir os dados atuais por esse backup?'))return;D=Object.assign(fresh(),o);persist();PROF=null;UI.view='hoje';render();toast('Backup restaurado!');}catch(err){toast('Arquivo de backup inválido');}};
  r.readAsText(file);}
});

document.addEventListener('input',e=>{if(e.target.id==='ckin')grow(e.target);});
document.addEventListener('focusin',e=>{if(e.target.id==='ckin')hush();});
document.addEventListener('keydown',e=>{if(e.target.id==='ckin'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ckSendText();}});

try{const gv=new URLSearchParams(location.search).get('go');if(gv&&D.profile&&['hoje','checkin','treinos','progresso','atividades','corrida','exercicios','turma'].includes(gv)){UI.view=gv;history.replaceState(null,'',location.pathname);}}catch(e){}
try{const rp=new URLSearchParams(location.search).get('recuperar');if(rp&&/^[A-Za-z0-9]{10,40}$/.test(rp)){UI.restoreId=rp;history.replaceState(null,'',location.pathname);}}catch(e){}
if(D.profile)cloudAuto();
try{const gp=new URLSearchParams(location.search).get('g');if(gp){UI.pendingGroup=gp.toUpperCase().replace(/[^A-Z0-9]/g,'');history.replaceState(null,'',location.pathname);}}catch(e){}
if(D.profile&&socOn())setTimeout(()=>syncSocial().catch(()=>{}),1500);
if(D.profile)setTimeout(()=>syncUsage(true).then(()=>{if(UI.view==='perfil')render();}).catch(()=>{}),2500);
if(D.profile&&D.push&&D.push.on)setTimeout(()=>syncPush(true).catch(()=>{}),3500);
/* ===== atualização automática: confere se há versão nova e recarrega quando não atrapalha ===== */
let UPDATE_PENDING=false;
const updateSafe=()=>!RUN&&!['correndo','corrida_fim','checkin','builder','gerador','sessao'].includes(UI.view)&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName||''));
async function doUpdate(){try{localStorage.setItem('meutreino:updated','1');}catch(e){}
 try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.update().catch(()=>{})));}}catch(e){}
 location.reload();}
async function checkUpdate(){if(navigator.onLine===false)return;
 try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
  if(j&&j.v&&j.v!==APP_VERSION){UPDATE_PENDING=true;if(updateSafe()){toast('Atualizando o app… ✨');setTimeout(doUpdate,900);}}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate();});
setTimeout(checkUpdate,4000);setInterval(checkUpdate,20*60*1000);
try{if(localStorage.getItem('meutreino:updated')){localStorage.removeItem('meutreino:updated');setTimeout(()=>toast('App atualizado ✨ versão '+APP_VERSION.split(' ')[0]),800);}}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{try{r.update();}catch(e){}}).catch(()=>{}));

runRestore();
render();
</script>
</body>
</html>
