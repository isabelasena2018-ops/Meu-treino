<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Meu Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--a:#0F4C45;--a2:#E8633A;--a2t:#C24E28;--bg:#FAF6EF;--ink:#1d2522;--mut:#5f6c67;--line:#ece6da;--soft:#fbfaf7;--card:#fff;--a2soft:#fff1ea;--asoft:#e6efed;--sub:#55625e;--infotx:#244a45;--tgoff:#e3ded3;--grab:#d8d2c6;--deep:#0F4C45;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.aviso{background:var(--asoft);border-left:4px solid var(--a2);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin:0 0 12px;color:var(--ink)}
html.dark{color-scheme:dark;--a2t:#F07A52;--bg:#0b1311;--ink:#eaf1ed;--mut:#93a69e;--line:#24332f;--soft:#121c19;--card:#16211e;--a:#5cc2b0;--asoft:#17302b;--a2soft:#2b1f19;--sub:#aebdb6;--infotx:#cfe3dd;--tgoff:#33433e;--grab:#3a4a45;--deep:#1d6b5f}
html.dark .card.dark,html.dark .chip.on,html.dark .bub.me,html.dark .sv,html.dark .check,html.dark .round.f,html.dark .cb.send,html.dark .chk.on .box,html.dark .tg.on,html.dark .toggle.on .tg{background:var(--deep)!important;border-color:var(--deep)}
html.dark .card.dark{color:#eaf1ed}html.dark .chip.on{color:#fff}html.dark .info{color:var(--infotx)}html.dark .ckcard{background:var(--a2soft)}html.dark .inp,html.dark select.inp{background:var(--soft);color:var(--ink)}html.dark #toast{background:#eaf1ed;color:#0b1311}
html.dark .bub.bot,html.dark .card,html.dark .li,html.dark .it,html.dark .st,html.dark .at,html.dark .ex,html.dark .fc{box-shadow:none;border:1px solid var(--line)}
html.dark .btn:not(.alt){background:#1d6b5f;color:#fff}html.dark .btn2{background:#16231f;color:var(--ink);border-color:#2a3a35}html.dark .ibtn{background:#16231f;color:var(--a);box-shadow:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
a{color:inherit}
.disp{font-family:'Fraunces',Georgia,serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;position:sticky;top:0;background:var(--bg);z-index:10}
.brand{display:flex;gap:7px;align-items:center;font-weight:700;letter-spacing:2px;font-size:12px;color:var(--a)}
.ibtn{width:36px;height:36px;border-radius:36px;background:var(--card);display:inline-grid;place-items:center;font-weight:700;color:var(--a);box-shadow:0 1px 3px rgba(0,0,0,.07);margin-left:6px}
.ibtn svg{width:18px;height:18px}
main{max-width:560px;margin:0 auto;padding:4px 16px calc(100px + env(safe-area-inset-bottom))}
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:20}
.nbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#a3ada9;padding:4px 0}
.nbtn.on{color:var(--a)}
.nbtn svg{width:22px;height:22px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card.dark{background:var(--a);color:#FAF6EF;box-shadow:0 8px 22px rgba(15,76,69,.22)}
.seg{display:flex;background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:0 0 14px}.seg button{flex:1;padding:10px 6px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mut)}.seg button.on{background:var(--card);color:var(--a);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:1.4px;color:var(--a2t);text-transform:uppercase}
.h2{font-size:26px;margin:2px 0 14px;font-weight:600;line-height:1.15}
.h3{font-size:16.5px;margin:20px 0 10px;font-weight:700}
.mut{color:var(--mut)}
.small{font-size:12.5px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0}
.chip{padding:9px 13px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:13.5px;color:var(--sub)}
.chip.on{background:var(--a);border-color:var(--a);color:#fff}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 0 6px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;background:var(--soft);font-family:inherit;color:var(--ink)}
.inp:focus,.fld input:focus,.it input:focus{outline:2px solid var(--a);outline-offset:1px}
textarea.inp{resize:none;line-height:1.4}
select.inp{appearance:none;-webkit-appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600;text-align:left}
.toggle:last-child{border-bottom:none}
.tg{width:44px;height:26px;border-radius:26px;background:var(--tgoff);position:relative;transition:.2s;flex-shrink:0}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:20px;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on .tg{background:var(--a)}
.toggle.on .tg::after{left:21px}
.bigopt{width:100%;text-align:left;background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:5px}
.bigopt b{font-size:15.5px}
.bigopt span{font-size:13.5px;color:var(--mut);line-height:1.45}
.btn{width:100%;background:var(--a);color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:15px;display:block;text-align:center}
.btn.alt{background:var(--a2t)}
.btn.sm{padding:11px;font-size:14px}
.btn2{width:100%;background:var(--card);color:var(--a);border:1.5px solid var(--a);border-radius:14px;padding:12px;font-weight:700;font-size:14.5px}
.btn2.danger{color:#c0453a;border-color:#e5b3ad}
.btnrow{display:flex;gap:8px;margin-top:10px}
.back{display:block;color:var(--a);font-weight:700;font-size:14px;padding:6px 0;margin-bottom:2px}
.hero{text-align:center;padding:calc(34px + env(safe-area-inset-top)) 10px 18px}
.hero h1{font-size:34px;margin:8px 0 4px;font-weight:600;color:var(--a)}
.hero p{margin:0;color:var(--mut)}
.chk{width:100%;display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left}
.chk .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--a);display:grid;place-items:center;flex-shrink:0;color:#fff}
.chk.on .box{background:var(--a)}
.chk .t{font-weight:600}
.chk.on .t{text-decoration:line-through;color:var(--mut)}
.chk .h{display:block;font-size:12px;color:var(--mut);font-weight:500}
.week{display:flex;justify-content:space-between;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;opacity:.9}
.wd i{width:32px;height:32px;border-radius:32px;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;font-style:normal;font-size:14px}
.wd.done i{background:var(--a2);border-color:var(--a2)}
.wd.today i{border-color:#fff}
.ex{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);border:1.5px solid transparent}
.ex.done{border-color:var(--a)}
.exn{font-weight:700;font-size:15.5px;margin:0;line-height:1.25}
.sch{font-size:13px;color:var(--a);font-weight:700}
.exbtns{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:10px;font-size:12.5px;font-weight:700;text-decoration:none}
.mini.g{background:var(--asoft);color:var(--a)}
.mini.o{background:var(--a2soft);color:var(--a2)}
.fr{display:flex;gap:8px;margin-top:10px}
.fld{width:76px}
.fld input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 6px;font-size:16px;font-weight:700;text-align:center;background:var(--soft);font-family:inherit}
.fld span{display:block;text-align:center;font-size:10.5px;color:var(--mut);font-weight:700;margin-top:3px}
.sv{flex:1;border-radius:12px;background:var(--a);color:#fff;font-weight:700;min-height:46px;align-self:flex-start;height:46px}
.last{font-size:12.5px;color:var(--mut);margin-top:9px}
.last b{color:var(--a2)}
.hint{font-size:12px;color:var(--a);background:var(--asoft);border-radius:8px;padding:5px 8px;margin-top:6px;display:inline-block;font-weight:600}
.check{width:20px;height:20px;border-radius:20px;background:var(--a);display:inline-grid;place-items:center;flex-shrink:0;color:#fff;font-size:12px}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(20,30,28,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 18px calc(26px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;animation:up .25s ease;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--grab);margin:0 auto 12px}
.x{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:32px;background:var(--card);font-size:20px;color:var(--mut);line-height:32px}
.sec{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.sec h4{margin:0 0 7px;font-size:14px}
.sec p,.sec li{font-size:14px;line-height:1.5;margin:0}
.sec ol,.sec ul{margin:0;padding-left:20px}
.sec li{margin-bottom:5px}
.sec.ok{border-left:4px solid #3b9b6e}
.sec.no{border-left:4px solid #d64545}
.sec.warn{border-left:4px solid #e0a526}
.sec.care{border-left:4px solid var(--a)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
.setsrow{display:flex;align-items:center;gap:6px;margin:10px 0 8px;flex-wrap:wrap}.sdot{width:30px;height:30px;border-radius:30px;border:2px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--mut)}.sdot.ok{background:var(--a);border-color:var(--a);color:#fff}.sdot.now{border-color:var(--a2);color:var(--a2t)}html.dark .sdot.ok{background:var(--deep);border-color:var(--deep)}
.setbtn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--a);color:#fff;border-radius:14px;padding:12px 14px;margin:10px 0 2px}.setbtn b{display:block;font-size:15px}.setbtn span span{font-size:12.5px;opacity:.85}.setbtn .go{margin-left:auto;width:32px;height:32px;border-radius:32px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:12px;flex-shrink:0}html.dark .setbtn{background:var(--deep)}
.mobc{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border-radius:16px;padding:13px 14px;margin:0 0 10px;box-shadow:0 1px 0 var(--line)}.mobc .em{font-size:26px}.mobc b{display:block;font-size:15.5px;color:var(--ink)}.mobc span span{font-size:12.5px;color:var(--mut);line-height:1.35}.mobc .min{margin-left:auto;flex-shrink:0;font-weight:800;font-size:13px;color:var(--a2t);white-space:nowrap}
.ibtn.bell{position:relative}.ibtn.bell i{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;padding:0 4px;border-radius:17px;background:var(--a2);color:#fff;font-size:10.5px;font-weight:800;font-style:normal;display:grid;place-items:center;line-height:1}
.alrow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 12px}.alrow .em{font-size:26px}.alrow b{display:block;font-size:15px;color:var(--ink)}.alrow span span{font-size:12.5px;color:var(--mut)}.alrow .go{margin-left:auto;width:30px;height:30px;border-radius:30px;background:var(--asoft);color:var(--a);display:grid;place-items:center;font-size:11px;flex-shrink:0}.alrow.aq{border-color:var(--a2)}.alrow.aq .go{background:var(--a2soft);color:var(--a2t)}
#alov{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}.al-in{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px 40px}
.al-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.al-prog{display:flex;gap:4px;margin-bottom:10px}.al-prog i{flex:1;height:5px;border-radius:5px;background:var(--line)}.al-prog i.ok{background:var(--a)}.al-prog i.now{background:var(--a2)}
.al-fig{position:relative;background:var(--bqbg,#F6EEE2);border-radius:22px;overflow:hidden}.al-fig svg{display:block;width:100%;height:auto;aspect-ratio:220/200;max-height:46vh}
.al-side{position:absolute;top:10px;left:10px;background:var(--a);color:#fff;font-weight:800;font-size:12.5px;padding:5px 10px;border-radius:20px}.al-feel{position:absolute;bottom:12px;right:12px;font-size:11.5px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:5px}.al-feel i{width:12px;height:12px;border-radius:12px;background:#EF3B5D;opacity:.6}
.al-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:14px 0 8px}.al-t{font-size:40px;font-variant-numeric:tabular-nums;color:var(--a2t);line-height:1}
.al-barw{height:6px;border-radius:6px;background:var(--line);overflow:hidden}.al-barw div{height:100%;background:var(--a2);transition:width .2s linear}
.al-ctl{display:flex;gap:8px;margin:14px 0}.al-ctl button{flex:0 0 54px;height:52px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:18px;color:var(--ink)}.al-ctl button:disabled{opacity:.35}.al-ctl .main{flex:1;background:var(--a);border-color:var(--a);color:#fff;font-size:16px;font-weight:800}html.dark .al-ctl .main{background:var(--deep);border-color:var(--deep)}
.al-tx{background:var(--card);border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.5}.al-tx ol{margin:6px 0 10px;padding-left:20px}.al-tx li{margin-bottom:4px}.al-tx p{margin:0 0 8px}
html.dark{--bqbg:#1a2724;--bqmat:#34443f;--bqwall:#46564f}
.restbtn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--asoft);border:1.5px dashed var(--a);border-radius:14px;padding:10px 12px;margin:10px 0 8px;color:var(--ink)}.restbtn .ic{font-size:22px}.restbtn b{display:block;font-size:14px;color:var(--a)}.restbtn span span{font-size:12.5px;color:var(--mut)}.restbtn .go{margin-left:auto;width:30px;height:30px;border-radius:30px;background:var(--a);color:#fff;display:grid;place-items:center;font-size:12px;flex-shrink:0}html.dark .restbtn .go{background:var(--deep)}
#restbar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:55;background:var(--deep);color:#fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 26px rgba(0,0,0,.25);max-width:560px;margin:0 auto}
#restbar .t{font-family:'Fraunces',serif;font-size:30px;font-weight:600;min-width:84px;font-variant-numeric:tabular-nums}#restbar .l{flex:1;font-size:12.5px;line-height:1.3;opacity:.9}#restbar button{color:#fff;font-weight:800;font-size:14px;padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.14)}
#restbar.fim{background:var(--a2t)}
#toast.undo{pointer-events:auto;display:flex;align-items:center;gap:14px}#toast.undo button{color:inherit;font-weight:800;text-decoration:underline;font-size:14px}
.it{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:14px;padding:10px 8px 10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.it .nm{flex:1;min-width:0}
.it .nm b{display:block;font-size:14px;line-height:1.25}
.it input{width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;font-size:16px;background:var(--soft);font-family:inherit}
.ib{width:40px;height:40px;border-radius:10px;background:var(--soft);color:var(--mut);font-weight:700;display:grid;place-items:center;flex-shrink:0}
.ib.del{color:#c0453a}
.li{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;background:var(--card);border-radius:14px;margin-bottom:8px;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.li b{font-size:14.5px;display:block}
.li span{font-size:12px;color:var(--mut)}
.tag{font-size:11px;font-weight:700;color:var(--a);background:var(--asoft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fc{background:var(--card);border-radius:16px;padding:14px;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:4px}
.fc .em{font-size:26px}
.fc b{font-size:14.5px}
.fc span{font-size:12px;color:var(--mut)}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.at{background:var(--card);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;border:1.5px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.04);text-align:center}
.at .em{font-size:24px}
.at.on{border-color:var(--a);background:var(--asoft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.st b{display:block;font-size:25px;font-family:'Fraunces',serif;color:var(--a);font-weight:600}
.st span{font-size:11.5px;color:var(--mut);font-weight:600}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.hrow>div:first-child{flex:1;min-width:0}
.bar{height:12px;border-radius:12px;background:rgba(255,255,255,.18);overflow:hidden}
.barfill{height:100%;background:var(--a2);border-radius:12px;transition:width .5s}
.cups{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.cup{width:20px;height:28px;border-radius:0 0 7px 7px;border:1.5px solid var(--a)}
.round{width:38px;height:38px;border-radius:38px;border:1.5px solid var(--a);display:inline-grid;place-items:center;background:var(--card);color:var(--a);font-size:20px;font-weight:700}
.round.f{background:var(--a);color:#fff}
details.card summary{font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary .chev{transform:rotate(180deg)}
.chev{transition:.2s;color:var(--mut)}
.info{background:var(--asoft);border-radius:14px;padding:13px 14px;font-size:13.5px;line-height:1.5;color:var(--infotx);margin-bottom:12px}
.steps{margin:0;padding-left:20px}
.steps li{margin-bottom:7px;font-size:14px;line-height:1.5}
.ck{display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.bub{max-width:86%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-line;animation:fade .25s ease both;word-wrap:break-word}
.bub.bot{background:var(--card);border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.bub.me{background:var(--a);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.qr{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;margin:2px 0 10px}
.qr .chip.go{background:var(--a2);border-color:var(--a2);color:#fff}
.ckbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}
.ckin{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.ckin textarea{flex:1;border:1.5px solid var(--line);border-radius:20px;padding:10px 14px;font-size:16px;resize:none;max-height:120px;background:var(--soft);font-family:inherit;line-height:1.35;color:var(--ink)}
.ckin textarea:focus{outline:2px solid var(--a);outline-offset:0}
.cb{width:42px;height:42px;border-radius:42px;display:grid;place-items:center;flex-shrink:0;font-size:18px}
.cb.mic{background:var(--a2soft);color:var(--a2)}
.cb.mic.on{background:var(--a2);color:#fff;animation:pulse 1s infinite}
.cb.send{background:var(--a);color:#fff;font-weight:700}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(232,99,58,.22)}}
.ckcard{width:100%;text-align:left;background:var(--a2soft);border:1.5px solid var(--a2);border-radius:18px;padding:15px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.ckcard .em{font-size:30px}
.ckcard b{display:block;font-size:15.5px;color:var(--a2)}
.ckcard span{font-size:13px;color:#7a5a4c;line-height:1.4}
.empty{text-align:center;color:var(--mut);font-size:13.5px;padding:22px 10px}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

<div id="sheet"></div>
<div id="toast"></div>

<script>
const APP_VERSION='6.2 · 10/11 16h';
/* ================== DADOS ================== */
const GROUPS={gluteo:'Glúteo',quadriceps:'Quadríceps',posterior:'Posterior de coxa',panturrilha:'Panturrilha',costas:'Costas',peito:'Peito',ombro:'Ombro',biceps:'Bíceps',triceps:'Tríceps',abdomen:'Abdômen'};

/* n=nome g=grupo c=composto iso=isométrico uni=unilateral p=passos s=sentir x=não sentir e=erros k=cuidado */
const EX={
hip_thrust:{n:'Hip thrust',g:'gluteo',c:1,
 p:['Apoie a parte de baixo das escápulas (omoplatas) no banco, com a barra ou anilha na dobra do quadril (use uma almofada).','Pés na largura do quadril, pontas levemente pra fora. No topo, a canela deve ficar na vertical — ajuste a distância dos pés pra isso.','Queixo levemente pra baixo, olhando pra frente (não pro teto). Empurre o chão pelos calcanhares e suba o quadril.','No topo, tronco e coxas alinhados: aperte forte o glúteo por 1-2s e desça controlando.'],
 s:'Glúteo queimando, principalmente no topo. Um pouco de posterior de coxa é normal.',
 x:'Dor na lombar. Se sentir muito a frente da coxa, os pés estão perto demais; se sentir muito o posterior, estão longe demais.',
 e:['Arquear a lombar no topo em vez de terminar o movimento com o glúteo','Olhar pro teto (isso puxa a lombar)','Subir rápido sem pausar no topo'],
 k:'Comece leve pra acertar a posição. No topo, pense em "encaixar" o quadril (bumbum levemente pra dentro).'},
elevacao_pelvica:{n:'Elevação pélvica no chão',g:'gluteo',
 p:['Deite de barriga pra cima, joelhos dobrados e pés no chão perto do bumbum, na largura do quadril.','Braços ao lado do corpo, abdômen firme.','Empurre pelos calcanhares e suba o quadril até o corpo ficar reto dos ombros aos joelhos.','Aperte o glúteo por 2s e desça devagar.'],
 s:'Glúteo trabalhando, um pouco de posterior de coxa.',
 x:'Lombar fazendo a força ou cãibra forte no posterior (sinal de pés longe demais).',
 e:['Subir arqueando a lombar','Deixar os joelhos abrirem ou fecharem'],
 k:'Ótima pra começar ou pra "acordar" o glúteo antes do treino. Dá pra pôr peso no quadril ou elástico nos joelhos.'},
coice_polia:{n:'Coice na polia',g:'gluteo',uni:1,
 p:['Prenda a caneleira no tornozelo e na polia baixa. Segure no aparelho e incline levemente o tronco à frente.','Joelho de apoio levemente dobrado, abdômen firme.','Leve a perna pra trás e um pouco pra cima, sem girar o quadril, até sentir o glúteo apertar.','Volte controlando, sem deixar o peso bater.'],
 s:'Glúteo da perna que está trabalhando.',
 x:'Dor na lombar (sinal de que está arqueando pra subir mais).',
 e:['Jogar a perna com embalo','Girar o quadril abrindo a perna pra fora','Arquear a lombar pra subir mais alto'],
 k:'Amplitude menor e controlada vale mais que chutar alto.'},
coice_4apoios:{n:'Coice em 4 apoios',g:'gluteo',uni:1,
 p:['Fique em 4 apoios: mãos embaixo dos ombros, joelhos embaixo do quadril.','Abdômen firme e costas retas, como uma mesa.','Com o joelho dobrado em 90°, empurre o calcanhar em direção ao teto até a coxa ficar alinhada com o tronco.','Aperte 1s no topo e desça devagar.'],
 s:'Glúteo apertando no topo.',
 x:'Lombar fazendo a força.',
 e:['Subir demais e arquear as costas','Tombar o quadril pro lado'],
 k:'Use caneleira pra progredir quando ficar fácil.'},
abducao_maquina:{n:'Abdução de quadril (máquina)',g:'gluteo',
 p:['Sente com as costas apoiadas e as pernas encaixadas nas almofadas.','Abra as pernas empurrando pra fora com a lateral das coxas.','Segure 1s aberta e volte devagar, sem deixar as placas baterem.'],
 s:'Lateral e parte de cima do glúteo (glúteo médio) queimando.',
 x:'Dor no joelho ou na virilha.',
 e:['Usar embalo','Voltar rápido deixando o peso bater'],
 k:'Inclinar o tronco à frente, segurando no aparelho, puxa mais pro glúteo máximo — vale alternar as duas formas.'},
caminhada_lateral:{n:'Caminhada lateral com elástico',g:'gluteo',
 p:['Elástico acima dos joelhos ou nos tornozelos, pés na largura do quadril.','Semi-agachamento: joelhos levemente dobrados, quadril pra trás, tronco um pouco inclinado.','Dê passos laterais sem deixar os pés se juntarem e sem levantar o tronco.','Vá 10-15 passos pra um lado e volte.'],
 s:'Lateral do glúteo queimando.',
 x:'Dor no joelho ou o joelho "entrando" pra dentro.',
 e:['Ficar em pé reta','Deixar os pés se juntarem a cada passo'],
 k:'Ótimo como aquecimento antes do treino de perna ou glúteo.'},
agach_sumo:{n:'Agachamento sumô',g:'gluteo',c:1,
 p:['Pés bem mais afastados que os ombros, pontas viradas pra fora (uns 30-45°).','Segure um halter ou kettlebell com os braços estendidos à frente do corpo.','Desça levando o quadril pra trás e pra baixo, com os joelhos indo na direção das pontas dos pés.','Suba empurrando o chão e apertando o glúteo.'],
 s:'Glúteo e parte interna da coxa.',
 x:'Dor no joelho ou na virilha.',
 e:['Joelhos caindo pra dentro','Tronco desabando pra frente'],
 k:'O joelho sempre acompanha a direção do pé.'},
bulgaro:{n:'Agachamento búlgaro',g:'gluteo',c:1,uni:1,
 p:['De costas pro banco, apoie o peito do pé de trás em cima dele.','Pé da frente bem à frente do corpo.','Incline levemente o tronco à frente (pega mais glúteo) e desça reto até a coxa da frente ficar quase paralela ao chão.','Suba empurrando pelo calcanhar da perna da frente.'],
 s:'Glúteo e coxa da perna da frente. Um alongamento na frente do quadril da perna de trás é normal.',
 x:'Dor no joelho da frente.',
 e:['Pé da frente muito perto do banco','Joelho caindo pra dentro','Usar a perna de trás pra subir'],
 k:'É difícil no começo: faça só com o peso do corpo e segure em algo pro equilíbrio.'},
stiff:{n:'Stiff',g:'posterior',c:1,
 p:['Em pé, barra ou halteres na frente das coxas, pés na largura do quadril, joelhos levemente destravados.','Leve o quadril pra trás (como se fechasse uma porta com o bumbum), descendo o peso rente às pernas.','Coluna reta o tempo todo. Desça até sentir o posterior da coxa bem alongado.','Suba empurrando o quadril pra frente e apertando o glúteo.'],
 s:'Alongamento forte no posterior da coxa na descida e glúteo na subida.',
 x:'Dor na lombar ou costas arredondando.',
 e:['Dobrar demais o joelho e virar um agachamento','Arredondar a coluna pra descer mais','Deixar o peso longe do corpo'],
 k:'A descida termina onde sua coluna começa a arredondar — não force descer mais.'},
terra_romeno:{n:'Levantamento terra romeno',g:'posterior',c:1,
 p:['Comece em pé com a barra ou halteres na frente das coxas, joelhos levemente dobrados (um pouco mais que no stiff).','Peito aberto, ombros pra trás, abdômen firme.','Empurre o quadril pra trás deslizando o peso pela coxa até um pouco abaixo do joelho.','Volte empurrando o quadril pra frente e apertando o glúteo no topo.'],
 s:'Posterior de coxa e glúteo.',
 x:'Dor ou cansaço forte na lombar.',
 e:['Arredondar as costas','Jogar o quadril pra frente demais no topo, inclinando o tronco pra trás'],
 k:'Mantenha o peso sempre encostado nas pernas.'},
agachamento:{n:'Agachamento livre',g:'quadriceps',c:1,
 p:['Barra apoiada no trapézio (não no pescoço), pés na largura dos ombros, pontas levemente pra fora.','Respire fundo, trave o abdômen e desça levando o quadril pra trás e pra baixo ao mesmo tempo.','Joelhos acompanham a direção dos pés. Desça até onde conseguir manter a coluna neutra (ideal: coxa paralela ao chão ou abaixo).','Suba empurrando o chão com o pé inteiro.'],
 s:'Coxa da frente e glúteo.',
 x:'Dor aguda no joelho ou na lombar.',
 e:['Joelho caindo pra dentro','Calcanhar saindo do chão','Bumbum "enrolando" lá embaixo'],
 k:'Aprenda primeiro sem peso ou segurando um halter na frente do peito (agachamento goblet).'},
smith:{n:'Agachamento no Smith',g:'quadriceps',c:1,
 p:['Barra apoiada no trapézio, pés um pouco à frente da linha da barra.','Destrave a barra, abdômen firme.','Desça até a coxa ficar paralela ao chão, joelhos na direção dos pés.','Suba empurrando o pé inteiro.'],
 s:'Coxa da frente e glúteo.',
 x:'Dor no joelho ou lombar.',
 e:['Pés muito embaixo da barra (sobrecarrega o joelho)','Descer sem controle'],
 k:'Pés mais à frente = mais glúteo; mais embaixo do corpo = mais quadríceps.'},
leg_press:{n:'Leg press 45°',g:'quadriceps',c:1,
 p:['Costas e bumbum bem apoiados no encosto o tempo todo.','Pés no meio da plataforma, na largura dos ombros.','Destrave e desça controlando até os joelhos formarem uns 90°.','Empurre pelo pé inteiro, sem travar os joelhos esticados no final.'],
 s:'Coxa da frente e glúteo.',
 x:'Lombar descolando do encosto ou dor no joelho.',
 e:['Descer tanto que o bumbum sai do banco','Travar o joelho esticado no topo','Joelhos fechando pra dentro'],
 k:'Pés mais em cima da plataforma = mais glúteo e posterior; mais embaixo = mais quadríceps.'},
extensora:{n:'Cadeira extensora',g:'quadriceps',
 p:['Ajuste o encosto pra que o joelho fique alinhado com o eixo do aparelho e a almofada fique no tornozelo.','Segure nas alças e mantenha o bumbum no banco.','Estenda as pernas até quase esticar e aperte a coxa 1s no topo.','Desça devagar (2-3s).'],
 s:'Frente da coxa queimando.',
 x:'Dor dentro ou na frente do joelho.',
 e:['Chutar com embalo','Tirar o bumbum do banco'],
 k:'Se o joelho incomodar, diminua a carga e a amplitude.'},
afundo:{n:'Afundo / avanço',g:'quadriceps',c:1,
 p:['Em pé, dê um passo largo à frente (ou fique parada em posição de passada).','Desça reto, como se fosse ajoelhar, até os dois joelhos ficarem em uns 90°.','Tronco reto e peso no calcanhar da perna da frente.','Suba empurrando com a perna da frente.'],
 s:'Coxa e glúteo da perna da frente.',
 x:'Dor no joelho.',
 e:['Passo curto demais','Joelho caindo pra dentro','Tronco balançando'],
 k:'Segure em algo se o equilíbrio estiver difícil.'},
hack:{n:'Agachamento hack',g:'quadriceps',c:1,
 p:['Costas bem apoiadas no encosto, ombros embaixo das almofadas.','Pés na largura dos ombros, no meio da plataforma.','Desça controlando até a coxa passar da paralela, se conseguir sem dor.','Suba empurrando o pé inteiro.'],
 s:'Quadríceps forte, um pouco de glúteo.',
 x:'Dor no joelho ou lombar descolando.',
 e:['Calcanhar saindo da plataforma','Travar o joelho no topo'],
 k:'Comece com pouca carga pra pegar a amplitude.'},
flexora_deitada:{n:'Mesa flexora',g:'posterior',
 p:['Deite de barriga pra baixo, joelhos logo fora da beirada do banco, almofada acima do calcanhar.','Quadril colado no banco; segure nas alças.','Dobre os joelhos trazendo o calcanhar em direção ao bumbum.','Volte devagar, sem deixar o peso bater.'],
 s:'Parte de trás da coxa.',
 x:'Dor na lombar ou cãibra forte (se der, pare e alongue).',
 e:['Levantar o quadril do banco','Usar embalo'],
 k:'Pontas dos pés puxadas em direção à canela ajuda a sentir mais o posterior.'},
flexora_sentada:{n:'Cadeira flexora',g:'posterior',
 p:['Sente com o joelho alinhado ao eixo do aparelho e trave a almofada sobre as coxas.','Almofada de baixo logo acima do calcanhar.','Puxe o calcanhar pra baixo e pra trás até onde conseguir.','Volte devagar.'],
 s:'Posterior da coxa.',
 x:'Dor atrás do joelho.',
 e:['Soltar o peso na volta','Tirar o bumbum do banco'],
 k:'Incline levemente o tronco à frente pra alongar mais o posterior.'},
pant_pe:{n:'Panturrilha em pé',g:'panturrilha',
 p:['Ponta dos pés na beirada de um step, degrau ou no aparelho, calcanhar livre.','Desça o calcanhar até sentir a panturrilha alongar bem.','Suba o máximo que conseguir na ponta dos pés e segure 1-2s.','Desça devagar.'],
 s:'Panturrilha queimando.',
 x:'Dor no tendão (atrás do calcanhar) ou na sola do pé.',
 e:['Subir e descer rápido "quicando"','Fazer só metade do movimento'],
 k:'O segredo da panturrilha é a pausa embaixo e em cima.'},
pant_sentada:{n:'Panturrilha sentada',g:'panturrilha',
 p:['Sente com a almofada sobre as coxas, perto do joelho, e a ponta dos pés na plataforma.','Desça o calcanhar até alongar.','Suba na ponta dos pés e segure 1-2s.','Desça devagar.'],
 s:'Panturrilha (parte mais baixa, o sóleo).',
 x:'Dor no tendão do calcanhar.',
 e:['Quicar','Amplitude curta'],
 k:'Faça devagar e com muitas repetições.'},
puxada:{n:'Puxada frente (pulldown)',g:'costas',c:1,
 p:['Sente com as coxas presas na almofada. Pegue a barra um pouco mais aberta que os ombros.','Incline o tronco levemente pra trás (uns 10-20°) e estufe o peito.','Puxe a barra até perto do queixo/peito pensando em levar os COTOVELOS pra baixo e pra trás, não as mãos.','Volte controlando até esticar os braços e sentir as costas alongarem.'],
 s:'Lateral das costas (abaixo da axila) trabalhando.',
 x:'Bíceps queimando antes das costas (puxando só com o braço) ou dor no ombro/pescoço.',
 e:['Jogar o tronco muito pra trás com embalo','Puxar atrás da nuca','Ombros subindo em direção às orelhas'],
 k:'Imagine as mãos como "ganchos": quem puxa é o cotovelo.'},
remada_curvada:{n:'Remada curvada',g:'costas',c:1,
 p:['Segure a barra ou halteres, joelhos levemente dobrados, e incline o tronco à frente (uns 45°) levando o quadril pra trás.','Coluna reta, abdômen firme, olhar pro chão um pouco à frente.','Puxe o peso em direção ao umbigo, cotovelos indo pra trás rente ao corpo.','Junte as escápulas 1s e desça controlando.'],
 s:'Meio e lateral das costas.',
 x:'Dor na lombar.',
 e:['Subir o tronco a cada repetição (embalo)','Arredondar a coluna','Puxar pro peito com o cotovelo aberto (vira exercício de ombro)'],
 k:'Se a lombar cansar antes das costas, troque pela remada máquina com apoio no peito.'},
remada_maquina:{n:'Remada máquina (apoio no peito)',g:'costas',c:1,
 p:['Ajuste o banco pra que as pegadas fiquem na altura do meio do peito.','Peito apoiado na almofada o tempo todo.','Puxe as alças levando os cotovelos pra trás e juntando as escápulas.','Volte devagar até esticar os braços.'],
 s:'Meio das costas, entre as escápulas.',
 x:'Pescoço/trapézio tenso ou ombros subindo.',
 e:['Tirar o peito do apoio','Encolher os ombros'],
 k:'Ótima opção pra quem sente a lombar na remada curvada.'},
remada_baixa:{n:'Remada baixa (polia)',g:'costas',c:1,
 p:['Sente com os pés apoiados e joelhos levemente dobrados. Pegue o triângulo.','Coluna reta e peito aberto; tronco quase na vertical.','Puxe o triângulo até a barriga, cotovelos rentes ao corpo, juntando as escápulas.','Estique os braços devagar deixando as costas alongarem, sem curvar a lombar.'],
 s:'Meio das costas, entre as escápulas.',
 x:'Dor na lombar.',
 e:['Balançar o tronco pra frente e pra trás','Encolher os ombros'],
 k:'O tronco fica parado — só braços e escápulas se movem.'},
serrote:{n:'Remada unilateral (serrote)',g:'costas',c:1,uni:1,
 p:['Apoie o joelho e a mão do mesmo lado no banco; a outra perna fica no chão.','Costas retas e paralelas ao chão; halter pendurado com o braço esticado.','Puxe o halter em direção ao quadril (não ao ombro), cotovelo rente ao corpo.','Desça devagar até esticar o braço, sentindo alongar a lateral das costas.'],
 s:'Lateral das costas.',
 x:'Dor no ombro ou só o bíceps trabalhando.',
 e:['Girar o tronco pra subir o peso','Puxar em direção ao peito'],
 k:'Pense em "serrar" em direção ao bolso de trás da calça.'},
pullover:{n:'Pullover na polia',g:'costas',
 p:['Na polia alta, com barra reta ou corda, dê um passo pra trás e incline levemente o tronco à frente.','Braços quase esticados (cotovelos levemente dobrados e fixos).','Traga a barra em arco de cima até as coxas, usando as costas.','Volte controlando até os braços passarem da linha da cabeça.'],
 s:'Lateral das costas.',
 x:'Tríceps fazendo a força (cotovelo dobrando e esticando).',
 e:['Dobrar e esticar os cotovelos','Usar o peso do corpo'],
 k:'Ótimo pra "acordar" as costas no começo do treino.'},
crucifixo_inverso:{n:'Crucifixo inverso',g:'costas',
 p:['Na máquina (voador invertido) de frente pro encosto, ou com halteres e tronco inclinado à frente.','Braços estendidos à frente, cotovelos levemente dobrados.','Abra os braços pros lados até ficarem alinhados com o corpo, juntando as escápulas.','Volte devagar.'],
 s:'Parte de trás do ombro e alto das costas — ótimo pra postura.',
 x:'Pescoço/trapézio tenso.',
 e:['Carga pesada com embalo','Encolher os ombros'],
 k:'Carga leve e controle total.'},
face_pull:{n:'Face pull',g:'costas',
 p:['Corda na polia na altura do rosto. Segure com as palmas pra baixo e dê um passo pra trás.','Puxe a corda em direção ao rosto, abrindo as mãos pros lados das orelhas.','Cotovelos altos, na linha dos ombros; junte as escápulas.','Volte devagar.'],
 s:'Parte de trás do ombro e alto das costas.',
 x:'Dor na frente do ombro ou lombar arqueando.',
 e:['Puxar pra baixo em direção ao peito','Usar carga pesada demais'],
 k:'Excelente pra postura de quem passa o dia sentada no computador.'},
barra_assistida:{n:'Barra fixa assistida',g:'costas',c:1,
 p:['Ajoelhe (ou pise) na plataforma do aparelho e segure a barra um pouco mais aberta que os ombros.','Peito aberto, ombros longe das orelhas.','Puxe o corpo pra cima levando os cotovelos em direção às costelas até o queixo passar da barra.','Desça devagar até esticar os braços.'],
 s:'Lateral das costas.',
 x:'Dor no ombro ou cotovelo.',
 e:['Balançar o corpo','Subir só metade do caminho'],
 k:'Quanto MAIS peso no contrapeso, mais fácil. Vá diminuindo com o tempo.'},
supino_reto:{n:'Supino reto',g:'peito',c:1,
 p:['Deite no banco com os olhos embaixo da barra, pés firmes no chão.','Junte e "guarde" as escápulas (como se pusesse no bolso de trás), mantendo um leve arco natural nas costas.','Pegada um pouco mais aberta que os ombros. Desça a barra até o meio do peito, cotovelos a uns 45° do corpo.','Empurre de volta até quase esticar os braços.'],
 s:'Peito, frente do ombro e tríceps.',
 x:'Dor na frente do ombro.',
 e:['Cotovelos totalmente abertos (sobrecarrega o ombro)','Quicar a barra no peito','Tirar o bumbum do banco'],
 k:'Com carga pesada, peça pra alguém ficar de olho.'},
supino_incl:{n:'Supino inclinado',g:'peito',c:1,
 p:['Banco inclinado a uns 30°. Halteres ou barra na altura do peito.','Escápulas juntas e peito aberto.','Desça até a parte de cima do peito, cotovelos a uns 45°.','Empurre pra cima até quase esticar.'],
 s:'Parte de cima do peito e frente do ombro.',

const EQL={maquina:'Máquina',polia:'Polia',barra:'Barra',halter:'Halter',kettlebell:'Kettlebell',elastico:'Elástico',corpo:'Peso do corpo'};
/* substituto inteligente: o mais parecido em movimento, músculo e mecânica — e que ainda não está na ficha */
function simScore(a,b){const x=EX[a],y=EX[b];let sc=0;
 if((x.pats||[]).some(p=>(y.pats||[]).includes(p)))sc+=50;
 const fx=x.foco||[x.g],fy=y.foco||[y.g];
 if(fx[0]===fy[0])sc+=22;else if(fy.includes(fx[0])||fx.includes(fy[0]))sc+=10;
 sc+=Math.min(2,fx.filter(r=>fy.includes(r)).length)*5;
 if(!!x.uni===!!y.uni)sc+=8;if(!!x.c===!!y.c)sc+=6;if(!!x.iso===!!y.iso)sc+=4;if(x.g===y.g)sc+=5;
 sc-=(y.tier||3)*2;if((y.tier||3)>=4)sc-=30;return sc;}
function simWhy(a,b){const x=EX[a],y=EX[b];const t=[];
 if((x.pats||[]).some(p=>(y.pats||[]).includes(p)))t.push('Mesmo movimento');
 else if((y.foco||[])[0]===(x.foco||[])[0])t.push('Mesmo foco: '+(REG[y.foco[0]]||GROUPS[y.g]));
 else t.push('Trabalha '+(REG[(y.foco||[])[0]]||GROUPS[y.g]).toLowerCase());
 if(x.uni&&y.uni)t.push('também unilateral');
 return t.join(' · ');}
function alternatives(id,reason,exclude,target){const x=EX[id];if(!x||id==='vacuo')return [];
 const vg=r=>typeof volGroup==='function'?volGroup(r):r;const tg=target||vg((x.foco||[x.g])[0]);
 const ex=new Set(exclude||[]);
 let list=Object.keys(EX).filter(o=>o!==id&&!ex.has(o)&&o!=='vacuo');
 if(reason==='joelho')list=list.filter(o=>EX[o].kf);
 if(reason==='lombar'&&typeof LB_HEAVY!=='undefined')list=list.filter(o=>!LB_HEAVY.includes(o));
 if(reason==='ombro'&&typeof SH_HEAVY!=='undefined')list=list.filter(o=>!SH_HEAVY.includes(o));
 const heavy=['maquina','polia','barra','kettlebell'].includes(x.eq);
 if(reason==='aparelho'&&heavy)list=list.filter(o=>EX[o].eq!==x.eq);
 if(typeof profileCfg==='function'&&D.profile){const pc=profileCfg();if(reason==='aparelho')pc.lim=pc.lim||[];list=list.filter(o=>canDo(o,pc));}
 const free=['corpo','halter','elastico'];
 const sc=o=>simScore(id,o)+(reason==='aparelho'&&free.includes(EX[o].eq)?12:0);
 /* só o que é realmente parecido: mesmo movimento ou o mesmo músculo principal */
 list=list.filter(o=>simScore(id,o)>=28);
 /* mesmo músculo-alvo: num treino de glúteo, só glúteo (nada de trocar por quadríceps) */
 const pg=o=>vg((EX[o].foco||[EX[o].g])[0]);const px=pg(id);
 const same=list.filter(o=>pg(o)===tg||(px!==tg&&pg(o)===px&&(EX[o].foco||[]).some(r=>vg(r)===tg)));
 if(same.length)list=same;
 return list.sort((a,b)=>sc(b)-sc(a)).slice(0,6);}

EX_MAIS.forEach(([id,n,g,foco,tier,eq,pats,fl,p,s,x,e,k])=>{if(EX[id])return;
 EX[id]={n,g,p,s,x,e,k,foco,tier,eq,pats,mais:1};if(fl.includes('c'))EX[id].c=1;if(fl.includes('u'))EX[id].uni=1;if(fl.includes('i'))EX[id].iso=1;
 EX[id].kf=!fl.includes('K');if(fl.includes('K'))KNEE_HEAVY.push(id);if(fl.includes('L'))LB_HEAVY.push(id);if(fl.includes('S'))SH_HEAVY.push(id);if(fl.includes('P'))PREG_NO.push(id);
});

function canDo(id,cfg){const x=EX[id];if(!x)return false;
 const lim=cfg.lim||[];
 if(lim.includes('joelho')&&!x.kf)return false;
 if(lim.includes('lombar')&&LB_HEAVY.includes(id))return false;
 if(lim.includes('ombro')&&SH_HEAVY.includes(id))return false;
 if(cfg.gestante&&PREG_NO.includes(id))return false;
 const casa=cfg.local==='casa';
 if(!casa&&!cfg.gymBasic)return true;
 if(casa&&HOME_NO.includes(id))return false;
 const eq=new Set(casa?(cfg.homeEq||[]):(cfg.gymEq||[]));
 if(x.eq==='corpo'||BODY_OK.includes(id))return true;
 if(eq.has(x.eq))return true;
 if(HALTER_OK.includes(id)&&eq.has('halter'))return true;
 if(x.eq==='kettlebell'&&eq.has('halter'))return true;
 return false;}

function pickTemplate(cfg){const n=cfg.days.length,P=new Set(cfg.foci);

 if(n===2)return ['F','F'];
 if(n===3)return P.has('gluteo')?['G','U','L']:low&&!up?['L','U','P']:['L','U','F'];
 if(n===4)return P.has('gluteo')?['G','U','Q','U']:P.has('pernas')?['Q','U','P','U']:up&&!low?['U','L','U','L']:['L','U','P','U'];

function tuneSlots(type,cfg){
 const P=new Set(cfg.foci),sub=cfg.sub||{};let s=SESS[type].s.map(x=>[...x]);
 const has=k=>s.find(x=>x[0]===k);const pr=(k,p)=>{const z=has(k);if(z)z[1]=Math.min(z[1],p);};
 const lower=['G','Q','P','L','F'].includes(type),upper=['Pull','Push','U','F','B'].includes(type);
 if(P.has('gluteo')&&lower){pr('ponte',type==='Q'?4:1);pr('abducao',3);
  if(sub.gluteo==='med'){pr('abducao',2);if(type==='G'){if(!s.some(x=>x[0]==='abducao'&&x[2]==='alt'))s.push(['abducao',4,'alt']);else s.forEach(x=>{if(x[0]==='abducao'&&x[2]==='alt')x[1]=4;});}}
  if(sub.gluteo==='max'){pr('ponte',1);pr('dobradica',2);pr('unilat',3);}}
 if(P.has('pernas')&&lower){if(sub.pernas==='post'){pr('dobradica',1);pr('flexjoelho',2);}else{pr('agacha',1);pr('quadiso',3);}}
 if(P.has('costas')&&upper){pr('puxvert',1);pr('remar',2);if(sub.costas==='largura')s.push(['puxvert',3,'alt']);if(sub.costas==='postura'){s.push(['remar',3,'uni']);pr('postombro',3);}}
 if(P.has('braco')&&upper){if(!has('triceps'))s.push(['triceps',5]);if(!has('rosca'))s.push(['rosca',6]);pr('triceps',sub.braco==='biceps'?4:3);pr('rosca',sub.braco==='triceps'?5:3);}
 if(P.has('ombro')&&upper){if(!has('lateral'))s.push(['lateral',3]);pr('lateral',2);if(!has('postombro'))s.push(['postombro',5]);}
 if(P.has('peito')&&upper){pr('supino',1);if(!has('crucif'))s.push(['crucif',5]);if(sub.peito==='superior')s.push(['supino',3,'inclinado']);}

function restFor(id){const x=EX[id];if(!x)return [60,90];if(x.g==='abdomen')return [45,60];
 const comp=x.c||((x.pats||[]).some(p=>REST_COMP.includes(p))&&!x.iso);const ini=(D.profile&&D.profile.nivel)==='iniciante'||(D.profile&&D.profile.obj)==='saude';
 return comp?(ini?[90,120]:[120,180]):[60,90];}

function repRange(sets){const m=String(sets).match(/×\s*(\d+)\s*(?:-\s*(\d+))?\s*(s\b|seg)?/);if(!m||m[3])return null;return [+m[1],+(m[2]||m[1])];}
function stepKg(id,w){const x=EX[id]||{};if(x.eq==='corpo')return 0;const comp=x.c||((x.pats||[]).some(p=>REST_COMP.includes(p))&&!x.iso);if(x.eq==='halter'||x.eq==='kettlebell')return w>=12?2:1;return comp?2.5:(w>=30?2.5:1);}
const LOWER=['gluteo','quadriceps','posterior','panturrilha','adutor'];
function incKg(id,w,pct){const st=stepKg(id,w);if(!st)return 0;return Math.max(st,Math.round(w*pct/st)*st);}
function upKg(id,w){return incKg(id,w,LOWER.includes((EX[id]||{}).g)?.075:.04);}
/* dentro do treino: ajusta a carga da próxima série pelo que você aguentou nesta */
function nextSetSug(id,it,w,r){const rr=repRange(it.sets);if(!rr||!(w>0))return null;const [lo,hi]=rr;
 if(r>=hi+2){const up=upKg(id,w);if(!up)return {w,msg:`Passou do alvo (${r} reps). Sem peso extra, faça mais devagar na próxima série.`};const nw=Math.round((w+up)*2)/2;return {w:nw,msg:`Ficou leve: ${r} reps (alvo ${lo}-${hi}). Na próxima série sobe pra ${nf(nw)} kg (+${nf(up)}) e mira em ${lo}-${hi}.`};}
 if(r<lo){const dn=incKg(id,w,.075);if(!dn)return {w,msg:`Abaixo do alvo (${r} reps). Descanse bem e foque na técnica.`};const nw=Math.max(0,Math.round((w-dn)*2)/2);return {w:nw,msg:`Ficou pesado: ${r} reps (alvo ${lo}-${hi}). Na próxima série tira um pouco: ${nf(nw)} kg.`};}
 if(r>=hi)return {w,msg:`No máximo do alvo (${r} reps)! Mantém ${nf(w)} kg. Se sobrar fôlego de novo, sobe na próxima série.`};
 return {w,msg:`Dentro do alvo (${r} reps). Mantém ${nf(w)} kg na próxima série.`};}
function progSug(it,prev){const rr=repRange(it.sets);if(!prev||!rr||!(prev.weight>0))return null;const [lo,hi]=rr;const n=nSets(it.sets);
 const S=prev.sets&&prev.sets.length?prev.sets:[{w:prev.weight,r:prev.reps}];const L=S[S.length-1];const wv=L.w||prev.weight;
 if(!L.r)return {w:wv,r:lo+'-'+hi,txt:nf(wv)+' kg × '+lo+'-'+hi,why:'Anote as repetições pra eu sugerir quando subir a carga.'};
 const allTop=S.length>=Math.min(n,2)&&S.every(z=>z.w>=wv&&(z.r||0)>=hi);
 if(allTop||L.r>=hi+2){const st=upKg(it.exId,wv);if(!st)return {w:wv,r:hi+1,txt:'tente '+(hi+1)+'+ repetições',why:'Você passou do alvo. Sem peso extra, aumente as repetições ou faça o movimento mais devagar.'};
  const nw=Math.round((wv+st)*2)/2;return {w:nw,r:lo,txt:nf(nw)+' kg × '+lo+'-'+hi,why:allTop?`Na última você fez ${hi} ou mais em todas as séries com ${nf(wv)} kg. Hora de subir só um pouquinho (+${nf(st)} kg) e voltar pro mínimo de repetições.`:`Na última série você passou do alvo com ${nf(wv)} kg. Sobe só um pouquinho (+${nf(st)} kg).`};}
 if(L.r<lo)return {w:wv,r:lo,txt:nf(wv)+' kg × '+lo+'-'+hi,why:'Na última ficou abaixo do mínimo de repetições. Mantenha a carga (ou tire um pouco) até conseguir '+lo+' com boa técnica.'};
 const alvo=Math.min(hi,L.r+1);return {w:wv,r:alvo,txt:nf(wv)+' kg × '+alvo+' reps',why:'Mantenha a carga e tente 1 repetição a mais que da última vez. Quando chegar a '+hi+' em todas as séries, eu aviso pra subir.'};}

function setsFor(id,cfg,main){const x=EX[id],o=cfg.obj||'emagrecer',ini=cfg.nivel==='iniciante',u=x.uni?' (cada lado)':'';
 if(id==='vacuo')return '3-5 × 15-20s';

 if(x.pats.includes('abducao'))return '3 × 15-20'+u;
 if(x.c){if(main&&!ini)return (o==='musculo'?'4 × 6-10':o==='saude'?'3 × 8-12':'4 × 8-12')+u;return (ini?'3 × 10-12':o==='musculo'?'3 × 8-12':'3 × 10-12')+u;}

const volGroup=r=>Object.keys(VOLG).find(k=>VOLG[k].includes(r));

function volCap(g,cfg){const ini=cfg.nivel==='iniciante';
 if(cfg.foci.includes('corpo'))return ini?12:16;if(isPrio(g,cfg))return ini?14:22;return g==='abdomen'?8:(ini?9:12);}

function addVol(vol,id,sets){const n=nSets(sets);const seen={};EX[id].foco.forEach((r,i)=>{const g=volGroup(r);if(!g)return;const w=i===0?n:n/2;if(w>(seen[g]||0))seen[g]=w;});Object.entries(seen).forEach(([g,w])=>vol[g]=(vol[g]||0)+w);}

const FILL_LOW=['ponte','dobradica','abducao','flexjoelho','extquad','unilat','pant'],FILL_UP=['remar','puxvert','lateral','postombro','triceps','rosca','supino'];
function pickFor(slot,hint,cfg,used,usedWeek,vol,main,sv){
 const cands=[...new Set(SLOT[slot].pats.flatMap(p=>PAT[p]||[]))].filter(id=>EX[id]&&EX[id].tier<=3&&!used.has(id)&&canDo(id,cfg));
 cands.sort((a,b)=>scoreEx(a,slot,hint,cfg,usedWeek)-scoreEx(b,slot,hint,cfg,usedWeek));
 for(const id of cands){const sets=setsFor(id,cfg,main&&!!EX[id].c);if(vol&&!fitsVol(vol,id,sets,cfg,sv))continue;return {id,sets};}
 return null;}
function planSession(type,cfg,usedWeek,count,vol){
 const slots=tuneSlots(type,cfg).sort((a,b)=>a[1]-b[1]);
 const used=new Set(),items=[],sv={},usedSlots=new Set();
 const take=(slot,pr,hint)=>{const r=pickFor(slot,hint,cfg,used,usedWeek,vol,pr<=1,sv);if(!r)return;used.add(r.id);usedWeek.add(r.id);usedSlots.add(slot);if(vol){addVol(vol,r.id,r.sets);addVol(sv,r.id,r.sets);}
  items.push({exId:r.id,sets:r.sets,why:SLOT[slot].why,pr,main:pr<=1&&!!EX[r.id].c});};
 for(const [slot,pr,hint] of slots){if(items.length>=count)break;take(slot,pr,hint);}
 if(items.length<Math.min(count,4)){const lower=['G','Q','P','L'].includes(type);(lower?FILL_LOW:FILL_UP).forEach((sl,k)=>{if(items.length<Math.min(count,4)&&!usedSlots.has(sl))take(sl,20+k,'');});}
 const ord=it=>{const x=EX[it.exId];if(x.g==='abdomen')return 9;if(x.g==='panturrilha')return 8;return (x.c?0:3)+(it.main?-1:0);};
 items.sort((a,b)=>ord(a)-ord(b));
 return items.map(it=>({exId:it.exId,sets:it.sets,why:it.why,pr:it.pr}));}
function plan(cfg){
 const tpl=pickTemplate(cfg);const P=new Set(cfg.foci);
 const base={30:4,45:5,60:6,75:7}[cfg.tempo||60]||6;const count=cfg.nivel==='iniciante'?Math.min(base,6):base;
 const usedWeek=new Set(),vol={};
 /* dias com core: com prioridade em barriga, até 3 dias (o core conta dentro do tempo); senão, 1 exercício de estabilidade em até 2 dias */
 const nCore=P.has('barriga')?Math.min(3,tpl.length):Math.min(2,tpl.length);
 const order=tpl.map((t,i)=>[i,['G','Q','P','L'].includes(t)?0:1]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);
 const coreIdx=new Set((P.has('barriga')?order.map(x=>x[0]):order.filter(x=>x[1]===1).concat(order.filter(x=>x[1]===0)).map(x=>x[0])).slice(0,nCore));
 /* monta primeiro os dias da prioridade, pra eles garantirem os exercícios-chave */
 const rel={G:'gluteo',P:'gluteo',Q:'pernas',L:'pernas',Pull:'costas',Push:'peito',U:'costas',B:'braco',C:'barriga',F:'corpo'};
 const rank=t=>P.has(rel[t])||(t==='Push'&&(P.has('ombro')||P.has('braco')))||(t==='U'&&(P.has('ombro')||P.has('braco')||P.has('peito')))||((t==='P'||t==='L')&&P.has('pernas'))?0:1;
 const days=new Array(tpl.length);
 tpl.map((t,i)=>[t,i]).sort((a,b)=>rank(a[0])-rank(b[0])||a[1]-b[1]).forEach(([t,i])=>{const c=coreIdx.has(i)&&P.has('barriga')?Math.max(3,count-1):count;
  const items=planSession(t,cfg,usedWeek,c,vol);let name=SESS[t].n;
  if(t==='Q'&&!items.some(it=>EX[it.exId].foco[0]==='quad'))name='Inferiores (poupando o joelho)';
  days[i]={type:t,name,focus:SESS[t].f,day:cfg.days[i],items};});
 [...coreIdx].sort((a,b)=>a-b).forEach((i,k)=>{const d=days[i];const add=P.has('barriga')?['coreiso','coredin']:['coreiso'];
  add.forEach(slot=>{const hint=P.has('barriga')&&k===1&&slot==='coreiso'?'obl':'';
   const r=pickFor(slot,hint,cfg,new Set(d.items.map(x=>x.exId)),usedWeek,vol,false);
   if(r){usedWeek.add(r.id);addVol(vol,r.id,r.sets);d.items.push({exId:r.id,sets:r.sets,why:SLOT[slot].why});}});
  if(P.has('barriga')&&!/Abd/.test(d.name))d.name+=' + Abdômen';});
 days.forEach(d=>d.items.forEach(it=>delete it.pr));
 return days;}

const VOLG={gluteo:['glu_max','glu_med','glu_sup'],quadriceps:['quad'],posterior:['post'],costas:['dorsal','costas_meio','post_ombro'],peito:['peito','peito_sup'],ombros:['ombro_lat','ombro_ant'],biceps:['biceps'],triceps:['triceps'],abdomen:['core','reto','obliquos']};
const VOLL={gluteo:'🍑 Glúteo',quadriceps:'🦵 Quadríceps',posterior:'🦵 Posterior',costas:'🦋 Costas',peito:'🫀 Peito',ombros:'✨ Ombros',biceps:'💪 Bíceps',triceps:'💪 Tríceps',abdomen:'🔥 Abdômen'};
const AREA2VOL={gluteo:['gluteo'],pernas:['quadriceps','posterior'],costas:['costas'],braco:['biceps','triceps'],ombro:['ombros'],peito:['peito'],barriga:['abdomen']};
function weekVolume(days){const v={};Object.keys(VOLG).forEach(k=>v[k]=0);
 days.forEach(d=>d.items.forEach(it=>{const x=EX[it.exId];if(!x)return;const n=nSets(it.sets);
  const seen={};x.foco.forEach((r,i)=>{const g=Object.keys(VOLG).find(k=>VOLG[k].includes(r));if(!g)return;const w=i===0?n:n/2;if(w>(seen[g]||0))seen[g]=w;});Object.entries(seen).forEach(([g,w])=>v[g]+=w);}));

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function generate(cfg){
 const r=rng(cfg.seed||0);
 const pools={};Object.entries(POOL).forEach(([g,p])=>{const a=[...p];if(cfg.seed){for(let i=a.length-1;i>1;i--){const j=1+Math.floor(r()*i);[a[i],a[j]]=[a[j],a[i]];}}pools[g]=a;});
 const ptr={};Object.keys(pools).forEach(g=>ptr[g]=0);
 const fg=new Set(cfg.foci.flatMap(f=>FOCUS_GROUPS[f]||[]));
 const has=(sl,g)=>sl.find(x=>x[0]===g);
 const add=(sl,g,n=1)=>{const s=has(sl,g);if(s)s[1]+=n;else sl.push([g,n]);};
 const days=TPL[cfg.days.length].map(d=>({n:d.n,f:d.f,s:d.s.map(x=>[...x])}));
 days.forEach(d=>{const s=d.s;
  if(cfg.foci.includes('gluteo')&&has(s,'gluteo'))add(s,'gluteo');
  if(cfg.foci.includes('pernas')&&has(s,'quadriceps'))add(s,'quadriceps');
  if(cfg.foci.includes('costas')&&has(s,'costas'))add(s,'costas');
  if(cfg.foci.includes('superiores')){if(has(s,'peito'))add(s,'peito');if(has(s,'ombro'))add(s,'ombro');}
  if(cfg.foci.includes('braco')){if(has(s,'costas'))add(s,'biceps');if(has(s,'peito')||has(s,'ombro'))add(s,'triceps');}
 });
 if(cfg.foci.includes('barriga')){
  const order=days.map((d,i)=>[i,d.s.reduce((a,x)=>a+x[1],0)]).sort((a,b)=>a[1]-b[1]).slice(0,Math.min(3,days.length));
  order.forEach(([i])=>{const s=days[i].s;const ab=has(s,'abdomen');if(!ab)s.push(['abdomen',2]);else if(ab[1]<2)ab[1]=2;if(!/Abd/.test(days[i].n))days[i].n+=' + Abdômen';});
 }
 const cap=(cfg.nivel==='iniciante'?7:8)+(cfg.foci.includes('barriga')?1:0);
 const key=g=>(g==='abdomen'||g==='panturrilha')?2:fg.has(g)?0:1;
 return days.map((d,i)=>{
  const flat=[];d.s.sort((a,b)=>key(a[0])-key(b[0])).forEach(([g,n])=>{for(let k=0;k<n;k++)flat.push(g);});
  while(flat.length>cap){let j=-1;for(let k=flat.length-1;k>=0;k--){if(!fg.has(flat[k])&&flat[k]!=='abdomen'){j=k;break;}}if(j<0)j=flat.length-1;flat.splice(j,1);}
  const used=new Set(),cnt={},items=[];
  flat.forEach(g=>{const pool=pools[g];let id=null;
   if(!cnt[g]&&flat.filter(x=>x===g).length>=3&&!used.has(pool[0]))id=pool[0];
   else for(let k=0;k<pool.length;k++){const c=pool[(ptr[g]+k)%pool.length];if(!used.has(c)){id=c;ptr[g]=(ptr[g]+k+1)%pool.length;break;}}
   cnt[g]=(cnt[g]||0)+1;if(id){used.add(id);items.push({exId:id,sets:rec(id)});}});
  const ord=it=>{const x=EX[it.exId];if(x.g==='abdomen'||x.g==='panturrilha')return 4;return (x.c?0:2)+(fg.has(x.g)?0:1);};
  items.sort((a,b)=>ord(a)-ord(b));
  return {name:d.n,focus:d.f,day:cfg.days[i],items};});
}

function aguaMetaPeso(){const p=lastWeight();if(!p)return 2000;return Math.min(3500,Math.max(1500,Math.round(p*35/100)*100));}
function aguaMeta(){if(D.aguaMetaMl>0)return D.aguaMetaMl;const p=lastWeight();if(!p)return 2000;return Math.min(3500,Math.max(1500,Math.round(p*35/100)*100));}
const fmtL=ml=>{ml=Math.round(ml||0);return ml>=1000?String(Math.round(ml/100)/10).replace('.',',')+' L':ml+' ml';};
function recips(){if(!Array.isArray(D.recipientes)||!D.recipientes.length)D.recipientes=[{n:'Copo',e:'🥤',ml:250},{n:'Garrafa',e:'🧴',ml:null}];return D.recipientes;}
function aguaAddMl(ml){const c=dayCheck(today());const before=c.aguaMl;c.aguaMl=Math.max(0,before+ml);c.aguaLog.push(ml);persist();return before<aguaMeta()&&c.aguaMl>=aguaMeta();}
function lastWeight(){const s=[...D.weights].sort((a,b)=>a.date.localeCompare(b.date));return s.length?s[s.length-1].weight:(D.profile&&D.profile.pesoInicial)||null;}
function rec(id){let r=rec0(id);if(D.profile&&D.profile.nivel==='iniciante')r=r.replace(/^4 ×/,'3 ×');return r;}
function rec0(id){const x=EX[id];const o=(D.profile&&D.profile.obj)||'emagrecer';const u=x.uni?' (cada lado)':'';
 if(id==='vacuo')return '3-5 × 15-20s';
 if(x.iso)return '3 × 30-45s'+u;
 if(x.g==='abdomen')return '3 × 15-20';
 if(x.g==='panturrilha')return '4 × 15-20';
 if(o==='musculo')return (x.c?'4 × 8-12':'3 × 10-12')+u;
 if(o==='saude')return '3 × 10-12'+u;
 return (x.c?'4 × 10-12':'3 × 12-15')+u;}
function maxReps(s){const m=String(s).match(/×\s*(\d+)\s*(?:-\s*(\d+))?\s*(s\b)?/);if(!m||m[3])return null;return +(m[2]||m[1]);}
function weekDates(){const d=new Date();const dow=(d.getDay()+6)%7;const out=[];for(let i=0;i<7;i++){out.push(keyOf(new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow+i)));}return out;}
function streak(){const set=new Set(D.activities.map(a=>a.date));const d=new Date();if(!set.has(keyOf(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(keyOf(d))){n++;d.setDate(d.getDate()-1);}return n;}
function activeDaysIn(dates){const set=new Set(D.activities.map(a=>a.date));return dates.filter(d=>set.has(d)).length;}
function monthCount(){const m=today().slice(0,7);return new Set(D.activities.filter(a=>a.date.startsWith(m)).map(a=>a.date)).size;}

/* apagar sem caixa de confirmação: apaga na hora e oferece "Desfazer" por alguns segundos */
/* cronômetro de descanso entre as séries */
let REST=null;
function restBeep(){try{const a=REST&&REST.ac;if(!a)return;[0,0.25,0.5].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(a.destination);o.start(a.currentTime+d);o.stop(a.currentTime+d+.15);});}catch(e){}}
function restStart(sec,label){restStop();REST={end:Date.now()+sec*1000,label,done:false};
 try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){REST.ac=new AC();REST.ac.resume&&REST.ac.resume();}}catch(e){}
 let b=document.getElementById('restbar');if(!b){b=document.createElement('div');b.id='restbar';document.body.appendChild(b);}
 b.innerHTML=`<span class="t" id="rest-t"></span><span class="l" id="rest-l"></span><button data-a="restAdd" data-v="-15" aria-label="Menos 15 segundos">−15</button><button data-a="restAdd" data-v="15" aria-label="Mais 15 segundos">+15</button><button data-a="restStop" aria-label="Fechar">✕</button>`;
 REST.tick=setInterval(restTick,250);restTick();}
function restTick(){if(!REST)return;const b=document.getElementById('restbar');if(!b){restStop();return;}const left=Math.ceil((REST.end-Date.now())/1000);
 if(left<=0&&!REST.done){REST.done=true;restBeep();try{navigator.vibrate&&navigator.vibrate([250,120,250]);}catch(e){}b.classList.add('fim');setTimeout(()=>{if(REST&&REST.done)restStop();},6000);}
 const v=Math.max(0,left);document.getElementById('rest-t').textContent=REST.done?'0:00':Math.floor(v/60)+':'+String(v%60).padStart(2,'0');
 document.getElementById('rest-l').textContent=REST.done?'Bora pra próxima série! 💪':'Descansando · '+REST.label;}
function restStop(){if(REST){clearInterval(REST.tick);try{REST.ac&&REST.ac.close();}catch(e){}}REST=null;const b=document.getElementById('restbar');if(b)b.remove();}
let UNDO=null;
function withUndo(msg,fn){const snap=JSON.stringify(D);fn();persist();const y=window.scrollY;render();window.scrollTo(0,y);UNDO=snap;
 const t=document.getElementById('toast');t.innerHTML=`<span>${esc(msg)}</span><button data-a="undo">Desfazer</button>`;t.classList.add('show','undo');clearTimeout(t._h);t._h=setTimeout(()=>{t.classList.remove('show','undo');UNDO=null;},6000);}

/* ================== BONEQUINHO ANIMADO (aquecimento e alongamento) ================== */
const BQ_L={T:44,N:6,R:14,UA:24,FA:23,TH:35,SH:33,FT:12};
const BQ_BASE={t:0,cv:0,hd:null,a1:8,e1:10,a2:-8,e2:10,l1:3,k1:0,l2:-3,k2:0,f1:null,f2:null};
const bqRad=d=>d*Math.PI/180;
function bqPts(p){const L=BQ_L;const P={};P.hip=[0,0];
 const sx=Math.sin(bqRad(p.t)),sy=-Math.cos(bqRad(p.t));P.sho=[L.T*sx,L.T*sy];
 // controle da curva do tronco (perpendicular, + = costas arredondadas pra trás/cima)
 const nx=-sy,ny=sx;P.ctl=[L.T/2*sx-(p.cv||0)*nx,L.T/2*sy-(p.cv||0)*ny];
 const hd=p.hd==null?p.t:p.hd;const hx=Math.sin(bqRad(hd)),hy=-Math.cos(bqRad(hd));P.neck=[P.sho[0]+L.N*hx,P.sho[1]+L.N*hy];P.head=[P.sho[0]+(L.N+L.R)*hx,P.sho[1]+(L.N+L.R)*hy];P.hd=hd;
 const seg=(o,a,len)=>[o[0]+len*Math.sin(bqRad(a)),o[1]+len*Math.cos(bqRad(a))];
 for(const i of [1,2]){const a=p['a'+i],e=p['e'+i];P['elb'+i]=seg(P.sho,a,L.UA);P['hand'+i]=seg(P['elb'+i],a+e,L.FA);
  const l=p['l'+i],k=p['k'+i];P['knee'+i]=seg(P.hip,l,L.TH);P['ank'+i]=seg(P['knee'+i],l+k,L.SH*(p['s'+i]||1));const ff=p['f'+i]==null?-(l+k):p['f'+i];P['toe'+i]=seg(P['ank'+i],l+k+90+ff,L.FT);P['heel'+i]=seg(P['ank'+i],l+k-90+ff,3);}
 return P;}
function bqLow(P,g){let m=-1e9;for(const k of (g||['hip','sho','knee1','knee2','ank1','ank2','toe1','toe2','heel1','heel2','hand1','hand2','elb1','elb2']))m=Math.max(m,P[k][1]+(k.startsWith('hand')?3:k==='hip'||k==='sho'?9:5));return g?m:Math.max(m,P.head[1]+BQ_L.R);}
const bqLerp=(a,b,u)=>{const o={};for(const k in a){o[k]=(typeof a[k]!=='number'||typeof b[k]!=='number')?(u<.5?a[k]:b[k]):a[k]+(b[k]-a[k])*u;}return o;};
const bqEase=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function bqFull(p){const o=Object.assign({},BQ_BASE,p);return o;}
/* desenha numa <svg>; mov = {kf:[[pose,holdMs],...], tr:ms, anc:'toe1', feel:['th1'], wall:dx, mat:true} */
function bqFrame(mov,time){const K=mov.kf.map(([p,h])=>[bqFull(p),h]);const tr=mov.tr||700;
 const tot=K.reduce((s,[,h],i)=>s+(mov.kf[i][2]!=null?mov.kf[i][2]:tr)+h,0);let t=time%tot;
 for(let i=0;i<K.length;i++){const [p,h]=K[i];const ti=mov.kf[i][2]!=null?mov.kf[i][2]:tr;const prev=K[(i-1+K.length)%K.length][0];if(t<ti)return bqLerp(prev,p,bqEase(t/ti));t-=ti;if(t<h)return p;t-=h;}
 return K[0][0];}
const BQ_GROUND=178,BQ_W=220;
function bqPlace(mov,p){const P=bqPts(p);const an=P[mov.anc||'ank1'];const dx=-an[0],dy=BQ_GROUND-bqLow(P,mov.gnd);
 for(const k in P)if(Array.isArray(P[k]))P[k]=[P[k][0]+dx,P[k][1]+dy];P.dy=dy;
 for(const i of [1,2]){const g=p['g'+i];if(!g)continue;let T=null;if(Array.isArray(g))T=g;else if(g==='w0'){bqH0(mov);T=mov._a0[i-1];}else if(P[g])T=P[g];if(!T)continue;bqLegIK(P,i,[T[0],T[1]+(p['gy'+i]||0)],p['kb'+i]||1,p);}
 for(const i of [1,2]){const h=p['h'+i];if(!h)continue;let T=null;if(Array.isArray(h))T=h;else if(h==='w0'){bqH0(mov);T=mov._h0[i-1];}else if(P[h])T=P[h];if(!T)continue;bqIK(P,i,T,p['eb'+i]||1);}
 return P;}
function bqIK(P,i,T,sg){const L=BQ_L,S=P.sho;let dx=T[0]-S[0],dy=T[1]-S[1];let d=Math.hypot(dx,dy);const mx=L.UA+L.FA-.5;if(d>mx){dx*=mx/d;dy*=mx/d;d=mx;}
 const th=Math.atan2(dx,dy);const c=Math.max(-1,Math.min(1,(L.UA*L.UA+d*d-L.FA*L.FA)/(2*L.UA*d)));const a=th+sg*Math.acos(c);
 P['elb'+i]=[S[0]+L.UA*Math.sin(a),S[1]+L.UA*Math.cos(a)];P['hand'+i]=[S[0]+dx,S[1]+dy];}
function bqLegIK(P,i,T,sg,p){const L1=BQ_L.TH,L2=BQ_L.SH*(p['s'+i]||1),H=P.hip;let dx=T[0]-H[0],dy=T[1]-H[1];let d=Math.hypot(dx,dy);const mx=L1+L2-.3;if(d>mx){dx*=mx/d;dy*=mx/d;d=mx;}
 const th=Math.atan2(dx,dy);const c=Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d)));const a=th+sg*Math.acos(c);const K=[H[0]+L1*Math.sin(a),H[1]+L1*Math.cos(a)];const A=[H[0]+dx,H[1]+dy];
 const sd=Math.atan2(A[0]-K[0],A[1]-K[1])*180/Math.PI;const ff=p['f'+i]==null?-sd:p['f'+i];const sg2=(o,an,len)=>[o[0]+len*Math.sin(bqRad(an)),o[1]+len*Math.cos(bqRad(an))];
 P['knee'+i]=K;P['ank'+i]=A;P['toe'+i]=sg2(A,sd+90+ff,BQ_L.FT);P['heel'+i]=sg2(A,sd-90+ff,3);}
function bqH0(mov){if(mov._h0)return;const p0=bqFull(mov.kf[0][0]);const q=Object.assign({},p0,{h1:null,h2:null,g1:null,g2:null});const P=bqPlace(mov,q);mov._h0=[P.hand1,P.hand2];mov._a0=[P.ank1,P.ank2];
 if(mov.wall==='hand1'||mov.wall==='hand2'){const h=P[mov.wall];mov._wx=h[0]<P.hip[0]?h[0]-14:h[0]+3;}}
function bqWall(mov){if(mov.wall==null)return null;if(typeof mov.wall==='number')return mov.wall;bqH0(mov);return mov._wx;}
function bqCenter(mov){if(mov._cx!=null)return mov._cx;let lo=1e9,hi=-1e9;
 mov.kf.forEach(([p])=>{const P=bqPlace(mov,bqFull(p));for(const k in P)if(Array.isArray(P[k])){lo=Math.min(lo,P[k][0]-(k==='head'?BQ_L.R:0));hi=Math.max(hi,P[k][0]+(k==='head'?BQ_L.R:0));}});
 const wx=bqWall(mov);if(wx!=null){lo=Math.min(lo,wx-4);hi=Math.max(hi,wx+14);}
 mov._cx=BQ_W/2-(lo+hi)/2;return mov._cx;}
function bqSVG(mov,time,flip){const p=bqFrame(mov,time);const P=bqPlace(mov,p);const cx=bqCenter(mov);
 const f=n=>Math.round(n*10)/10;const pt=k=>f(P[k][0])+','+f(P[k][1]);
 const line=(a,b,c,w,op)=>`<path d="M${pt(a)}L${pt(b)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none"${op?` opacity="${op}"`:''}/>`;
 const poly=(ks,c,w,op)=>`<path d="M${ks.map(pt).join('L')}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"${op?` opacity="${op}"`:''}/>`;
 const SK='#FFC83D',SH='#E8633A',PN='#0F4C45',SO='#2b3a36';
 const arm=i=>`<g${i===2?' opacity=".55"':''}>`+poly(['sho','elb'+i,'hand'+i],'#E3A41C',11.5)+poly(['sho','elb'+i,'hand'+i],SK,8)+`<circle cx="${f(P['hand'+i][0])}" cy="${f(P['hand'+i][1])}" r="5" fill="${SK}" stroke="#E3A41C" stroke-width="1.5"/></g>`;
 const leg=i=>poly(['hip','knee'+i,'ank'+i],PN,13,i===2?.5:0)+poly(['heel'+i,'toe'+i],SO,7,i===2?.5:0);
 const tor=`<path d="M${pt('hip')}Q${pt('ctl')} ${pt('sho')}" stroke="${SH}" stroke-width="21" stroke-linecap="round" fill="none"/>`;
 const hx=f(P.head[0]),hy=f(P.head[1]);
 const hr=bqRad(P.hd),dX=Math.cos(hr),dY=Math.sin(hr),fx=hx+5*dX,fy=hy+5*dY-1;
 const head=`<circle cx="${hx}" cy="${hy}" r="${BQ_L.R}" fill="${SK}" stroke="#E3A41C" stroke-width="1.5"/><circle cx="${f(fx-3.6)}" cy="${f(fy-2)}" r="1.9" fill="#3a2a1a"/><circle cx="${f(fx+3.6)}" cy="${f(fy-2)}" r="1.9" fill="#3a2a1a"/><path d="M${f(fx-3.5)} ${f(fy+3)}q3.5 3.5 7 0" stroke="#3a2a1a" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
 const mid=(a,b)=>[(P[a][0]+P[b][0])/2,(P[a][1]+P[b][1])/2];
 const SEG={th1:['hip','knee1'],th2:['hip','knee2'],sh1:['knee1','ank1'],sh2:['knee2','ank2'],ua1:['sho','elb1'],ua2:['sho','elb2'],tor:['hip','sho'],hip:['hip','hip'],sho:['sho','sho'],low:['hip','ctl'],up:['ctl','sho']};
 const pulse=.35+.25*Math.sin(time/260);
 const glow=(mov.feel||[]).map(s=>{const [a,b]=SEG[s];const m=mid(a,b);return `<circle cx="${f(m[0])}" cy="${f(m[1])}" r="15" fill="#EF3B5D" opacity="${f(pulse*10)/10}"/><circle cx="${f(m[0])}" cy="${f(m[1])}" r="${f(15+6*pulse)}" fill="none" stroke="#EF3B5D" stroke-width="2" opacity="${f((.7-pulse)*10)/10}"/>`;}).join('');
 const wx=bqWall(mov);const wall=wx!=null?`<rect x="${f(wx)}" y="40" width="10" height="${BQ_GROUND-40+6}" rx="3" fill="var(--bqwall,#d9cdb8)"/>`:'';
 return `<g transform="${flip?`translate(${BQ_W} 0) scale(-1 1) `:''}translate(${f(cx)} 0)">${wall}<rect x="${-200}" y="${BQ_GROUND}" width="600" height="6" rx="3" fill="var(--bqmat,#eadcc4)"/>
  <ellipse cx="${f(P.hip[0])}" cy="${BQ_GROUND+1}" rx="40" ry="3" fill="#000" opacity=".06"/>
  ${arm(2)}${leg(2)}${tor}${leg(1)}${head}${arm(1)}${mov.stick?`<path d="M${f(P.hand1[0]-5)} ${f(P.hand1[1]-13)}L${f(P.hand1[0]+5)} ${f(P.hand1[1]+13)}" stroke="#9A6A3A" stroke-width="6" stroke-linecap="round"/>`:''}${glow}</g>`;}

const LIE={t:-90,hd:-90,a1:90,e1:0,a2:90,e2:0,l1:130,k1:-120,l2:128,k2:-118};

function alRegion(w){let lo=0,up=0;(w&&w.items||[]).forEach(it=>{const g=(EX[it.exId]||{}).g;if(LOWER.includes(g))lo++;else if(AL_UP.includes(g))up++;});
 if(lo&&lo>=up*2)return 'pernas';if(up&&up>=lo*2)return 'cima';return 'todo';}
function alSteps(r){const out=[];AL_R[r].l.forEach(id=>{const m=MOVES[id];const d=m.d||(m.uni?30:m.tipo==='est'?30:40);
 if(m.uni){out.push({id,side:1,d});out.push({id,side:2,d});}else out.push({id,side:0,d});});return out;}
const alMin=r=>Math.max(1,Math.round(alSteps(r).reduce((s,x)=>s+x.d,0)/60));
function alBtn(r,ctx){const R=AL_R[r];const mob=R.k==='mob';
 return `<button class="alrow ${mob?'aq':'al'}" data-a="alGo" data-r="${r}"><span class="em">${mob?'🤸':'🧘'}</span><span><b>${mob?'Mobilidade':'Alongamento'} · ${alMin(r)} min</b><span>${ctx||R.l.map(id=>MOVES[id].n.split(':')[0]).join(', ')}</span></span><span class="go">▶</span></button>`;}
let AL=null;
function alOpen(r){alClose(true);try{closeSheet();}catch(e){}AL={r,tipo:AL_R[r].k==='mob'?'aq':'al',steps:alSteps(r),i:0,left:0,play:false,end:false,t0:performance.now()};AL.left=AL.steps[0].d;

 document.body.style.overflow='hidden';alDraw();AL.raf=requestAnimationFrame(alAnim);AL.iv=setInterval(alTick,200);}

 const st=AL.steps[AL.i];s.innerHTML=bqSVG(MOVES[st.id],ts-AL.t0,st.side===2);}
function alSay(t){if(D.alVoz!==false&&ttsOn())speakAll([t]);}
function alBeep(n){try{const a=AL&&AL.ac;if(!a)return;for(let k=0;k<(n||1);k++){const o=a.createOscillator(),g=a.createGain();o.frequency.value=k===(n||1)-1?990:740;g.gain.value=.18;o.connect(g);g.connect(a.destination);o.start(a.currentTime+k*.22);o.stop(a.currentTime+k*.22+.14);}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate(120);}catch(e){}}
function alAnnounce(){const st=AL.steps[AL.i];const m=MOVES[st.id];const prev=AL.steps[AL.i-1];
 if(prev&&prev.id===st.id&&st.side===2)alSay('Troque de lado.');else alSay(m.n+(st.side===1?'. Primeiro lado.':'')+'. '+(MOVE_TX[st.id].como[0]||''));}
function alTick(){if(!AL||!AL.play||AL.end)return;const now=performance.now();const dt=(now-(AL.last||now))/1000;AL.last=now;AL.left-=dt;
 const sec=Math.ceil(AL.left);if(sec<=3&&sec>0&&sec!==AL.cd){AL.cd=sec;alBeep(1);}
 if(AL.left<=0){alGoStep(AL.i+1,true);return;}
 const t=document.getElementById('al-t');if(t)t.textContent=fmtDur(Math.max(0,Math.ceil(AL.left)));
 const b=document.getElementById('al-bar');if(b)b.style.width=(100*(1-AL.left/AL.steps[AL.i].d))+'%';}
function alGoStep(i,auto){if(!AL)return;if(i>=AL.steps.length){AL.end=true;AL.play=false;alBeep(3);alSay(AL.tipo==='aq'?'Mobilidade feita! Bora treinar.':'Alongamento feito! Mandou bem.');alDraw();return;}
 i=Math.max(0,i);const same=AL.steps[AL.i]&&AL.steps[i]&&AL.steps[AL.i].id===AL.steps[i].id;AL.i=i;AL.left=AL.steps[i].d;AL.cd=null;AL.last=performance.now();if(!same)AL.t0=performance.now();
 if(auto)alBeep(2);alDraw();if(AL.play)alAnnounce();}

const BIO_FIELDS=[
 ['visceral','Gordura visceral','',/(?:gordura visceral|nivel de gordura visceral|visceral fat|visceral)[^\d]{0,30}(\d{1,2}(?:\.\d)?)/,1,30],
 ['peso','Peso','kg',/(?:^|[^a-z])(?:peso|weight)(?! ideal)[^\d]{0,25}(\d{2,3}(?:\.\d{1,2})?)/,30,250],
 ['gordura','% de gordura','%',/(?:gordura corporal|percentual de gordura|taxa de gordura|% de gordura|body fat|gordura)[^\d]{0,30}(\d{1,2}(?:\.\d)?)/,3,65],
 ['musculo','Massa muscular','kg',/(?:massa muscular esqueletica|massa muscular|muscle mass|musculo esqueletico|musculos?)[^\d]{0,30}(\d{1,3}(?:\.\d)?)/,10,90],
 ['agua','Água corporal','%',/(?:agua corporal|taxa de agua|agua|water|body water)[^\d]{0,30}(\d{2}(?:\.\d)?)/,30,80],
 ['tmb','Metabolismo basal','kcal',/(?:metabolismo basal|taxa metabolica basal|tmb|bmr|basal metabolic)[^\d]{0,30}(\d{3,4})/,800,4500]];
function parseBio(text){
 let t=norm(text).replace(/(\d),(\d)/g,'$1.$2').replace(/\s+/g,' ');
 const out={};
 BIO_FIELDS.forEach(([k,l,u,re,mn,mx])=>{const m=t.match(re);if(m){let v=parseFloat(m[1]);
  if(k==='peso'&&/^\s*(lb|lbs|libras?)\b/.test(t.slice(m.index+m[0].length,m.index+m[0].length+8)))v=Math.round(v/2.20462*10)/10;
  if(v>=mn&&v<=mx){out[k]=v;if(k==='visceral')t=t.replace(m[0],' ');}}});
 return out;}
