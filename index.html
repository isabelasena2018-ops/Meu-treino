<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF6EF">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Meu Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--a:#0F4C45;--a2:#E8633A;--bg:#FAF6EF;--ink:#1d2522;--mut:#87938e;--line:#ece6da;--soft:#fbfaf7;--card:#fff;--a2soft:#fff1ea;--asoft:#e6efed;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
a{color:inherit}
.disp{font-family:'Fraunces',Georgia,serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;position:sticky;top:0;background:var(--bg);z-index:10}
.brand{display:flex;gap:7px;align-items:center;font-weight:700;letter-spacing:2px;font-size:12px;color:var(--a)}
.ibtn{width:36px;height:36px;border-radius:36px;background:#fff;display:inline-grid;place-items:center;font-weight:700;color:var(--a);box-shadow:0 1px 3px rgba(0,0,0,.07);margin-left:6px}
.ibtn svg{width:18px;height:18px}
main{max-width:560px;margin:0 auto;padding:4px 16px calc(100px + env(safe-area-inset-bottom))}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:20}
.nbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#a3ada9;padding:4px 0}
.nbtn.on{color:var(--a)}
.nbtn svg{width:22px;height:22px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card.dark{background:var(--a);color:#FAF6EF;box-shadow:0 8px 22px rgba(15,76,69,.22)}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:1.4px;color:var(--a2);text-transform:uppercase}
.h2{font-size:26px;margin:2px 0 14px;font-weight:600;line-height:1.15}
.h3{font-size:16.5px;margin:20px 0 10px;font-weight:700}
.mut{color:var(--mut)}
.small{font-size:12.5px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0}
.chip{padding:9px 13px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:13.5px;color:#55625e}
.chip.on{background:var(--a);border-color:var(--a);color:#fff}
.lbl{display:block;font-size:12.5px;font-weight:700;color:#55625e;margin:14px 0 6px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;background:var(--soft);font-family:inherit;color:var(--ink)}
.inp:focus,.fld input:focus,.it input:focus{outline:2px solid var(--a);outline-offset:1px}
textarea.inp{resize:none;line-height:1.4}
select.inp{appearance:none;-webkit-appearance:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600;text-align:left}
.toggle:last-child{border-bottom:none}
.tg{width:44px;height:26px;border-radius:26px;background:#e3ded3;position:relative;transition:.2s;flex-shrink:0}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:20px;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on .tg{background:var(--a)}
.toggle.on .tg::after{left:21px}
.bigopt{width:100%;text-align:left;background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:5px}
.bigopt b{font-size:15.5px}
.bigopt span{font-size:13.5px;color:var(--mut);line-height:1.45}
.btn{width:100%;background:var(--a);color:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:15px;display:block;text-align:center}
.btn.alt{background:var(--a2)}
.btn.sm{padding:11px;font-size:14px}
.btn2{width:100%;background:#fff;color:var(--a);border:1.5px solid var(--a);border-radius:14px;padding:12px;font-weight:700;font-size:14.5px}
.btn2.danger{color:#c0453a;border-color:#e5b3ad}
.btnrow{display:flex;gap:8px;margin-top:10px}
.back{color:var(--a);font-weight:700;font-size:14px;padding:6px 0;margin-bottom:2px}
.hero{text-align:center;padding:calc(34px + env(safe-area-inset-top)) 10px 18px}
.hero h1{font-size:34px;margin:8px 0 4px;font-weight:600;color:var(--a)}
.hero p{margin:0;color:var(--mut)}
.chk{width:100%;display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left}
.chk .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--a);display:grid;place-items:center;flex-shrink:0;color:#fff}
.chk.on .box{background:var(--a)}
.chk .t{font-weight:600}
.chk.on .t{text-decoration:line-through;color:var(--mut)}
.chk .h{display:block;font-size:12px;color:var(--mut);font-weight:500}
.week{display:flex;justify-content:space-between;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;opacity:.9}
.wd i{width:32px;height:32px;border-radius:32px;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;font-style:normal;font-size:14px}
.wd.done i{background:var(--a2);border-color:var(--a2)}
.wd.today i{border-color:#fff}
.ex{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);border:1.5px solid transparent}
.ex.done{border-color:var(--a)}
.exn{font-weight:700;font-size:15.5px;margin:0;line-height:1.25}
.sch{font-size:13px;color:var(--a);font-weight:700}
.exbtns{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:10px;font-size:12.5px;font-weight:700;text-decoration:none}
.mini.g{background:var(--asoft);color:var(--a)}
.mini.o{background:var(--a2soft);color:var(--a2)}
.fr{display:flex;gap:8px;margin-top:10px}
.fld{width:76px}
.fld input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 6px;font-size:16px;font-weight:700;text-align:center;background:var(--soft);font-family:inherit}
.fld span{display:block;text-align:center;font-size:10.5px;color:var(--mut);font-weight:700;margin-top:3px}
.sv{flex:1;border-radius:12px;background:var(--a);color:#fff;font-weight:700;min-height:46px;align-self:flex-start;height:46px}
.last{font-size:12.5px;color:var(--mut);margin-top:9px}
.last b{color:var(--a2)}
.hint{font-size:12px;color:var(--a);background:var(--asoft);border-radius:8px;padding:5px 8px;margin-top:6px;display:inline-block;font-weight:600}
.check{width:20px;height:20px;border-radius:20px;background:var(--a);display:inline-grid;place-items:center;flex-shrink:0;color:#fff;font-size:12px}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(20,30,28,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 18px calc(26px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;animation:up .25s ease;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:5px;background:#d8d2c6;margin:0 auto 12px}
.x{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:32px;background:#fff;font-size:20px;color:var(--mut);line-height:32px}
.sec{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px}
.sec h4{margin:0 0 7px;font-size:14px}
.sec p,.sec li{font-size:14px;line-height:1.5;margin:0}
.sec ol,.sec ul{margin:0;padding-left:20px}
.sec li{margin-bottom:5px}
.sec.ok{border-left:4px solid #3b9b6e}
.sec.no{border-left:4px solid #d64545}
.sec.warn{border-left:4px solid #e0a526}
.sec.care{border-left:4px solid var(--a)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
.it{display:flex;align-items:center;gap:6px;background:#fff;border-radius:14px;padding:10px 8px 10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.it .nm{flex:1;min-width:0}
.it .nm b{display:block;font-size:14px;line-height:1.25}
.it input{width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;font-size:16px;background:var(--soft);font-family:inherit}
.ib{width:32px;height:32px;border-radius:9px;background:var(--soft);color:var(--mut);font-weight:700;display:grid;place-items:center;flex-shrink:0}
.ib.del{color:#c0453a}
.li{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;background:#fff;border-radius:14px;margin-bottom:8px;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.li b{font-size:14.5px;display:block}
.li span{font-size:12px;color:var(--mut)}
.tag{font-size:11px;font-weight:700;color:var(--a);background:var(--asoft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fc{background:#fff;border-radius:16px;padding:14px;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:4px}
.fc .em{font-size:26px}
.fc b{font-size:14.5px}
.fc span{font-size:12px;color:var(--mut)}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.at{background:#fff;border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;border:1.5px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.04);text-align:center}
.at .em{font-size:24px}
.at.on{border-color:var(--a);background:var(--asoft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:#fff;border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.st b{display:block;font-size:25px;font-family:'Fraunces',serif;color:var(--a);font-weight:600}
.st span{font-size:11.5px;color:var(--mut);font-weight:600}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.bar{height:12px;border-radius:12px;background:rgba(255,255,255,.18);overflow:hidden}
.barfill{height:100%;background:var(--a2);border-radius:12px;transition:width .5s}
.cups{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.cup{width:20px;height:28px;border-radius:0 0 7px 7px;border:1.5px solid var(--a)}
.round{width:38px;height:38px;border-radius:38px;border:1.5px solid var(--a);display:inline-grid;place-items:center;background:#fff;color:var(--a);font-size:20px;font-weight:700}
.round.f{background:var(--a);color:#fff}
details.card summary{font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary .chev{transform:rotate(180deg)}
.chev{transition:.2s;color:var(--mut)}
.info{background:var(--asoft);border-radius:14px;padding:13px 14px;font-size:13.5px;line-height:1.5;color:#244a45;margin-bottom:12px}
.steps{margin:0;padding-left:20px}
.steps li{margin-bottom:7px;font-size:14px;line-height:1.5}
.ck{display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.bub{max-width:86%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-line;animation:fade .25s ease both;word-wrap:break-word}
.bub.bot{background:#fff;border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.bub.me{background:var(--a);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.qr{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end;margin:2px 0 10px}
.qr .chip.go{background:var(--a2);border-color:var(--a2);color:#fff}
.ckbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}
.ckin{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.ckin textarea{flex:1;border:1.5px solid var(--line);border-radius:20px;padding:10px 14px;font-size:16px;resize:none;max-height:120px;background:var(--soft);font-family:inherit;line-height:1.35;color:var(--ink)}
.ckin textarea:focus{outline:2px solid var(--a);outline-offset:0}
.cb{width:42px;height:42px;border-radius:42px;display:grid;place-items:center;flex-shrink:0;font-size:18px}
.cb.mic{background:var(--a2soft);color:var(--a2)}
.cb.mic.on{background:var(--a2);color:#fff;animation:pulse 1s infinite}
.cb.send{background:var(--a);color:#fff;font-weight:700}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(232,99,58,.22)}}
.ckcard{width:100%;text-align:left;background:var(--a2soft);border:1.5px solid var(--a2);border-radius:18px;padding:15px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.ckcard .em{font-size:30px}
.ckcard b{display:block;font-size:15.5px;color:var(--a2)}
.ckcard span{font-size:13px;color:#7a5a4c;line-height:1.4}
.empty{text-align:center;color:var(--mut);font-size:13.5px;padding:22px 10px}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
const APP_VERSION='1.8 · 09/11 10h';
/* ================== DADOS ================== */
const GROUPS={gluteo:'Glúteo',quadriceps:'Quadríceps',posterior:'Posterior de coxa',panturrilha:'Panturrilha',costas:'Costas',peito:'Peito',ombro:'Ombro',biceps:'Bíceps',triceps:'Tríceps',abdomen:'Abdômen'};

/* n=nome g=grupo c=composto iso=isométrico uni=unilateral p=passos s=sentir x=não sentir e=erros k=cuidado */
const EX={
hip_thrust:{n:'Hip thrust',g:'gluteo',c:1,
 p:['Apoie a parte de baixo das escápulas (omoplatas) no banco, com a barra ou anilha na dobra do quadril (use uma almofada).','Pés na largura do quadril, pontas levemente pra fora. No topo, a canela deve ficar na vertical — ajuste a distância dos pés pra isso.','Queixo levemente pra baixo, olhando pra frente (não pro teto). Empurre o chão pelos calcanhares e suba o quadril.','No topo, tronco e coxas alinhados: aperte forte o glúteo por 1-2s e desça controlando.'],
 s:'Glúteo queimando, principalmente no topo. Um pouco de posterior de coxa é normal.',
 x:'Dor na lombar. Se sentir muito a frente da coxa, os pés estão perto demais; se sentir muito o posterior, estão longe demais.',
 e:['Arquear a lombar no topo em vez de terminar o movimento com o glúteo','Olhar pro teto (isso puxa a lombar)','Subir rápido sem pausar no topo'],
 k:'Comece leve pra acertar a posição. No topo, pense em "encaixar" o quadril (bumbum levemente pra dentro).'},
elevacao_pelvica:{n:'Elevação pélvica no chão',g:'gluteo',
 p:['Deite de barriga pra cima, joelhos dobrados e pés no chão perto do bumbum, na largura do quadril.','Braços ao lado do corpo, abdômen firme.','Empurre pelos calcanhares e suba o quadril até o corpo ficar reto dos ombros aos joelhos.','Aperte o glúteo por 2s e desça devagar.'],
 s:'Glúteo trabalhando, um pouco de posterior de coxa.',
 x:'Lombar fazendo a força ou cãibra forte no posterior (sinal de pés longe demais).',
 e:['Subir arqueando a lombar','Deixar os joelhos abrirem ou fecharem'],
 k:'Ótima pra começar ou pra "acordar" o glúteo antes do treino. Dá pra pôr peso no quadril ou elástico nos joelhos.'},
coice_polia:{n:'Coice na polia',g:'gluteo',uni:1,
 p:['Prenda a caneleira no tornozelo e na polia baixa. Segure no aparelho e incline levemente o tronco à frente.','Joelho de apoio levemente dobrado, abdômen firme.','Leve a perna pra trás e um pouco pra cima, sem girar o quadril, até sentir o glúteo apertar.','Volte controlando, sem deixar o peso bater.'],
 s:'Glúteo da perna que está trabalhando.',
 x:'Dor na lombar (sinal de que está arqueando pra subir mais).',
 e:['Jogar a perna com embalo','Girar o quadril abrindo a perna pra fora','Arquear a lombar pra subir mais alto'],
 k:'Amplitude menor e controlada vale mais que chutar alto.'},
coice_4apoios:{n:'Coice em 4 apoios',g:'gluteo',uni:1,
 p:['Fique em 4 apoios: mãos embaixo dos ombros, joelhos embaixo do quadril.','Abdômen firme e costas retas, como uma mesa.','Com o joelho dobrado em 90°, empurre o calcanhar em direção ao teto até a coxa ficar alinhada com o tronco.','Aperte 1s no topo e desça devagar.'],
 s:'Glúteo apertando no topo.',
 x:'Lombar fazendo a força.',
 e:['Subir demais e arquear as costas','Tombar o quadril pro lado'],
 k:'Use caneleira pra progredir quando ficar fácil.'},
abducao_maquina:{n:'Abdução de quadril (máquina)',g:'gluteo',
 p:['Sente com as costas apoiadas e as pernas encaixadas nas almofadas.','Abra as pernas empurrando pra fora com a lateral das coxas.','Segure 1s aberta e volte devagar, sem deixar as placas baterem.'],
 s:'Lateral e parte de cima do glúteo (glúteo médio) queimando.',
 x:'Dor no joelho ou na virilha.',
 e:['Usar embalo','Voltar rápido deixando o peso bater'],
 k:'Inclinar o tronco à frente, segurando no aparelho, puxa mais pro glúteo máximo — vale alternar as duas formas.'},
caminhada_lateral:{n:'Caminhada lateral com elástico',g:'gluteo',
 p:['Elástico acima dos joelhos ou nos tornozelos, pés na largura do quadril.','Semi-agachamento: joelhos levemente dobrados, quadril pra trás, tronco um pouco inclinado.','Dê passos laterais sem deixar os pés se juntarem e sem levantar o tronco.','Vá 10-15 passos pra um lado e volte.'],
 s:'Lateral do glúteo queimando.',
 x:'Dor no joelho ou o joelho "entrando" pra dentro.',
 e:['Ficar em pé reta','Deixar os pés se juntarem a cada passo'],
 k:'Ótimo como aquecimento antes do treino de perna ou glúteo.'},
agach_sumo:{n:'Agachamento sumô',g:'gluteo',c:1,
 p:['Pés bem mais afastados que os ombros, pontas viradas pra fora (uns 30-45°).','Segure um halter ou kettlebell com os braços estendidos à frente do corpo.','Desça levando o quadril pra trás e pra baixo, com os joelhos indo na direção das pontas dos pés.','Suba empurrando o chão e apertando o glúteo.'],
 s:'Glúteo e parte interna da coxa.',
 x:'Dor no joelho ou na virilha.',
 e:['Joelhos caindo pra dentro','Tronco desabando pra frente'],
 k:'O joelho sempre acompanha a direção do pé.'},
bulgaro:{n:'Agachamento búlgaro',g:'gluteo',c:1,uni:1,
 p:['De costas pro banco, apoie o peito do pé de trás em cima dele.','Pé da frente bem à frente do corpo.','Incline levemente o tronco à frente (pega mais glúteo) e desça reto até a coxa da frente ficar quase paralela ao chão.','Suba empurrando pelo calcanhar da perna da frente.'],
 s:'Glúteo e coxa da perna da frente. Um alongamento na frente do quadril da perna de trás é normal.',
 x:'Dor no joelho da frente.',
 e:['Pé da frente muito perto do banco','Joelho caindo pra dentro','Usar a perna de trás pra subir'],
 k:'É difícil no começo: faça só com o peso do corpo e segure em algo pro equilíbrio.'},
stiff:{n:'Stiff',g:'posterior',c:1,
 p:['Em pé, barra ou halteres na frente das coxas, pés na largura do quadril, joelhos levemente destravados.','Leve o quadril pra trás (como se fechasse uma porta com o bumbum), descendo o peso rente às pernas.','Coluna reta o tempo todo. Desça até sentir o posterior da coxa bem alongado.','Suba empurrando o quadril pra frente e apertando o glúteo.'],
 s:'Alongamento forte no posterior da coxa na descida e glúteo na subida.',
 x:'Dor na lombar ou costas arredondando.',
 e:['Dobrar demais o joelho e virar um agachamento','Arredondar a coluna pra descer mais','Deixar o peso longe do corpo'],
 k:'A descida termina onde sua coluna começa a arredondar — não force descer mais.'},
terra_romeno:{n:'Levantamento terra romeno',g:'posterior',c:1,
 p:['Comece em pé com a barra ou halteres na frente das coxas, joelhos levemente dobrados (um pouco mais que no stiff).','Peito aberto, ombros pra trás, abdômen firme.','Empurre o quadril pra trás deslizando o peso pela coxa até um pouco abaixo do joelho.','Volte empurrando o quadril pra frente e apertando o glúteo no topo.'],
 s:'Posterior de coxa e glúteo.',
 x:'Dor ou cansaço forte na lombar.',
 e:['Arredondar as costas','Jogar o quadril pra frente demais no topo, inclinando o tronco pra trás'],
 k:'Mantenha o peso sempre encostado nas pernas.'},
agachamento:{n:'Agachamento livre',g:'quadriceps',c:1,
 p:['Barra apoiada no trapézio (não no pescoço), pés na largura dos ombros, pontas levemente pra fora.','Respire fundo, trave o abdômen e desça levando o quadril pra trás e pra baixo ao mesmo tempo.','Joelhos acompanham a direção dos pés. Desça até onde conseguir manter a coluna neutra (ideal: coxa paralela ao chão ou abaixo).','Suba empurrando o chão com o pé inteiro.'],
 s:'Coxa da frente e glúteo.',
 x:'Dor aguda no joelho ou na lombar.',
 e:['Joelho caindo pra dentro','Calcanhar saindo do chão','Bumbum "enrolando" lá embaixo'],
 k:'Aprenda primeiro sem peso ou segurando um halter na frente do peito (agachamento goblet).'},
smith:{n:'Agachamento no Smith',g:'quadriceps',c:1,
 p:['Barra apoiada no trapézio, pés um pouco à frente da linha da barra.','Destrave a barra, abdômen firme.','Desça até a coxa ficar paralela ao chão, joelhos na direção dos pés.','Suba empurrando o pé inteiro.'],
 s:'Coxa da frente e glúteo.',
 x:'Dor no joelho ou lombar.',
 e:['Pés muito embaixo da barra (sobrecarrega o joelho)','Descer sem controle'],
 k:'Pés mais à frente = mais glúteo; mais embaixo do corpo = mais quadríceps.'},
leg_press:{n:'Leg press 45°',g:'quadriceps',c:1,
 p:['Costas e bumbum bem apoiados no encosto o tempo todo.','Pés no meio da plataforma, na largura dos ombros.','Destrave e desça controlando até os joelhos formarem uns 90°.','Empurre pelo pé inteiro, sem travar os joelhos esticados no final.'],
 s:'Coxa da frente e glúteo.',
 x:'Lombar descolando do encosto ou dor no joelho.',
 e:['Descer tanto que o bumbum sai do banco','Travar o joelho esticado no topo','Joelhos fechando pra dentro'],
 k:'Pés mais em cima da plataforma = mais glúteo e posterior; mais embaixo = mais quadríceps.'},
extensora:{n:'Cadeira extensora',g:'quadriceps',
 p:['Ajuste o encosto pra que o joelho fique alinhado com o eixo do aparelho e a almofada fique no tornozelo.','Segure nas alças e mantenha o bumbum no banco.','Estenda as pernas até quase esticar e aperte a coxa 1s no topo.','Desça devagar (2-3s).'],
 s:'Frente da coxa queimando.',
 x:'Dor dentro ou na frente do joelho.',
 e:['Chutar com embalo','Tirar o bumbum do banco'],
 k:'Se o joelho incomodar, diminua a carga e a amplitude.'},
afundo:{n:'Afundo / avanço',g:'quadriceps',c:1,
 p:['Em pé, dê um passo largo à frente (ou fique parada em posição de passada).','Desça reto, como se fosse ajoelhar, até os dois joelhos ficarem em uns 90°.','Tronco reto e peso no calcanhar da perna da frente.','Suba empurrando com a perna da frente.'],
 s:'Coxa e glúteo da perna da frente.',
 x:'Dor no joelho.',
 e:['Passo curto demais','Joelho caindo pra dentro','Tronco balançando'],
 k:'Segure em algo se o equilíbrio estiver difícil.'},
hack:{n:'Agachamento hack',g:'quadriceps',c:1,
 p:['Costas bem apoiadas no encosto, ombros embaixo das almofadas.','Pés na largura dos ombros, no meio da plataforma.','Desça controlando até a coxa passar da paralela, se conseguir sem dor.','Suba empurrando o pé inteiro.'],
 s:'Quadríceps forte, um pouco de glúteo.',
 x:'Dor no joelho ou lombar descolando.',
 e:['Calcanhar saindo da plataforma','Travar o joelho no topo'],
 k:'Comece com pouca carga pra pegar a amplitude.'},
flexora_deitada:{n:'Mesa flexora',g:'posterior',
 p:['Deite de barriga pra baixo, joelhos logo fora da beirada do banco, almofada acima do calcanhar.','Quadril colado no banco; segure nas alças.','Dobre os joelhos trazendo o calcanhar em direção ao bumbum.','Volte devagar, sem deixar o peso bater.'],
 s:'Parte de trás da coxa.',
 x:'Dor na lombar ou cãibra forte (se der, pare e alongue).',
 e:['Levantar o quadril do banco','Usar embalo'],
 k:'Pontas dos pés puxadas em direção à canela ajuda a sentir mais o posterior.'},
flexora_sentada:{n:'Cadeira flexora',g:'posterior',
 p:['Sente com o joelho alinhado ao eixo do aparelho e trave a almofada sobre as coxas.','Almofada de baixo logo acima do calcanhar.','Puxe o calcanhar pra baixo e pra trás até onde conseguir.','Volte devagar.'],
 s:'Posterior da coxa.',
 x:'Dor atrás do joelho.',
 e:['Soltar o peso na volta','Tirar o bumbum do banco'],
 k:'Incline levemente o tronco à frente pra alongar mais o posterior.'},
pant_pe:{n:'Panturrilha em pé',g:'panturrilha',
 p:['Ponta dos pés na beirada de um step, degrau ou no aparelho, calcanhar livre.','Desça o calcanhar até sentir a panturrilha alongar bem.','Suba o máximo que conseguir na ponta dos pés e segure 1-2s.','Desça devagar.'],
 s:'Panturrilha queimando.',
 x:'Dor no tendão (atrás do calcanhar) ou na sola do pé.',
 e:['Subir e descer rápido "quicando"','Fazer só metade do movimento'],
 k:'O segredo da panturrilha é a pausa embaixo e em cima.'},
pant_sentada:{n:'Panturrilha sentada',g:'panturrilha',
 p:['Sente com a almofada sobre as coxas, perto do joelho, e a ponta dos pés na plataforma.','Desça o calcanhar até alongar.','Suba na ponta dos pés e segure 1-2s.','Desça devagar.'],
 s:'Panturrilha (parte mais baixa, o sóleo).',
 x:'Dor no tendão do calcanhar.',
 e:['Quicar','Amplitude curta'],
 k:'Faça devagar e com muitas repetições.'},
puxada:{n:'Puxada frente (pulldown)',g:'costas',c:1,
 p:['Sente com as coxas presas na almofada. Pegue a barra um pouco mais aberta que os ombros.','Incline o tronco levemente pra trás (uns 10-20°) e estufe o peito.','Puxe a barra até perto do queixo/peito pensando em levar os COTOVELOS pra baixo e pra trás, não as mãos.','Volte controlando até esticar os braços e sentir as costas alongarem.'],
 s:'Lateral das costas (abaixo da axila) trabalhando.',
 x:'Bíceps queimando antes das costas (puxando só com o braço) ou dor no ombro/pescoço.',
 e:['Jogar o tronco muito pra trás com embalo','Puxar atrás da nuca','Ombros subindo em direção às orelhas'],
 k:'Imagine as mãos como "ganchos": quem puxa é o cotovelo.'},
remada_curvada:{n:'Remada curvada',g:'costas',c:1,
 p:['Segure a barra ou halteres, joelhos levemente dobrados, e incline o tronco à frente (uns 45°) levando o quadril pra trás.','Coluna reta, abdômen firme, olhar pro chão um pouco à frente.','Puxe o peso em direção ao umbigo, cotovelos indo pra trás rente ao corpo.','Junte as escápulas 1s e desça controlando.'],
 s:'Meio e lateral das costas.',
 x:'Dor na lombar.',
 e:['Subir o tronco a cada repetição (embalo)','Arredondar a coluna','Puxar pro peito com o cotovelo aberto (vira exercício de ombro)'],
 k:'Se a lombar cansar antes das costas, troque pela remada máquina com apoio no peito.'},
remada_maquina:{n:'Remada máquina (apoio no peito)',g:'costas',c:1,
 p:['Ajuste o banco pra que as pegadas fiquem na altura do meio do peito.','Peito apoiado na almofada o tempo todo.','Puxe as alças levando os cotovelos pra trás e juntando as escápulas.','Volte devagar até esticar os braços.'],
 s:'Meio das costas, entre as escápulas.',
 x:'Pescoço/trapézio tenso ou ombros subindo.',
 e:['Tirar o peito do apoio','Encolher os ombros'],
 k:'Ótima opção pra quem sente a lombar na remada curvada.'},
remada_baixa:{n:'Remada baixa (polia)',g:'costas',c:1,
 p:['Sente com os pés apoiados e joelhos levemente dobrados. Pegue o triângulo.','Coluna reta e peito aberto; tronco quase na vertical.','Puxe o triângulo até a barriga, cotovelos rentes ao corpo, juntando as escápulas.','Estique os braços devagar deixando as costas alongarem, sem curvar a lombar.'],
 s:'Meio das costas, entre as escápulas.',
 x:'Dor na lombar.',
 e:['Balançar o tronco pra frente e pra trás','Encolher os ombros'],
 k:'O tronco fica parado — só braços e escápulas se movem.'},
serrote:{n:'Remada unilateral (serrote)',g:'costas',c:1,uni:1,
 p:['Apoie o joelho e a mão do mesmo lado no banco; a outra perna fica no chão.','Costas retas e paralelas ao chão; halter pendurado com o braço esticado.','Puxe o halter em direção ao quadril (não ao ombro), cotovelo rente ao corpo.','Desça devagar até esticar o braço, sentindo alongar a lateral das costas.'],
 s:'Lateral das costas.',
 x:'Dor no ombro ou só o bíceps trabalhando.',
 e:['Girar o tronco pra subir o peso','Puxar em direção ao peito'],
 k:'Pense em "serrar" em direção ao bolso de trás da calça.'},
pullover:{n:'Pullover na polia',g:'costas',
 p:['Na polia alta, com barra reta ou corda, dê um passo pra trás e incline levemente o tronco à frente.','Braços quase esticados (cotovelos levemente dobrados e fixos).','Traga a barra em arco de cima até as coxas, usando as costas.','Volte controlando até os braços passarem da linha da cabeça.'],
 s:'Lateral das costas.',
 x:'Tríceps fazendo a força (cotovelo dobrando e esticando).',
 e:['Dobrar e esticar os cotovelos','Usar o peso do corpo'],
 k:'Ótimo pra "acordar" as costas no começo do treino.'},
crucifixo_inverso:{n:'Crucifixo inverso',g:'costas',
 p:['Na máquina (voador invertido) de frente pro encosto, ou com halteres e tronco inclinado à frente.','Braços estendidos à frente, cotovelos levemente dobrados.','Abra os braços pros lados até ficarem alinhados com o corpo, juntando as escápulas.','Volte devagar.'],
 s:'Parte de trás do ombro e alto das costas — ótimo pra postura.',
 x:'Pescoço/trapézio tenso.',
 e:['Carga pesada com embalo','Encolher os ombros'],
 k:'Carga leve e controle total.'},
face_pull:{n:'Face pull',g:'costas',
 p:['Corda na polia na altura do rosto. Segure com as palmas pra baixo e dê um passo pra trás.','Puxe a corda em direção ao rosto, abrindo as mãos pros lados das orelhas.','Cotovelos altos, na linha dos ombros; junte as escápulas.','Volte devagar.'],
 s:'Parte de trás do ombro e alto das costas.',
 x:'Dor na frente do ombro ou lombar arqueando.',
 e:['Puxar pra baixo em direção ao peito','Usar carga pesada demais'],
 k:'Excelente pra postura de quem passa o dia sentada no computador.'},
barra_assistida:{n:'Barra fixa assistida',g:'costas',c:1,
 p:['Ajoelhe (ou pise) na plataforma do aparelho e segure a barra um pouco mais aberta que os ombros.','Peito aberto, ombros longe das orelhas.','Puxe o corpo pra cima levando os cotovelos em direção às costelas até o queixo passar da barra.','Desça devagar até esticar os braços.'],
 s:'Lateral das costas.',
 x:'Dor no ombro ou cotovelo.',
 e:['Balançar o corpo','Subir só metade do caminho'],
 k:'Quanto MAIS peso no contrapeso, mais fácil. Vá diminuindo com o tempo.'},
supino_reto:{n:'Supino reto',g:'peito',c:1,
 p:['Deite no banco com os olhos embaixo da barra, pés firmes no chão.','Junte e "guarde" as escápulas (como se pusesse no bolso de trás), mantendo um leve arco natural nas costas.','Pegada um pouco mais aberta que os ombros. Desça a barra até o meio do peito, cotovelos a uns 45° do corpo.','Empurre de volta até quase esticar os braços.'],
 s:'Peito, frente do ombro e tríceps.',
 x:'Dor na frente do ombro.',
 e:['Cotovelos totalmente abertos (sobrecarrega o ombro)','Quicar a barra no peito','Tirar o bumbum do banco'],
 k:'Com carga pesada, peça pra alguém ficar de olho.'},
supino_incl:{n:'Supino inclinado',g:'peito',c:1,
 p:['Banco inclinado a uns 30°. Halteres ou barra na altura do peito.','Escápulas juntas e peito aberto.','Desça até a parte de cima do peito, cotovelos a uns 45°.','Empurre pra cima até quase esticar.'],
 s:'Parte de cima do peito e frente do ombro.',
 x:'Dor no ombro.',
 e:['Banco inclinado demais (vira exercício de ombro)','Descer rápido sem controle'],
 k:'30° é o suficiente pra focar na parte de cima do peito.'},
crossover:{n:'Crossover',g:'peito',
 p:['Polias na altura dos ombros ou um pouco acima. Dê um passo à frente, um pé na frente do outro.','Cotovelos levemente dobrados e fixos.','Traga as mãos em arco até se encontrarem na frente do peito, como num abraço.','Volte devagar até sentir o peito alongar.'],
 s:'Peito apertando no meio.',
 x:'Dor no ombro ou braço fazendo toda a força.',
 e:['Dobrar e esticar os cotovelos','Voltar rápido'],
 k:'Pense em abraçar uma árvore grande.'},
crucifixo:{n:'Crucifixo com halteres',g:'peito',
 p:['Deitada no banco, halteres acima do peito com as palmas viradas uma pra outra.','Cotovelos levemente dobrados.','Abra os braços em arco até sentir o peito alongar (cotovelos na linha do corpo).','Volte em arco até em cima.'],
 s:'Peito alongando e contraindo.',
 x:'Dor na frente do ombro.',
 e:['Descer demais','Usar peso alto e dobrar muito os cotovelos'],
 k:'Use carga moderada — o foco é o alongamento controlado.'},
flexao:{n:'Flexão de braço',g:'peito',c:1,
 p:['Mãos no chão um pouco mais abertas que os ombros (ou joelhos no chão pra facilitar).','Corpo reto, abdômen e glúteo firmes.','Desça o peito em direção ao chão, cotovelos a uns 45°.','Empurre de volta.'],
 s:'Peito, tríceps e abdômen firme.',
 x:'Dor no punho, ombro ou lombar.',
 e:['Quadril caindo','Cotovelos totalmente abertos'],
 k:'Comece apoiada nos joelhos ou com as mãos num banco.'},
desenvolvimento:{n:'Desenvolvimento',g:'ombro',c:1,
 p:['Sentada com as costas apoiadas, halteres na altura das orelhas, cotovelos levemente à frente do corpo.','Abdômen firme, sem arquear demais a lombar.','Empurre os halteres pra cima até quase esticar os braços.','Desça controlando até a altura das orelhas.'],
 s:'Ombros.',
 x:'Dor ou "pinçada" no ombro, lombar arqueando.',
 e:['Arquear a lombar','Descer além do confortável'],
 k:'Se o ombro incomodar, diminua a amplitude.'},
elev_lateral:{n:'Elevação lateral',g:'ombro',
 p:['Em pé, halteres ao lado do corpo, cotovelos levemente dobrados, tronco levemente à frente.','Eleve os braços pros lados até a altura dos ombros, como se abrisse asas.','Pense em levar o halter pra longe, não pra cima. O cotovelo lidera, um pouco acima do punho.','Desça devagar (2s).'],
 s:'Lateral do ombro queimando.',
 x:'Trapézio (pescoço) fazendo a força.',
 e:['Subir acima do ombro encolhendo o pescoço','Balançar o corpo'],
 k:'Peso leve mesmo: é normal usar 2 a 5 kg.'},
elev_frontal:{n:'Elevação frontal',g:'ombro',
 p:['Em pé, halteres na frente das coxas.','Eleve os braços à frente até a altura dos ombros, cotovelos levemente dobrados.','Desça devagar.'],
 s:'Frente do ombro.',
 x:'Lombar fazendo a força.',
 e:['Jogar o corpo pra trás','Subir acima da cabeça'],
 k:'Pode alternar um braço de cada vez.'},
rosca_direta:{n:'Rosca direta',g:'biceps',
 p:['Em pé, barra ou halteres com as palmas pra frente, cotovelos colados ao lado do corpo.','Dobre os cotovelos trazendo o peso até a altura do peito, sem mover os cotovelos pra frente.','Aperte o bíceps 1s no topo.','Desça devagar até quase esticar.'],
 s:'Bíceps (frente do braço).',
 x:'Dor no punho, cotovelo ou lombar.',
 e:['Balançar o tronco','Levar o cotovelo pra frente'],
 k:'A descida lenta é metade do exercício.'},
rosca_martelo:{n:'Rosca martelo',g:'biceps',
 p:['Halteres com as palmas viradas uma pra outra (como segurar um martelo).','Cotovelos colados ao corpo.','Suba até a altura do ombro e desça devagar.'],
 s:'Bíceps e antebraço.',
 x:'Dor no punho.',
 e:['Balançar o corpo','Cotovelo saindo do lugar'],
 k:'Deixa o braço com aspecto mais "cheio".'},
rosca_alternada:{n:'Rosca alternada',g:'biceps',
 p:['Halteres ao lado do corpo.','Suba um braço girando a palma pra cima durante o movimento.','Desça devagar e troque o braço.'],
 s:'Bíceps.',
 x:'Dor no cotovelo.',
 e:['Embalo do corpo','Descer rápido'],
 k:'Foque em girar o punho pra cima no topo.'},
triceps_corda:{n:'Tríceps corda',g:'triceps',
 p:['Na polia alta, segure a corda com os cotovelos colados ao corpo e o tronco levemente à frente.','Empurre a corda pra baixo até esticar os braços, abrindo as pontas no final.','Segure 1s e volte até os cotovelos formarem uns 90°, sem mexer os cotovelos.'],
 s:'Parte de trás do braço.',
 x:'Dor no cotovelo ou ombro fazendo força.',
 e:['Cotovelo saindo do lugar','Usar o peso do corpo'],
 k:'O tríceps é 2/3 do braço — é ele que deixa o braço "durinho".'},
triceps_testa:{n:'Tríceps testa',g:'triceps',
 p:['Deitada no banco, barra W ou halteres com os braços esticados acima do peito.','Dobre só os cotovelos, descendo o peso em direção à testa.','Cotovelos apontados pro teto, sem abrir.','Estique de volta.'],
 s:'Parte de trás do braço.',
 x:'Dor no cotovelo.',
 e:['Abrir os cotovelos','Mexer os ombros junto'],
 k:'Use carga moderada e desça com controle.'},
triceps_frances:{n:'Tríceps francês',g:'triceps',
 p:['Sentada, segure um halter com as duas mãos acima da cabeça.','Dobre os cotovelos descendo o halter atrás da cabeça.','Cotovelos apontados pra frente/cima, perto da cabeça.','Estique os braços de volta.'],
 s:'Tríceps alongando e contraindo.',
 x:'Dor no ombro ou cotovelo.',
 e:['Abrir os cotovelos','Arquear a lombar'],
 k:'Abdômen firme pra proteger a lombar.'},
mergulho_banco:{n:'Mergulho no banco',g:'triceps',c:1,
 p:['Mãos na beirada do banco, dedos pra frente, pernas à frente (dobradas = mais fácil).','Desça dobrando os cotovelos até uns 90°.','Suba empurrando com os braços.'],
 s:'Tríceps.',
 x:'Dor na frente do ombro.',
 e:['Descer demais','Abrir os cotovelos pros lados'],
 k:'Se o ombro incomodar, troque pelo tríceps corda.'},
prancha:{n:'Prancha',g:'abdomen',iso:1,
 p:['Apoie os antebraços no chão, cotovelos embaixo dos ombros.','Estique as pernas com a ponta dos pés no chão.','Corpo reto da cabeça aos calcanhares: aperte o glúteo e puxe o umbigo pra dentro.','Respire normalmente e segure o tempo.'],
 s:'Barriga inteira trabalhando. Tremer é normal!',
 x:'Dor na lombar (quadril caindo) ou só ombro cansando.',
 e:['Quadril caindo','Bumbum muito alto','Prender a respiração'],
 k:'Melhor 20s perfeitos que 60s com o quadril caindo. Iniciante: joelhos no chão.'},
prancha_lateral:{n:'Prancha lateral',g:'abdomen',iso:1,uni:1,
 p:['Deite de lado, apoiada no antebraço (cotovelo embaixo do ombro).','Pernas esticadas uma sobre a outra (ou joelhos dobrados pra facilitar).','Suba o quadril até o corpo ficar reto.','Segure e troque de lado.'],
 s:'Lateral da barriga (oblíquos).',
 x:'Dor no ombro de apoio.',
 e:['Quadril caindo','Corpo girando pra frente'],
 k:'Comece com os joelhos apoiados.'},
abdominal_supra:{n:'Abdominal supra (crunch)',g:'abdomen',
 p:['Deitada, joelhos dobrados, pés no chão. Mãos cruzadas no peito ou atrás da cabeça sem puxar.','Solte o ar e "enrole" o tronco tirando as escápulas do chão.','Segure 1s e desça devagar.'],
 s:'Parte de cima da barriga.',
 x:'Dor no pescoço.',
 e:['Puxar a cabeça com as mãos','Subir com embalo'],
 k:'Imagine uma laranja entre o queixo e o peito.'},
elev_pernas:{n:'Elevação de pernas',g:'abdomen',
 p:['Deitada de barriga pra cima, mãos ao lado do corpo ou embaixo do bumbum.','Lombar colada no chão.','Suba as pernas (esticadas ou dobradas) até 90° e desça devagar sem encostar no chão.'],
 s:'Parte de baixo da barriga.',
 x:'Lombar descolando do chão ou doendo.',
 e:['Descer as pernas rápido','Arquear a lombar'],

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function generate(cfg){
 const r=rng(cfg.seed||0);
 const pools={};Object.entries(POOL).forEach(([g,p])=>{const a=[...p];if(cfg.seed){for(let i=a.length-1;i>1;i--){const j=1+Math.floor(r()*i);[a[i],a[j]]=[a[j],a[i]];}}pools[g]=a;});
 const ptr={};Object.keys(pools).forEach(g=>ptr[g]=0);
 const fg=new Set(cfg.foci.flatMap(f=>FOCUS_GROUPS[f]||[]));
 const has=(sl,g)=>sl.find(x=>x[0]===g);
 const add=(sl,g,n=1)=>{const s=has(sl,g);if(s)s[1]+=n;else sl.push([g,n]);};
 const days=TPL[cfg.days.length].map(d=>({n:d.n,f:d.f,s:d.s.map(x=>[...x])}));
 days.forEach(d=>{const s=d.s;
  if(cfg.foci.includes('gluteo')&&has(s,'gluteo'))add(s,'gluteo');
  if(cfg.foci.includes('pernas')&&has(s,'quadriceps'))add(s,'quadriceps');
  if(cfg.foci.includes('costas')&&has(s,'costas'))add(s,'costas');
  if(cfg.foci.includes('superiores')){if(has(s,'peito'))add(s,'peito');if(has(s,'ombro'))add(s,'ombro');}
  if(cfg.foci.includes('braco')){if(has(s,'costas'))add(s,'biceps');if(has(s,'peito')||has(s,'ombro'))add(s,'triceps');}
 });
 if(cfg.foci.includes('barriga')){
  const order=days.map((d,i)=>[i,d.s.reduce((a,x)=>a+x[1],0)]).sort((a,b)=>a[1]-b[1]).slice(0,Math.min(3,days.length));
  order.forEach(([i])=>{const s=days[i].s;const ab=has(s,'abdomen');if(!ab)s.push(['abdomen',2]);else if(ab[1]<2)ab[1]=2;if(!/Abd/.test(days[i].n))days[i].n+=' + Abdômen';});
 }
 const cap=(cfg.nivel==='iniciante'?7:8)+(cfg.foci.includes('barriga')?1:0);
 const key=g=>(g==='abdomen'||g==='panturrilha')?2:fg.has(g)?0:1;
 return days.map((d,i)=>{
  const flat=[];d.s.sort((a,b)=>key(a[0])-key(b[0])).forEach(([g,n])=>{for(let k=0;k<n;k++)flat.push(g);});
  while(flat.length>cap){let j=-1;for(let k=flat.length-1;k>=0;k--){if(!fg.has(flat[k])&&flat[k]!=='abdomen'){j=k;break;}}if(j<0)j=flat.length-1;flat.splice(j,1);}
  const used=new Set(),cnt={},items=[];
  flat.forEach(g=>{const pool=pools[g];let id=null;
   if(!cnt[g]&&flat.filter(x=>x===g).length>=3&&!used.has(pool[0]))id=pool[0];
   else for(let k=0;k<pool.length;k++){const c=pool[(ptr[g]+k)%pool.length];if(!used.has(c)){id=c;ptr[g]=(ptr[g]+k+1)%pool.length;break;}}
   cnt[g]=(cnt[g]||0)+1;if(id){used.add(id);items.push({exId:id,sets:rec(id)});}});
  const ord=it=>{const x=EX[it.exId];if(x.g==='abdomen'||x.g==='panturrilha')return 4;return (x.c?0:2)+(fg.has(x.g)?0:1);};
  items.sort((a,b)=>ord(a)-ord(b));
  return {name:d.n,focus:d.f,day:cfg.days[i],items};});
}

/* ---------- Instalar como app ---------- */
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let DEFERRED=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;if(UI.view==='hoje'&&D.profile)render();});
window.addEventListener('appinstalled',()=>{DEFERRED=null;toast('App instalado! 🎉');});
function installCard(){
 if(isStandalone()||D.installDismissed)return '';
 const how=DEFERRED?`<button class="btn alt sm" data-a="install">📲 Instalar o app</button>`
  :isIOS()?`<p style="margin:0 0 4px;font-size:14px;line-height:1.5">No Safari, toque em <b>Compartilhar</b> (o quadrado com a seta ⬆️) e depois em <b>Adicionar à Tela de Início</b>.</p>`
  :`<p style="margin:0 0 4px;font-size:14px;line-height:1.5">No navegador, toque nos <b>⋮</b> e depois em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p>`;
 return `<div class="card" style="border:1.5px solid var(--a)"><b style="font-size:15.5px;color:var(--a)">📲 Instale como app</b>
  <p class="small mut" style="margin:4px 0 10px">Fica com ícone na sua tela, abre em tela cheia e funciona até sem internet.</p>${how}
  <p class="small mut" style="margin:8px 0 0">⚠️ No iPhone, o app instalado guarda os dados separado do navegador. Se já anotou algo aqui, use <b>Perfil → Exportar</b> e depois <b>Importar</b> dentro do app.</p>
  <button class="small" style="margin-top:10px;color:var(--mut);font-weight:700" data-a="installNo">Agora não</button></div>`;}

/* ---------- Sessão de treino ---------- */
function vSessao(){
 const w=D.workouts.find(x=>x.id===UI.sessionId);if(!w){UI.view='treinos';return vTreinos();}
 const t=today();const doneW=D.activities.find(a=>a.date===t&&a.workoutId===w.id);
 const cards=w.items.map(it=>{const x=EX[it.exId];if(!x)return '';const list=D.history[it.exId]||[];const last=list[list.length-1];const done=last&&last.date===t;
  const prev=done?list[list.length-2]:last;const mr=maxReps(it.sets);
  const hint=prev&&prev.reps&&mr&&prev.reps>=mr&&!done?`<div class="hint">🔼 Você bateu ${prev.reps} reps da última vez — tente subir um pouquinho a carga!</div>`:'';
  return `<div class="ex ${done?'done':''}">
   <div style="display:flex;gap:8px;align-items:flex-start">${done?'<span class="check">✓</span>':''}<div style="flex:1"><h4 class="exn">${esc(x.n)}</h4><span class="sch">${esc(it.sets)}</span></div></div>
   <div class="exbtns"><button class="mini g" data-a="info" data-id="${it.exId}">📋 Como fazer</button><a class="mini o" href="${yt(it.exId)}" target="_blank" rel="noopener">▶ Vídeo</a></div>
   ${prev?`<div class="last"><b>Última vez:</b> ${prev.weight} kg${prev.reps?' × '+prev.reps+' reps':''} (${fmt(prev.date)})</div>`:''}
   ${done?`<div class="last"><b style="color:var(--a)">Hoje:</b> ${last.weight} kg${last.reps?' × '+last.reps+' reps':''}</div>`:''}
   ${hint}
   <div class="fr"><div class="fld"><input id="w-${it.exId}" inputmode="decimal" placeholder="${prev?prev.weight:'0'}"><span>KG</span></div><div class="fld"><input id="r-${it.exId}" inputmode="numeric" placeholder="${prev&&prev.reps?prev.reps:'reps'}"><span>REPS</span></div><button class="sv" data-a="saveSet" data-id="${it.exId}">${done?'Atualizar':'Salvar'}</button></div>
  </div>`;}).join('');
 return `<button class="back" data-a="go" data-v="treinos">← Treinos</button>
 <span class="kicker">${w.day?DAYM[w.day]:'Treino'}</span><h2 class="disp h2" style="margin-bottom:8px">${esc(w.name)}</h2>
 <div class="info">⏱️ ${OBJ[D.profile.obj||'emagrecer'].rest} Anote o peso e as repetições da sua melhor série.</div>
 ${cards||'<div class="card empty">Esse treino está vazio. Edite pra adicionar exercícios.</div>'}
 <div class="card">${doneW?`<p style="margin:0 0 10px;font-weight:700;color:var(--a)">✓ Treino registrado hoje${doneW.minutes?' · '+doneW.minutes+' min':''}</p>`:''}
  <label class="lbl" style="margin-top:0">Quanto tempo durou? (min)</label>
  <input class="inp" id="fin-min" inputmode="numeric" placeholder="ex: 60" value="${doneW&&doneW.minutes?doneW.minutes:''}">
  <button class="btn alt" style="margin-top:10px" data-a="finish" data-id="${w.id}">${doneW?'Atualizar registro':'Finalizar treino 🔥'}</button></div>
 <p class="small mut" style="text-align:center">Sentiu dor forte ou nas articulações? Pare e procure orientação de um profissional de educação física.</p>`;
}

/* ---------- Progresso ---------- */
function chart(pts,goal){
 if(pts.length<2)return '';
 const W=320,H=180,L=34,R=12,T=16,B=26;
 const vals=pts.map(p=>p.v).concat(goal!=null?[goal]:[]);
 let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1;}const pv=(mx-mn)*.15;mn-=pv;mx+=pv;
 const n=pts.length;const sx=i=>L+i*(W-L-R)/(n-1);const sy=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
 const line=pts.map((p,i)=>sx(i).toFixed(1)+','+sy(p.v).toFixed(1)).join(' ');
 let lab='';pts.forEach((p,i)=>{if(n<=6||i===0||i===n-1||i===Math.floor(n/2))lab+=`<text x="${sx(i)}" y="${H-8}" font-size="10" fill="#87938e" text-anchor="middle">${p.l}</text>`;});
 const g=goal!=null?`<line x1="${L}" y1="${sy(goal)}" x2="${W-R}" y2="${sy(goal)}" stroke="#E8633A" stroke-dasharray="4 4"/><text x="${W-R}" y="${sy(goal)-5}" font-size="10" fill="#E8633A" text-anchor="end">meta ${goal}</text>`:'';
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
  <text x="${L-6}" y="${T+4}" font-size="10" fill="#87938e" text-anchor="end">${mx.toFixed(0)}</text><text x="${L-6}" y="${H-B}" font-size="10" fill="#87938e" text-anchor="end">${mn.toFixed(0)}</text>
  <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#ece6da"/>${g}
  <polyline points="${line}" fill="none" stroke="#0F4C45" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map((p,i)=>`<circle cx="${sx(i)}" cy="${sy(p.v)}" r="4" fill="#0F4C45"/>`).join('')}${lab}</svg>`;
}

let CK=null,REC=null;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const NUMW={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,quinze:15,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,noventa:90};
const KW=[['corrida',/\b(corri|corrida|correr|correndo|cooper)/],['caminhada',/\b(caminh|andei|andando|anda de)/],['bike',/\b(bike|bicicleta|pedal|spinning|ciclismo)/],['natacao',/\b(nadei|natacao|nadar|piscina)/],['yoga',/\b(yoga|ioga)/],['pilates',/\bpilates/],['danca',/\b(danc|zumba|ballet|bale)/],['funcional',/\b(funcional|crossfit|cross|hiit|aerobico)/],['luta',/\b(luta|muay|boxe|jiu|karate|judo)/],['alongamento',/\b(along|mobilidade)/],['esporte',/\b(futebol|volei|basquete|tenis|beach|padel|handebol)/],['musculacao',/\b(academia|musculacao|treinei|malhei|treino d|treino de|gluteo|perna|costas|superiores|braco|peito|ombro)/]];
const PER=[['manhã',/\b(manha|cedo|acordei)/],['almoço',/\balmoc/],['tarde',/\btarde\b/],['noite',/\bnoite\b/]];
function prep(s){let t=norm(s).replace(/pre[- ]?treino/g,' pretreino ');
 t=t.replace(/uma hora e meia/g,'90 min').replace(/meia hora/g,'30 min').replace(/uma hora/g,'60 min');
 t=t.replace(/\b(um|uma|dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|quinze|vinte|trinta|quarenta|cinquenta|sessenta|noventa)\b/g,m=>NUMW[m]);
 t=t.replace(/\b(\d+) e (\d)\b/g,(m,a,b)=>+a>=20?String(+a+ +b):m);
 return t;}
function detAct(c){for(const [k,re] of KW)if(re.test(c))return k;return null;}
function detPer(c){for(const [k,re] of PER)if(re.test(c))return k;return '';}
function detMin(c){let m=c.match(/(\d+)\s*h\s*(\d+)/);if(m)return +m[1]*60+ +m[2];m=c.match(/(\d+)\s*(min|minutos?)\b/);if(m)return +m[1];m=c.match(/(\d+)\s*(h|horas?)\b/);if(m)return +m[1]*60;return null;}
function detWater(t){const m=t.match(/(\d+(?:[.,]\d+)?)\s*(copos?|garrafas?|garrafinhas?|litros?|l)\b/);if(!m)return null;const n=parseFloat(m[1].replace(',','.'));return /garraf/.test(m[2])?Math.round(n*2):/^l/.test(m[2])?Math.round(n*4):Math.round(n);}
function parseMeals(s){
 const out={};const re=/(caf[eé] da manh[aã]|caf[eé]|almo[cç]o|almocei|jantar|jantei|janta|lanches?|lanchei)/gi;const mk=[];let m;
 while((m=re.exec(s))){const w=norm(m[0]);const pre=norm(s.slice(Math.max(0,m.index-12),m.index));
  const header=/(almocei|jantei|lanchei)/.test(w)||m.index<3||/[.;!?\n,]\s*$/.test(pre)||/\b(no|na|de|do|pro|pra|o|meu|minha|ao)\s*$/.test(pre);
  if(header)mk.push({i:m.index,end:re.lastIndex,w});}
 mk.forEach((x,j)=>{
  const before=norm(s.slice(Math.max(0,x.i-30),x.i));
  if(x.w.startsWith('almoc')&&/(trein|fui|corr|caminh|academia|horario|hora do|na hora|malh)/.test(before))return;
  let seg=s.slice(x.end,j+1<mk.length?mk[j+1].i:s.length).split(/[.;!?\n]/)[0];
  const parts=seg.split(',');const kept=[];
  for(const p of parts){const np=prep(p);if(kept.length&&(detAct(np)||/agua|creatina|whey|vacuo|pretreino|copo|trein/.test(np)))break;kept.push(p);}
  seg=kept.join(',').replace(/^[\s,:\-]*(eu\s+)?(comi|tomei|foi|teve|era|fiz)?\s*/i,'').replace(/[\s,]*(e|eu|tomei|comi|bebi|no|na|de)?\s*$/i,'').trim();
  if(seg.length<3)return;
  const k=x.w.startsWith('caf')?'cafe':x.w.startsWith('almoc')?'almoco':x.w.startsWith('jant')?'jantar':'lanches';
  out[k]=out[k]?out[k]+'; '+seg:seg;});
 return out;}
function parseDay(txt){
 const t=prep(txt);const r={acts:[],supps:{},agua:null,meals:parseMeals(txt),ontrack:null,none:false};
 const cl=t.split(/[,.;!?\n]|\be depois\b|\bdepois\b|\be tambem\b/).map(s=>s.trim()).filter(Boolean);
 let last=null;
 for(const c of cl){
  const neg=/\b(nao|esqueci|sem)\b/.test(c);
  if(neg&&/\b(trein|fui|malhei|fiz|consegui|deu|rolou|academia)/.test(c)&&!/\b(nao|esqueci) (tomei|bebi)/.test(c)){r.none=true;continue;}
  if(/\b(descansei|dia de descanso|folga)\b/.test(c)){r.none=true;continue;}
  c.split(/\b(?:mas|porem|so que)\b/).forEach(part=>{const ng=/\b(nao|esqueci|sem|faltou)\b/.test(part);
   [['creatina',/creatina/],['whey',/whey|proteina|shake/],['pre',/pretreino/],['vacuo',/vacuo/]].forEach(([k,re])=>{if(re.test(part))r.supps[k]=!ng;});});
  const a=detAct(c);const mi=detMin(c),pe=detPer(c);
  if(a&&!/pretreino|comi|almocei|jantei/.test(c.replace(/pretreino/,'')+'')){
   const prev=r.acts.find(x=>x.type===a);
   if(prev){if(mi&&!prev.minutes)prev.minutes=mi;if(pe&&!prev.period)prev.period=pe;last=prev;}
   else{last={type:a,minutes:mi,period:pe};r.acts.push(last);}
  }else if(last&&(mi||pe)&&!/copo|agua|litro/.test(c)){if(mi&&!last.minutes)last.minutes=mi;if(pe&&!last.period)last.period=pe;}
 }
 if(r.acts.length)r.none=false;
 r.agua=detWater(t);
 if(/comi (bem|direitinho|certinho)|alimentacao (boa|ok)|segui a dieta/.test(t))r.ontrack=true;
 if(/comi mal|exagerei|besteira|fugi da dieta|jaquei|comi muito doce/.test(t))r.ontrack=false;
 return r;}

function ckFree(txt){
 const r=parseDay(txt);const c=dayCheck(today());const L=[];
 r.acts.forEach(a=>{ckSaveAct(a);L.push(actLine(a));});
 if(r.none&&!r.acts.length){L.push('😴 Sem treino hoje');CK.q.unshift('reason');}
 const sk=Object.keys(r.supps);if(sk.length){Object.assign(c.supps,r.supps);sk.forEach(k=>{const s=SUPPS.find(x=>x.k===k);L.push((r.supps[k]?'✅ ':'⬜ ')+s.l);});
  if(ckOnSupps().every(s=>s.k in r.supps))CK.skip.add('supps');}
 if(r.agua!=null){c.agua=r.agua;L.push('💧 '+r.agua+' copos de água');CK.skip.add('agua');}
 Object.entries(r.meals).forEach(([k,v])=>{c.meals=c.meals||{};c.meals[k]=c.meals[k]?c.meals[k]+'; '+v:v;CK.skip.add('meal_'+k);L.push(MEALQ[k][0]+' '+v);});
 if(r.ontrack!=null){c.onTrack=r.ontrack;CK.skip.add('ontrack');}
 persist();
 if(!L.length){
  if(CK.freeTried){const p=prep(txt);CK.tmp={type:detAct(p)||'outro',name:detAct(p)?'':txt,minutes:detMin(p),period:detPer(p)};CK.q.unshift('act_period','act_min','act_more');return;}
  CK.freeTried=true;bot('Hmm, não peguei direitinho 😅 Vou te perguntar por partes, tá?');CK.q.unshift('start');return;}
 bot('Entendi assim:\n'+L.join('\n')+'\n\nAgora só umas perguntinhas pra completar 👇');
 if(r.acts.length)CK.q.unshift('act_more');
}

let VOICE=null;
const hasTTS=()=>typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
const ttsOn=()=>D.tts!==false&&hasTTS();
function pickVoice(){try{const vs=speechSynthesis.getVoices();return vs.find(v=>/pt[-_]BR/i.test(v.lang)&&/luciana|francisca|thalita/i.test(v.name))||vs.find(v=>/pt[-_]BR/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang))||null;}catch(e){return null;}}
if(hasTTS()){try{speechSynthesis.onvoiceschanged=()=>{VOICE=pickVoice();};}catch(e){}}
function sayClean(t){return String(t).replace(/[\p{Extended_Pictographic}\uFE0F\u200D✓✔⬜]/gu,'').replace(/·/g,',').replace(/(\d+)\s*min\b/g,'$1 minutos').replace(/(\d+)\/(\d+)/g,'$1 de $2').replace(/["“”]/g,'').replace(/\n+/g,'. ').replace(/\s+/g,' ').replace(/\s+([,.!?:])/g,'$1').replace(/([.!?,:])(\s*[.,])+/g,'$1').trim();}
function hush(){try{if(hasTTS())speechSynthesis.cancel();}catch(e){}}
function speakAll(list){if(!ttsOn()||!list.length)return;try{speechSynthesis.cancel();VOICE=VOICE||pickVoice();
 list.forEach(t=>{const c=sayClean(t);if(!c)return;const u=new SpeechSynthesisUtterance(c);u.lang='pt-BR';if(VOICE)u.voice=VOICE;u.rate=1.05;speechSynthesis.speak(u);});}catch(e){}}

 /* No iPhone o reconhecimento de voz do navegador não transcreve: usa o ditado do teclado */
 if(!SR||isIOS())return kb();
 try{REC=new SR();}catch(e){REC=null;return kb();}
 REC.lang='pt-BR';REC.interimResults=true;REC.continuous=true;
 const base=ta.value?ta.value.trim()+' ':'';let fin='',got=false;
 const wd=setTimeout(()=>{if(!got&&REC){try{REC.abort();}catch(e){}REC=null;kb();}},6000);
 REC.onresult=e=>{got=true;let it='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript+' ';else it+=r[0].transcript;}ta.value=(base+fin+it).replace(/\s+/g,' ').trimStart();grow(ta);};
 REC.onerror=e=>{clearTimeout(wd);if(e.error!=='aborted'&&e.error!=='no-speech'){REC=null;kb();}};

   S.posts=null;S.members=null;S.loading=false;LAST_SYNC='';toast('Grupo criado! Agora convida a galera 🎉');render();
  }catch(e){S.loading=false;S.err='Não consegui criar o grupo. Confere sua internet e tenta de novo.';render();}},
 socJoin:async()=>{const S=UI.soc;const code=(S.code||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<6){toast('Confere o código do convite');return;}
  S.loading=true;S.err='';render();
  try{const {db,uid,f}=await fb();const g=await f.getDoc(f.doc(db,'groups',code));
   if(!g.exists()){S.loading=false;S.err='Não achei esse grupo. Confere o código com quem te convidou.';render();return;}
   Object.assign(soc(),{groupId:code,groupName:g.data().name,isOwner:g.data().createdBy===uid});persist();UI.pendingGroup='';
   S.posts=null;S.members=null;S.loading=false;LAST_SYNC='';toast('Você entrou no '+g.data().name+'! 🎉');render();
  }catch(e){S.loading=false;S.err='Não consegui entrar agora. Confere sua internet e tenta de novo.';render();}},
 socInvite:async()=>{const url=inviteUrl();const txt=`Bora treinar junto? Entra no meu grupo "${soc().groupName}" no Meu Treino 💪\nCódigo: ${soc().groupId}`;
  try{if(navigator.share){await navigator.share({title:'Meu Treino',text:txt,url});return;}}catch(e){return;}
  try{await navigator.clipboard.writeText(txt+'\n'+url);toast('Convite copiado!');}catch(e){prompt('Copie o convite:',url);}},
 socShare:t=>{const s=soc();s.share[t.dataset.k]=!s.share[t.dataset.k];persist();LAST_SYNC='';render();},
 socEmoji:t=>{soc().emoji=t.dataset.e;persist();render();},
 socReact:async t=>{const S=UI.soc;const p=(S.posts||[]).find(x=>x.id===t.dataset.id);if(!p)return;
  try{const {db,uid,f}=await fb();p.reactions=p.reactions||{};const e=t.dataset.e;const off=p.reactions[uid]===e;
   if(off)delete p.reactions[uid];else p.reactions[uid]=e;render();
   await f.updateDoc(f.doc(db,'groups',soc().groupId,'posts',p.id),{['reactions.'+uid]:off?f.deleteField():e});
  }catch(e){toast('Não consegui reagir agora');}},
 socRemove:async t=>{if(!confirm('Remover essa pessoa do grupo?'))return;
  try{const {db,f}=await fb();await f.deleteDoc(f.doc(db,'groups',soc().groupId,'members',t.dataset.id));socLoad();}catch(e){toast('Não consegui remover agora');}},
 socLeave:async()=>{if(!confirm('Sair do grupo? Você pode entrar de novo com o código depois.'))return;
  try{const {db,uid,f}=await fb();await f.deleteDoc(f.doc(db,'groups',soc().groupId,'members',uid));}catch(e){}
  D.social=Object.assign(socDefaults(),{emoji:soc().emoji,share:soc().share});persist();UI.soc=null;render();},
 genOpen:()=>{const p=D.profile||{};UI.gen={foci:[...(p.foci||[])],days:[],nivel:p.nivel||'',obj:p.obj||'emagrecer',m:{},result:null,seed:0};PROF=null;go('gerador');},
 genFocus:t=>{const g=UI.gen,k=t.dataset.f,i=g.foci.indexOf(k);if(i>=0)g.foci.splice(i,1);else{if(g.foci.length>=3){toast('Escolha até 3 focos');return;}g.foci.push(k);}render();},
 genCount:t=>{UI.gen.days=[...DEFDAYS[t.dataset.n]];render();},
 genDay:t=>{const g=UI.gen,k=t.dataset.k,i=g.days.indexOf(k);
  if(i>=0){if(g.days.length<=2){toast('Mínimo de 2 dias');return;}g.days.splice(i,1);}
  else{if(g.days.length>=6){toast('Máximo de 6 dias — descanso também é treino 😉');return;}g.days.push(k);}
  const o=d=>DAYS.findIndex(x=>x[0]===d);g.days.sort((a,b)=>o(a)-o(b));render();},
 genLvl:t=>{UI.gen.nivel=t.dataset.v;render();},
 genObj:t=>{UI.gen.obj=t.dataset.k;render();},
 genRun:()=>{const g=UI.gen;if(!g.foci.length){toast('Escolha pelo menos um foco');return;}if(g.days.length<2){toast('Escolha quantos dias você treina');return;}
  runGen(g);render();window.scrollTo(0,0);},
 genAgain:()=>{const g=UI.gen;g.seed++;runGen(g);render();window.scrollTo(0,0);toast('Nova variação! 🔄');},
 genBack:()=>{UI.gen.result=null;render();window.scrollTo(0,0);},
 genUse:t=>{const g=UI.gen;const ws=g.result.map(w=>({id:uid(),name:w.name,focus:w.focus,day:w.day,items:w.items}));
  if(t.dataset.m==='replace'){if(D.workouts.length&&!confirm('Substituir seus treinos atuais? Seu histórico de cargas continua salvo.'))return;D.workouts=ws;}else D.workouts=D.workouts.concat(ws);
  D.profile.obj=g.obj;D.profile.nivel=g.nivel||'intermediario';D.profile.foci=[...g.foci];
  const m={};MEAS.forEach(([k])=>{const v=num(g.m[k]);if(v!=null)m[k]=v;});
  if(Object.keys(m).length){D.measures=(D.measures||[]).filter(x=>x.date!==today());D.measures.push(Object.assign({date:today()},m));}
  const pv=num(g.m.peso);if(pv!=null){D.weights=D.weights.filter(e=>e.date!==today());D.weights.push({date:today(),weight:pv});if(!D.profile.pesoInicial)D.profile.pesoInicial=pv;}
  persist();UI.gen=null;toast('Treinos salvos! 💪');go('treinos');},
 saveMeas:()=>{const m={};MEAS.forEach(([k])=>{const v=num(UI.mea[k]);if(v!=null)m[k]=v;});
  if(!Object.keys(m).length){toast('Preencha pelo menos uma medida');return;}
  D.measures=(D.measures||[]).filter(x=>x.date!==today());D.measures.push(Object.assign({date:today()},m));UI.mea={};persist();render();toast('Medidas salvas! 📏');},
 install:async()=>{if(!DEFERRED)return;DEFERRED.prompt();try{await DEFERRED.userChoice;}catch(e){}DEFERRED=null;render();},
 installNo:()=>{D.installDismissed=true;persist();render();},
 ckOpen:()=>{CK=null;go('checkin');},
 ckExit:()=>{hush();if(REC){try{REC.stop();}catch(e){}}CK=null;go('hoje');},
 ckOpt:t=>{const o=CK.opts[+t.dataset.i];if(o)ckAnswer(String(o[1]),o[0],null);},
 ckTog:t=>{CK.multi[t.dataset.k]=!CK.multi[t.dataset.k];ckPaint();},
 ckNone:()=>{Object.keys(CK.multi).forEach(k=>CK.multi[k]=false);ckAnswer('done','Nenhum',null);},
 ckDone:()=>{const on=ckOnSupps().filter(s=>CK.multi[s.k]).map(s=>s.l);ckAnswer('done',on.length?on.join(', ')+' ✓':'Nenhum',null);},
 ckSend:()=>ckSendText(),
 ckTts:t=>{D.tts=!ttsOn();persist();t.textContent=ttsOn()?'🔊 Voz ligada':'🔇 Voz desligada';
  if(ttsOn()){const last=[...CK.msgs].reverse().find(m=>m.r==='bot');if(last)speakAll([last.say!=null?last.say:last.t]);}else hush();},
 ckMic:t=>ckMic(t),
 reset:()=>{if(!confirm('Apagar TODOS os seus dados deste celular? Isso não tem volta.'))return;D=fresh();persist();PROF=null;UI.view='hoje';render();}
};

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t,e);}});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.i;if(!k)return;const v=el.value;
 if(k.startsWith('onb.'))ONB[k.slice(4)]=v;
 else if(k.startsWith('meal.')){const c=dayCheck(today());c.meals=c.meals||{};c.meals[k.slice(5)]=v;persist();}
 else if(k==='edit.name')UI.edit.name=v;
 else if(k.startsWith('edit.sets.'))UI.edit.items[+k.slice(10)].sets=v;
 else if(k==='lib.q'){UI.libQuery=v;const l=document.getElementById('liblist');if(l)l.innerHTML=libList();}
 else if(k.startsWith('act.'))UI.actForm[k.slice(4)]=v;
 else if(k.startsWith('prof.'))PROF[k.slice(5)]=v;
 else if(k.startsWith('gen.m.'))UI.gen.m[k.slice(6)]=v;
 else if(k.startsWith('mea.'))UI.mea[k.slice(4)]=v;
 else if(k==='soc.code')UI.soc.code=v;
 else if(k==='soc.gname')UI.soc.gname=v;
});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset.c;if(!k)return;
 if(k==='edit.day')UI.edit.day=el.value;
 else if(k==='prog.ex'){UI.progEx=el.value;render();}
 else if(k==='act.date')UI.actForm.date=el.value||today();
 else if(k==='import'){const file=el.files&&el.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.profile||!Array.isArray(o.workouts))throw 0;if(!confirm('Substituir os dados atuais por esse backup?'))return;D=Object.assign(fresh(),o);persist();PROF=null;UI.view='hoje';render();toast('Backup restaurado!');}catch(err){toast('Arquivo de backup inválido');}};
  r.readAsText(file);}
});

document.addEventListener('input',e=>{if(e.target.id==='ckin')grow(e.target);});
document.addEventListener('focusin',e=>{if(e.target.id==='ckin')hush();});
document.addEventListener('keydown',e=>{if(e.target.id==='ckin'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ckSendText();}});

try{const gp=new URLSearchParams(location.search).get('g');if(gp){UI.pendingGroup=gp.toUpperCase().replace(/[^A-Z0-9]/g,'');history.replaceState(null,'',location.pathname);}}catch(e){}
if(D.profile&&socOn())setTimeout(()=>syncSocial().catch(()=>{}),1500);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{try{r.update();}catch(e){}}).catch(()=>{}));

render();
</script>
</body>
</html>
